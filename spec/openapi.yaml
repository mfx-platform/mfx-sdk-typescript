            permission | server_disabled, reason, broker_id, server_id}`. The SDK raises it as UnsupportedBrokerError.
            Other 409s (state_error, conflict) keep their codes.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        default:
          $ref: '#/components/responses/Error'
