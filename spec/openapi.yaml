      operationId: createCopyFollower
      summary: Make one of your accounts follow a leader, with its own scaling, bounds, symbol map, options
        and limits
      description: |-
        The follow is checked once, here, against the account's venue, never on a signal: an option the account's venue cannot honour (copying pending orders on a venue without them, for example) is 422 `unprocessable` with `details.reason = not_on_this_venue` and `details.options` naming each one. The leader's own account cannot follow it: 422 `unprocessable` with `details.reason = follows_itself`. An account follows a leader once: a second follow while the first has not unfollowed is 409 `conflict` with `details.reason = already_following` and `details.follower_id`. A leader that is retired is 409 `state_error`; an account the leader's `who_may_join` does not admit is 422 `unprocessable` with `details.reason = not_admitted`. A ratio mode (`balance_ratio`, `equity_ratio`) needs the leader's account figures, so it cannot follow an external leader: 422 `unprocessable` with `details.reason = needs_leader_account`. Over the plan's number of followers is 409 `quota_exceeded` with `details.reason = plan_limit` and `details.limit = copy_followers`.
        With `group_id`, the group's template fills every field this request leaves out; the follower holds its own copy from then on. Risk limits are in the follower account's own currency. The answer's `mandate_version` is 1; every change makes a new version.
      x-scope: copy:write
      parameters:
      - $ref: '#/components/parameters/idempotencyKey'
