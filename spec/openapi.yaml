  /terminals/{id}/instruments:
    parameters:
    - $ref: '#/components/parameters/terminalId'
    put:
      tags:
      - terminals
      operationId: replaceTerminalInstruments
      summary: Replace a terminal's instrument list in place — same terminal, same credential, same history
      description: 'A tenant who mistyped a symbol, or whose broker renamed one, changes the list here
        instead of retiring the terminal and creating another. The list is written at once, and the terminal''s
        cell re-subscribes within a minute. Names are checked against the tenant''s own catalogue for
        the terminal''s server: the account types this terminal has reported, or, before it has reported
        any, every name the tenant''s terminals on that server have. A server the tenant has no catalogue
        for yet cannot be checked; the list is accepted and the response carries `X-MFX-Warning: instruments_unchecked`.
        The same list again changes nothing. `depth_instruments` names the symbols whose order book the
        terminal reads; the cell starts or stops reading them within the same minute.'
      x-scope: term:write
      parameters:
      - $ref: '#/components/parameters/idempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TerminalInstruments'
      responses:
        '200':
          description: the terminal, with its new list; another tenant's id is 404, never 403
          headers:
            X-MFX-Budget-Remaining:
              $ref: '#/components/headers/BudgetRemaining'
            X-MFX-Budget-Source:
              $ref: '#/components/headers/BudgetSource'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantTerminal'
        '422':
          description: 'unprocessable — more instruments than the farm carries (details `{instruments,
            max}`), a name listed twice, names the catalogue does not know (details `{unknown: [...]}`,
            up to 20), more depth symbols than the terminal may read (details `{depth_instruments, max}`)
            or depth symbols not in `instruments` (details `{not_instruments}`); depth_not_offered — the
            farm''s depth limit is 0 (details `{depth_max: 0}`)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: state_error — the terminal is DRAINING or RETIRED and has no instruments to change
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        default:
          $ref: '#/components/responses/Error'
  /terminals/{id}/drain:
    parameters:
    - $ref: '#/components/parameters/terminalId'
    post:
      tags:
      - terminals
      operationId: drainTerminal
      summary: Drain a terminal - it is closed gracefully and kept, holding no cell and not billed, until
        you resume it
      description: 'Close the terminal gracefully and keep it. A drain is a governed operation under the
        rules of restartTerminal: one lifecycle operation per terminal at a time (409 `operation_in_progress`),
        a cooldown per terminal (429 `cooldown`), open positions need `confirm_open_positions` (409 `positions_open`)
        while the platform''s open-position confirmation setting is on, the tenant rate and concurrency,
        counted with moves and retires (429 `tenant_rate`, `concurrency`), and the farm blast radius (429
        `farm_capacity`). A refusal names its rule in `error.code` and carries `Retry-After` when waiting
        helps. A drain is never queued. Offered for an ACTIVE or OFFLINE terminal; any other state is
        409 `state_error`. The answer is the terminal DRAINING. Its cell stops it as it stops a retired
        terminal; it is then DRAINED (`terminal.state_changed`) and the operation, kind `drain`, succeeds
        (`terminal.operation_changed`). A DRAINED terminal keeps its id, broker account and credential,
        instruments, depth instruments, labels, refresh rate and expert-advisor attachment record; it
        runs nothing (no MT5 session, no expert advisor), holds no cell slot, and is not billed from the
        moment it is DRAINED. It still counts toward the terminal quota (terminals that are not RETIRED)
        and toward its login''s terminal and session limits, because it keeps its account and logs in
        again when resumed. Resume it with POST /terminals/{id}/resume; retire it with DELETE /terminals/{id},
        at once since it holds nothing. A DELETE while it is DRAINING makes the drain end in RETIRED instead.
        The same Idempotency-Key answers the terminal as it now is; a different body under it is 409 `conflict`.'
      x-scope: term:write
      parameters:
      - $ref: '#/components/parameters/idempotencyKey'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TerminalDrain'
      responses:
        '202':
          description: accepted; the terminal is DRAINING, and DRAINED once its cell has stopped it
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantTerminal'
        default:
          $ref: '#/components/responses/Error'
  /terminals/{id}/resume:
    parameters:
    - $ref: '#/components/parameters/terminalId'
    post:
      tags:
      - terminals
      operationId: resumeTerminal
      summary: Resume a drained terminal - placed and logged in again exactly as a new terminal is
      description: 'Place a DRAINED terminal again. It keeps its id and goes back to REQUESTED, and from
        there it is placed and logged in exactly as a new terminal is. What can never work is refused
        now, before anything is written: its farm not taking terminals (409 `state_error`), its broker
        or server no longer supported (422 `unprocessable`, or 409 `broker_not_supported`), a usage or
        an instrument count its farm no longer offers (422). Otherwise it waits in REQUESTED until its
        farm has room, as a new terminal does, and becomes ACTIVE through the normal login. It is billed
        again from when it is ACTIVE. A terminal already REQUESTED, PROVISIONING, LOGGING_IN or ACTIVE
        is answered as it is: a resume sent twice is one resume. A DRAINING terminal is 409 `state_error`
        (resume it once it is DRAINED); so is any other state, and a suspended tenant''s resume. No quota
        is counted: a DRAINED terminal never left the terminal quota.'
      x-scope: term:write
      parameters:
      - $ref: '#/components/parameters/idempotencyKey'
      responses:
        '202':
          description: accepted; the terminal is REQUESTED (or already on its way back, as it is)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantTerminal'
        default:
          $ref: '#/components/responses/Error'
  /terminals/{id}/restart:
    parameters:
    - $ref: '#/components/parameters/terminalId'
    post:
      tags:
      - terminals
      operationId: restartTerminal
      summary: Restart a stuck terminal — governed, followed as an operation
      description: 'Close the terminal gracefully (60 s), stop it by force only if it will not close,
        relaunch it, and report SUCCEEDED only once it produces ticks again. Seven rules are checked in
        order before anything is written, the same guard the platform''s automatic recovery takes: one
        lifecycle operation per terminal at a time (409 `operation_in_progress`), a cooldown per terminal
        (429 `cooldown`), open positions need `confirm_open_positions` (409 `positions_open`) while the
        platform''s open-position confirmation setting is on (it is off unless an operator turns it on),
        a tenant rate (429 `tenant_rate`), tenant concurrency (429 `concurrency`), a farm blast radius
        (429 `farm_capacity`), and the general budget. A refusal names its rule in `error.code` and carries
        `Retry-After` when waiting helps. With `queue: true` the four busy refusals (cooldown, tenant
        rate, concurrency, farm capacity) are held instead: 202 with `state: QUEUED` and where it waits,
        started by the platform when it can, and settled EXPIRED if it has not started by `queue.expires_at`.
        A terminal has at most one waiting operation: the same kind again returns it with `duplicate:
        true`; a stronger kind replaces it (it settles SUPERSEDED); a weaker one is 409 `superseded_by_waiting`
        with `details.operation_id`. The same Idempotency-Key returns the original operation; a different
        body under it is 409.'
      x-scope: term:write
      parameters:
      - $ref: '#/components/parameters/idempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TerminalRestart'
      responses:
        '202':
          description: accepted; follow it at operations/{operation_id} or on the event stream
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationAccepted'
        default:
          $ref: '#/components/responses/Error'
  /terminals/{id}/expert-advisor:
    parameters:
    - $ref: '#/components/parameters/terminalId'
    put:
      tags:
      - expert advisors
      operationId: attachExpertAdvisor
      summary: Attach an approved version of your EA to a terminal - governed, followed as an operation;
        a trial with trading off comes first
      description: 'Refused before the operation''s rules: 409 `ea_not_approved` with the version''s state;
        409 `not_customer_code_farm`; 409 `build_mismatch` when the version was built for another MetaTrader
        build than the farm runs: after an operator moves the farm to a newer MetaTrader, the platform
        builds each approved version for it, and `details.build` says where that build stands - `queued`,
        `running` (attach again once it is done), or `failed` with `failure` in plain words (the version
        is not attachable on that build; the same bundle uploaded again tries once more); 409 `ea_attached`
        when the terminal already carries one (detach it first); 404 for another tenant''s version, or
        a symbol the terminal''s server does not list. Then the seven rules of a governed operation, as
        on restartTerminal. The operation succeeds when the terminal produces again with the build loaded
        and trading by experts off: the trial has started. A green trial goes live by itself on a demo
        account; on a real-money account it waits for confirmExpertAdvisor.'
      x-scope: ea:write
      parameters:
      - $ref: '#/components/parameters/idempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExpertAdvisorAttach'
      responses:
        '202':
          description: accepted; follow it at operations/{operation_id} or on the event stream
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationAccepted'
        default:
          $ref: '#/components/responses/Error'
    delete:
      tags:
      - expert advisors
      operationId: detachExpertAdvisor
      summary: Detach the EA from a terminal - governed; the terminal is relaunched from a fresh copy
        of its folder without it
      description: 409 `no_ea_attached` when the terminal carries none. Then the seven rules of a governed
        operation, as on restartTerminal.
      x-scope: ea:write
      parameters:
      - $ref: '#/components/parameters/idempotencyKey'
