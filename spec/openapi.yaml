      operationId: getSymbolQuote
      summary: The last price with its age — a snapshot from the tenant's own terminal, never a stream
      description: A symbol the terminal already watches answers from its latest tick. Any other symbol
        is read on demand through the terminal's command path (read-only, allowed on every usage) with
        a 5 s bound; no tick in time is 503 (`upstream_error`, details.reason `terminal_timeout`). A price
        is never returned without `age_s`. Continuous prices are `POST /md/subscriptions` on a `quote_streaming`
