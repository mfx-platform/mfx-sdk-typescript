      operationId: listDeals
      summary: Deals in a window, newest first by (time, deal), optionally of one position
      description: 'Read from the broker on demand with a read-only request through the terminal, bounded
        at 10 s. Nothing is stored: the broker is the book of record for history. `to - from` is at most
        31 days; `next_cursor` continues the window before the oldest deal returned. With `position`,
        only that position''s deals are returned: the window is still read from the broker and the other
        deals are left out, so a page can hold fewer than `limit`, and even none, while `next_cursor`
        is not null. Keep asking until it is null.'
      x-scope: acct:read
