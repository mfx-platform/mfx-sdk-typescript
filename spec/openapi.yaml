          description: 'Which rule refused the request, or which failure this is: the kind of error, not
            the HTTP status. **`x-known-values` beside this lists every code the platform sends today,
            and the list is not closed**: a new rule brings a new code, and it is added here in the release
            that sends it. A client must read a code it does not know as an error, by the HTTP status
            and `message`, and must never fail on it. A client generated from this contract gets text
            here, not a fixed set, for that reason.'
          examples:
          - state_error
          x-known-values:
            validation_error: 400, 413 or 422. The request cannot be taken as it was sent; `details` says
              which part
            auth_error: 401. The request is not signed by a key the platform knows
            forbidden: 403. The key may not do this
            not_found: 404. No such thing; also the answer for another tenant's id
            conflict: 409. The request conflicts with what already exists
            state_error: 409. The thing exists and is not in a state this can be done in
            unprocessable: '422. Well formed, and can never work as asked: an unsupported broker or server,
              a flag the farm does not offer'
            window_too_wide: 422. The time window asked for is wider than this read serves
            placement_error: 409. The terminal cannot be placed
            no_farm: 409. No farm the tenant can use fits the terminal; `details.why`
            farm_not_in_plan: 409. The farm named is not one the tenant's plan uses
            quota_exceeded: 409. A quota of the tenant's plan is reached; `details` has the quota and
              what is in use
            no_room: 409. The terminal's cell cannot carry it at what is asked
            destination_refused: 409. The cell named as a move's or a drain's destination cannot take
              the terminals; `details.reason` says why and `details.destination_node_id` names the cell
            broker_not_supported: 409. MFX does not support this broker or server now; the message says
              why
            ambiguous_symbol: 409. The symbol is listed on more than one server or account type; `details.choices`
            cursor_too_old: 409. The cursor names an event the stream no longer holds; `details.oldest`
              is the oldest it does
            no_terminal_on_server: 409. The tenant has no terminal on that server to ask
            execution_not_permitted: 403. The terminal's farm does not carry orders
            farm_frozen: 409. The terminal's farm is inside a test window; `details` names its end
            farm_disabled: 403. The operator has disabled the terminal's farm
            maintenance: 403. A maintenance window suspends this for you until `details.ends_at`; `details.window_id`,
              `details.window` (its label), `details.service` (what refused) and `details.suspended`
            depth_not_offered: '422. The terminal''s farm offers no market depth: an operator has given
              it no depth limit'
            tenant_disabled: 403. The operator has disabled the tenant
            tenant_suspended: 403. The tenant is suspended and this is not a read inside its grace
            operation_in_progress: 409. Another lifecycle operation is running on the terminal
            positions_open: 409. The terminal has open positions; send `confirm_open_positions`
            superseded_by_waiting: 409. A stronger operation is already waiting for the terminal; `details.operation_id`
            rebuild_not_supported: 409. The cell's agent is older than a rebuild needs
            attach_not_supported: 409. The cell's agent cannot attach an expert advisor yet
            not_customer_code_farm: 409. The terminal's farm does not run customer code, so it carries
