      summary: Replace a terminal's instrument list in place — same terminal, same credential, same history
      description: 'A tenant who mistyped a symbol, or whose broker renamed one, changes the list here
        instead of retiring the terminal and creating another. The list is written at once, and the terminal''s
        cell re-subscribes within a minute. Names are checked against the tenant''s own catalogue for
        the terminal''s server: the account types this terminal has reported, or, before it has reported
        any, every name the tenant''s terminals on that server have. A server the tenant has no catalogue
        for yet cannot be checked; the list is accepted and the response carries `X-MFX-Warning: instruments_unchecked`.
        The same list again changes nothing. `depth_instruments` names the symbols whose order book the
        terminal reads; the cell starts or stops reading them within the same minute.'
      x-scope: term:write
      parameters:
