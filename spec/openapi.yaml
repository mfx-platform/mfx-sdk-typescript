tags:
- name: accounts
  description: 'Your trading accounts over every venue (acct:read). One account is one trading account
    at one venue: an MT5 account (run by one terminal, or two under HA), and from the cTrader release
    a cTrader account. An MT5 account''s id is its terminal''s id, so ids you already hold name it'
- name: terminals
  description: Provision, inspect, drain and retire terminals (scope term:read / term:write)
- name: credentials
  description: Submit or rotate broker credentials. They are stored securely and the response carries
    a reference, never the secret (term:write)
- name: execution
  description: Orders and positions — signed, idempotent, per-terminal FIFO (exec:write / exec:read)
- name: account
  description: Live account state, positions, orders, deal history, the user's own spread (acct:read)
- name: md
  description: Broker catalogue, servers, symbols with trade_mode, streaming subscriptions, candles (md:read
    / md:write)
- name: farms
  description: Tenant-visible, read-only view of the tenant's farms (term:read)
- name: expert advisors
  description: 'A tenant''s own expert advisors: upload the source, read the verdict and the report, withdraw
    (ea:read / ea:write). Only for a tenant with a farm that runs customer code'
- name: usage
  description: The calling key's and its tenant's limits, where each comes from, and how much is in use
    (acct:read)
- name: risk
  description: |
    Risk Management: the tenant's own rules for its accounts, evaluated by MFX Hub, and only
    the actions the tenant authorised (risk:read / risk:write / risk:override). MFX Hub recommends no
    setting and no trade.

    **Thresholds, not caps.** A loss limit is a threshold you set, not a guaranteed cap: the broker
    fills a stop at the price it gets, and a gap, slippage or a slow broker can take an account past
    a limit before an action completes. **Only orders sent through MFX Hub can be refused before the
    broker.** Orders from the broker's app, a web terminal, an expert advisor or another application
    are seen in the next account read and can only be reacted to. **Held by the broker or by MFX.**
    Every exit-plan step says which: a broker-held step survives MFX Hub being down; an MFX-held step
    needs the cell and the terminal running.

    **The pre-trade check.** An entry (`placeOrder`) on an account with an active policy or an
    enrolled challenge is checked before its command exists. A refusal is 422 `risk_refused` with
    `details: {reason, rule, policy_id, version, used, limit, would_be}`; `reason` is one of
    `risk_entries_blocked`, `risk_daily_loss`, `risk_drawdown`, `risk_exposure_gross`,
    `risk_exposure_symbol`, `risk_open_count`, `risk_loss_at_stops`, `risk_no_stop`,
    `risk_outside_schedule`, `risk_inputs_stale` and `risk_check_unavailable`. Nothing is sent to the
    terminal. A close, a partial close, a close-by, a cancel and a trailing stop are never refused
    by a rule, even on stale inputs. A repeated Idempotency-Key returns the original command before
    any rule is checked.

    **Relaxing protection** (a higher limit, a removed action, a wider window, ending an
    activation, clearing a breach, pausing managed actions) needs a key with `risk:override` and a
    `reason`; otherwise 403 `risk_override_required`. **The entitlement.** Risk Management is the
    plan entitlement `risk_management` with its own details; a tenant without it is
    answered 403 `feature_not_entitled` on every route here.

    **The equity series** is the account channel the stream already carries (`account.snapshot`,
    `account.marks`) and, stored, `getRiskEquity`.
- name: copy
  description: |
    Copy Trading: one of your accounts, or an external signal source, leads; your other accounts
    follow it, each with its own scaling, bounds, symbol names and limits (copy:read / copy:write).
    You choose the leader, the scaling and the limits; MFX Hub executes and suggests none of them.

    **Accounts, on any venue.** Leaders and followers are accounts (`account_id`, the id
    `GET /accounts` lists), each with its `venue`; a leader and its followers may be on
    different venues. No route or event here names a terminal, a ticket or a magic number.

    **A copy is an order like any other.** It passes the follower account's Risk Management
    rules and is recorded and audited as any order is. Each follower's order is derived from the
    signal and the follower, so a copy sent twice is executed once. What became of each copy is
    on the copy log (`GET /copy/log`), with MFX Hub's time apart from the venue's, and in the
    events `copy.copied`, `copy.refused`, `copy.stopout`, `copy.drift` and
    `copy.state_changed`, on the stream's events channel and to your webhooks.

    **Checked when you follow, not when the leader trades.** A follow the follower's venue
    cannot honour is refused when it is made (422 `unprocessable`, `details.reason =
    not_on_this_venue`); `POST /copy/followers/preview` shows each symbol's match and volume
    first.

    **The plan.** Copy Trading is a feature of your plan: a tenant without it is answered 403
    `feature_not_entitled` (`details.feature = copy_trading`) on every route here, and groups
    are Enterprise only (`details.part = groups`). Leaders, followers, signals a day and the
    log's retention are limits of the plan, in `GET /usage` under `copy`; over one a create or
    a signal is 409 `quota_exceeded` with `details.reason = plan_limit`, and a leader's deal
    over one is logged `refused` with reason `plan_limit`. Copied orders are counted there and
    not limited by `commands_per_s`.
- name: stream
  description: Multiplexed WebSocket stream — md, candles, events, results
- name: webhooks
  description: |
    MFX Hub calls the tenant's own HTTPS address for the events it asks for, signed, tried again
    when it fails, and kept when it keeps failing (hook:read / hook:write).

    **A delivery.** One `POST` for one event, `Content-Type: application/json`. The body is the
    event exactly as the stream's `events` channel carries it: `type`, `schema_version`, its own
    fields, and `id`, the event's cursor. Headers:

    - `MFX-Event-Id`: the event's cursor; de-duplicate on it.
    - `MFX-Event-Type`: for example `position.closed`.
    - `MFX-Delivery-Attempt`: 1 for the first try, then 2, 3 and so on; `replay` for an event
      sent again because you replayed it.
    - `MFX-Signature`: `t=<unix seconds>,v1=<hex>`.

    **The signature.** `v1` is the lowercase hex of HMAC-SHA256, keyed with the endpoint's secret
    (its text, UTF-8, exactly as it was shown when the endpoint was registered or rotated), over
    the bytes `<t>.<body>`: the value of `t`, a full stop, then the body exactly as received. For
    a day after a rotation the header carries two `v1` values, the new secret's first; accept the
    delivery if either matches. Compare in constant time, and refuse a `t` more than five minutes
    from your own clock.

    Test vector: secret `example_secret`, `t` 1790000000, body
    `{"id":"1790000000000-0","type":"position.closed","schema_version":"1.0"}` gives
    `MFX-Signature: t=1790000000,v1=190c44d9d5595080ae5682f18de3d08df86b483b8c58bf1adba0fad2033cf422`.

    **Answering.** Any 2xx within the timeout (5 seconds unless the operator has changed it) is
    delivered. Anything else is a failure: a non-2xx status, a timeout, no connection, a TLS
    failure, or an address MFX Hub will not call.

    **Retries.** An event that failed is tried again by itself after 10 s, 60 s, 5 min, 30 min
    and 2 h (the default schedule), while later events go ahead. Delivery is at least once and in
    no promised order: order by `MFX-Event-Id` where order matters to you. After the last attempt
    the event is kept as a failure you can read and replay for 7 days by default. An endpoint
    that has delivered nothing for 24 hours by default while events failed is paused, with the
    reason on it and `webhook.endpoint_paused` on the stream; resume it to continue from where it
    stopped.
- name: maintenance
  description: 'Planned maintenance on the tenant''s terminals: what is scheduled and in progress, what
    is paused and until when, and where each terminal is (term:read)'
- name: connectors
  description: Tenant-owned Redis push delivery — reserved in v1, not yet available (md:write)
security:
- mfxSignature: []
x-error-catalogue:
  description: 'Every code an error answer can carry (kind http: ErrorBody.code, with its HTTP status)
    and every reason a command''s result can carry (kind command: CommandResult.reason). retryable says
    whether sending the same thing again later can work: for an http code, the same request unchanged;
    for a command reason, the same order under a new Idempotency-Key. A command whose state is UNKNOWN
    is never retryable, whatever its reason: check deal history first. A code or reason not listed here
    may be added later; a client must handle one it does not know.'
  entries:
  - code: validation_error
    kind: http
    status:
    - 400
    - 413
    - 422
    retryable: false
    cause: 'The request cannot be taken as it was sent: a field is missing, malformed or too large.'
    action: Read details for the part that is wrong, correct the request and send it again.
  - code: auth_error
    kind: http
    status: 401
    retryable: false
    cause: 'The request is not signed by a key the platform accepts: headers missing, clock skew, a reused
      nonce, an unknown or expired key, or a bad signature.'
    action: Read details.reason; fix the signing, the clock or the key, then send a newly signed request.
  - code: forbidden
    kind: http
    status: 403
    retryable: false
    cause: The key does not carry the scope this call needs.
    action: Use a key with the scope the operation names, or ask for one to be issued.
  - code: not_found
    kind: http
    status: 404
    retryable: false
    cause: The thing does not exist, or belongs to another tenant.
    action: Check the id; do not retry the same request.
  - code: conflict
    kind: http
    status: 409
    retryable: false
    cause: The request conflicts with something that already exists, such as a name in use.
    action: Change the request so it no longer conflicts.
  - code: state_error
    kind: http
    status: 409
    retryable: false
    cause: The thing exists but is not in a state this can be done in.
    action: Read the thing's state and act only when it allows this.
  - code: unprocessable
    kind: http
    status: 422
    retryable: false
    cause: The request is well formed but can never work as asked, such as an unsupported broker or server.
    action: Change what is asked; the same request will never succeed.
  - code: window_too_wide
    kind: http
    status: 422
    retryable: false
    cause: The time window asked for is wider than this read serves.
    action: Ask for a narrower window, in several reads if needed.
  - code: risk_refused
    kind: http
    status: 422
    retryable: false
    cause: 'An entry broke a Risk Management rule in force on the account: the rule, the figure used,
      its limit and what the entry would have made it are in details.'
    action: Read details.reason and details.rule; send a smaller entry, add a stop, wait for the inputs
      to be fresh (risk_inputs_stale) or for the window to open. Closes, partial closes and cancels are
      never refused.
  - code: feature_not_entitled
    kind: http
    status: 403
    retryable: false
    cause: 'The tenant''s plan does not include this feature, or this part of it: details.feature, and
      details.part where a feature has parts.'
    action: Ask MFX Hub to add it to the plan. Nothing was changed.
  - code: risk_override_required
    kind: http
    status: 403
    retryable: false
    cause: The request relaxes Risk Management's protection (a higher limit, a removed action, a wider
      window, ending an activation, clearing a breach early) and the key does not carry risk:override,
      or no reason was given.
    action: Send it with a key that carries risk:override and a reason; the reason is recorded in Activity
      and the audit log.
  - code: placement_error
    kind: http
    status: 409
    retryable: false
    cause: The terminal cannot be placed on any cell.
    action: Read the message, change the terminal's request or ask the operator.
  - code: no_farm
    kind: http
    status: 409
    retryable: false
    cause: No farm the tenant can use fits the terminal.
    action: Read details.why; change the terminal's requirements or ask the operator.
  - code: farm_not_in_plan
    kind: http
    status: 409
    retryable: false
    cause: The farm named is not one the tenant's plan uses.
    action: Name a farm from the farms list.
  - code: farm_required
    kind: http
    status: 422
    retryable: false
    cause: A tenant with its own farms created a terminal without naming one; it chooses the farm, the
      platform does not.
    action: Name one of the farms in details.farms (or GET /farms) as farm_id and send the request again.
  - code: quota_exceeded
    kind: http
    status: 409
    retryable: false
    cause: A quota of the tenant's plan is reached.
    action: Free something counted by the quota, or ask for a larger plan.
  - code: no_room
    kind: http
    status: 409
    retryable: false
    cause: The terminal's cell cannot carry it at what is asked.
    action: Ask for less, or retire something on the cell first.
  - code: destination_refused
    kind: http
    status: 409
    retryable: false
    cause: The cell named as the destination of a move or drain cannot take the terminals.
    action: Read details.reason and choose another destination.
  - code: broker_not_supported
    kind: http
    status: 409
    retryable: false
    cause: MFX Hub does not support this broker or server now.
    action: Use a supported broker or server from the catalogue.
  - code: ambiguous_symbol
    kind: http
    status: 409
    retryable: false
    cause: The symbol is listed on more than one server or account type.
    action: Pick one of details.choices and ask again.
  - code: cursor_too_old
    kind: http
    status: 409
    retryable: false
    cause: The cursor names an event the stream no longer holds.
    action: Resume from details.oldest and reconcile what you may have missed.
  - code: no_terminal_on_server
    kind: http
    status: 409
    retryable: false
    cause: The tenant has no terminal on the server asked about.
    action: Create a terminal on that server first.
  - code: reads_busy
    kind: http
    status: 429
    retryable: true
    cause: Too many of your candle reads through terminals on this server are running at once.
    action: Ask again after Retry-After; reads the platform's candle store answers are not limited this
      way.
  - code: terminal_reads_limit
    kind: http
    status: 429
    retryable: true
    cause: 'One of your terminals has served as many candle reads this minute as one terminal may: reads
      the platform''s candle store cannot answer go to your terminal, and each terminal serves a limited
      number a minute so a burst of deep history cannot stall its prices and orders.'
    action: Wait Retry-After seconds (to the next minute) and ask again. Keep closed bars you have already
      read, follow new ones on the candles channel (md.candle_closed), and read only the range you are
      missing; reads the store answers are not counted.
  - code: bar_series_limit
    kind: http
    status: 409
    retryable: false
    cause: The subscription would take you past the closed-bar series a server allows (symbols times timeframes).
    action: Ask for fewer timeframes or symbols on this server.
  - code: execution_not_permitted
    kind: http
    status: 403
    retryable: false
    cause: The terminal's farm does not carry orders.
    action: Send orders to a terminal on a farm that executes.
  - code: release_refused
    kind: http
    status: 409
    retryable: false
    cause: An isolated cell has no clean full scan since it was isolated.
    action: Scan the cell in full; release it once a full scan finishes clean, or drain and retire it.
  - code: scan_open
    kind: http
    status: 409
    retryable: true
    cause: A scan asked of the cell has no result yet.
    action: Wait for the scan in details.scan_id to end, or cancel it if it has not started.
  - code: scan_busy_hours_reason_required
    kind: http
    status: 409
    retryable: false
    cause: A cell the scan would be asked of is in its busy trading hours, or above the busy CPU line
      now, and the request neither queued the scan nor gave a reason to scan through them.
    action: Send busy_hours queue to start the scan when busy hours end, or busy_hours scan_now with a
      reason.
  - code: farm_frozen
    kind: http
    status: 409
    retryable: true
    cause: The terminal's farm is inside a test window.
    action: Send the same request after the window's end in details.
  - code: farm_disabled
    kind: http
    status: 403
    retryable: false
    cause: The operator has disabled the terminal's farm.
    action: Contact the operator; do not retry.
  - code: maintenance
    kind: http
    status: 403
    retryable: true
    cause: A planned maintenance window suspends this for you.
    action: Send the same request after details.ends_at.
  - code: depth_not_offered
    kind: http
    status: 422
    retryable: false
    cause: The terminal's farm offers no market depth.
    action: Do not ask for depth on this farm.
  - code: tenant_disabled
    kind: http
    status: 403
    retryable: false
    cause: The operator has disabled the tenant.
    action: Contact the operator; nothing works until the tenant is enabled.
  - code: tenant_suspended
    kind: http
    status: 403
    retryable: false
    cause: The tenant is suspended and this is not a read allowed during its grace.
    action: Contact the operator; reads still work until details.reads_until.
  - code: operation_in_progress
    kind: http
    status: 409
    retryable: true
    cause: Another lifecycle operation is running on the terminal.
    action: Wait for it to finish, then send the same request.
  - code: positions_open
    kind: http
    status: 409
    retryable: false
    cause: The terminal has open positions.
    action: Close them first, or send confirm_open_positions.
  - code: superseded_by_waiting
    kind: http
    status: 409
    retryable: false
    cause: A stronger operation is already waiting for the terminal.
    action: Follow the operation in details.operation_id instead.
  - code: rebuild_not_supported
    kind: http
    status: 409
    retryable: false
    cause: The cell's software is older than a rebuild needs.
    action: Ask the operator; the cell must be updated first.
  - code: attach_not_supported
    kind: http
    status: 409
    retryable: false
    cause: The cell's software cannot attach an expert advisor yet.
    action: Ask the operator; the cell must be updated first.
  - code: not_customer_code_farm
    kind: http
    status: 409
    retryable: false
    cause: The terminal's farm does not run customer code.
    action: Attach expert advisors only to terminals on a farm that runs customer code.
  - code: ea_not_approved
    kind: http
    status: 409
    retryable: false
    cause: The expert advisor version is not approved.
    action: Wait for approval, or attach an approved version.
  - code: build_mismatch
    kind: http
    status: 409
    retryable: false
    cause: The version was not built for the MetaTrader 5 build the terminal's farm runs.
    action: Wait for the build for the farm's MetaTrader 5 build, or attach a version built for it.
  - code: ea_attached
    kind: http
    status: 409
    retryable: false
    cause: The terminal already carries an expert advisor.
    action: Detach it first.
  - code: no_ea_attached
    kind: http
    status: 409
    retryable: false
    cause: No expert advisor is attached to the terminal.
    action: Nothing to detach; check the terminal's state.
  - code: not_awaiting_confirmation
    kind: http
    status: 409
    retryable: false
    cause: The terminal's expert advisor is not waiting for a confirmation.
    action: Confirm only after a green trial on a real-money account; read the attachment's state.
  - code: confirmation_refused
    kind: http
    status: 403
    retryable: false
    cause: The confirmation code is wrong, used or expired, or the confirmation is locked.
    action: Use the code from the newest trial email; after five refusals in a row ask the operator.
  - code: force_not_needed
    kind: http
    status: 409
    retryable: false
    cause: The graceful route can still finish, so a forced action is not needed.
    action: Wait, or force after details.force_available_at.
  - code: confirm_force_required
    kind: http
    status: 409
    retryable: false
    cause: A forced action does not wait for the cell.
    action: Send confirm_force to proceed.
  - code: terminal_not_retired
    kind: http
    status: 409
    retryable: false
    cause: A terminal on the cell would not retire, so the cell was not retired.
    action: Read details.refusal, deal with that terminal, then try again.
  - code: second_reason_required
    kind: http
    status: 422
    retryable: false
    cause: Retiring the cell with its terminals ends trading while markets or positions are open.
    action: Send second_reason to confirm.
  - code: cooldown
    kind: http
    status: 429
    retryable: true
    cause: The terminal was restarted too recently.
    action: Send the same request after Retry-After.
  - code: tenant_rate
    kind: http
    status: 429
    retryable: true
    cause: The tenant has started too many operations in the window.
    action: Send the same request after Retry-After.
  - code: concurrency
    kind: http
    status: 429
    retryable: true
    cause: Too many of the tenant's operations are running at once.
    action: Send the same request after Retry-After, once some have finished.
  - code: farm_capacity
    kind: http
    status: 429
    retryable: true
    cause: Too many terminals of the farm are restarting at once.
    action: Send the same request after Retry-After.
  - code: rate_limited
    kind: http
    status: 429
    retryable: true
    cause: 'A limit is used up for now: details.limit names it (commands_per_s for execution commands;
      on the stream ws_conns, account_channels_per_conn or md_msgs_per_s, as an error op), and for commands_per_s
      and ws_conns details.scope says whether the tenant''s ceiling or the key''s own cap was reached.'
    action: Send the same request after Retry-After, and pace below the figure GET /v1/usage serves.
  - code: mfa_locked
    kind: http
    status: 423
    retryable: true
    cause: 'Five wrong two-step codes in a row: the person is locked out of confirming for a while (admin
      console only).'
    action: Try again after details.until (Retry-After); until then even the right code is refused.
  - code: upstream_error
    kind: http
    status: 503
    retryable: true
    cause: Your terminal, the broker or a service the platform calls did not answer as needed.
    action: Read details.reason and retry later with backoff; for an order, check its outcome before sending
      it again.
  - code: dependency_unavailable
    kind: http
    status: 503
    retryable: true
    cause: The request was valid and a store the platform needs did not answer.
    action: Send the same request after Retry-After.
  - code: internal_error
    kind: http
    status: 500
    retryable: true
    cause: A fault of the platform's own.
    action: Retry later with backoff, and report it if it persists.
  - code: success
    kind: command
    status: null
    retryable: false
    cause: The command did what it asked.
    action: Nothing; success is not an error.
  - code: requote
    kind: command
    status: null
    retryable: true
    cause: The broker requoted the price.
    action: Send the order again under a new Idempotency-Key at the current price.
  - code: instrument_disabled
    kind: command
    status: null
    retryable: false
    cause: The broker has disabled trading on the symbol.
    action: Do not send orders for this symbol until the broker enables it.
  - code: no_liquidity
    kind: command
    status: null
    retryable: true
    cause: The broker had no liquidity to fill the order.
    action: Send it again later under a new Idempotency-Key.
  - code: market_closed
    kind: command
    status: null
    retryable: false
    cause: The market for the symbol is closed.
    action: Send it when the symbol's session is open.
  - code: invalid_stops
    kind: command
    status: null
    retryable: false
    cause: The stop loss or take profit is too close to the price or on the wrong side.
    action: Correct the stops against the symbol's stops level and send again.
  - code: invalid_volume
    kind: command
    status: null
    retryable: false
    cause: The volume is outside the symbol's minimum, maximum or step.
    action: Correct the volume against the symbol's limits.
  - code: insufficient_funds
    kind: command
    status: null
    retryable: false
    cause: The account does not have the margin for the order.
    action: Reduce the volume or add funds.
  - code: trade_disabled
    kind: command
    status: null
    retryable: false
    cause: Trading is disabled for the account or by the broker.
    action: Check the account with the broker; do not retry.
  - code: rejected_other
    kind: command
    status: null
    retryable: false
    cause: The broker refused the order for a reason not classified further.
    action: Read retcode_text and comment_raw for the broker's words.
  - code: rate_limited
    kind: command
    status: null
    retryable: true
    cause: Too many requests reached the broker or the terminal at once.
    action: Send it again later under a new Idempotency-Key.
  - code: expired
    kind: command
    status: null
    retryable: true
    cause: The command passed its expiry before it could run, and never executed.
    action: Send it again under a new Idempotency-Key if it is still wanted.
  - code: timeout
    kind: command
    status: null
    retryable: false
    cause: No answer came in time; the order may or may not have reached the broker.
    action: Do not resend blindly; check deal history and open positions first.
  - code: transport_error
    kind: command
    status: null
    retryable: true
    cause: The command could not be carried to the terminal, and never executed.
    action: Send it again under a new Idempotency-Key.
  - code: unknown
    kind: command
    status: null
    retryable: false
    cause: The outcome could not be classified.
    action: Check deal history and open positions before acting.
  - code: signature
    kind: command
    status: null
    retryable: false
    cause: The terminal refused the command's signature.
    action: Contact support; this is a platform fault, not yours.
  - code: unknown_key
    kind: command
    status: null
    retryable: false
    cause: The terminal does not yet know the key the command was signed with.
    action: Contact support if it persists; the platform resolves it.
  - code: not_assigned
    kind: command
    status: null
    retryable: true
    cause: The terminal was not assigned to the cell that received the command, for example during a move.
    action: Send it again under a new Idempotency-Key.
  - code: malformed
    kind: command
    status: null
    retryable: false
    cause: The terminal could not read the command.
    action: Contact support; this is a platform fault.
  - code: invalid_request
    kind: command
    status: null
    retryable: false
    cause: The terminal refused the command before the broker saw it, because the broker would refuse
      it.
    action: Correct the request as the reason text says.
  - code: invalid_comment
    kind: command
    status: null
    retryable: false
    cause: The order comment is not one the terminal can send.
    action: Shorten or simplify the comment.
  - code: unknown_symbol
    kind: command
    status: null
    retryable: false
    cause: The terminal does not list the symbol.
    action: Use a symbol from the terminal's catalogue.
  - code: terminal_unavailable
    kind: command
    status: null
    retryable: true
    cause: The terminal could not take commands at that moment.
    action: Send it again under a new Idempotency-Key once the terminal is ACTIVE.
  - code: execution_not_permitted
    kind: command
    status: null
    retryable: false
    cause: The terminal's farm does not carry orders.
    action: Send orders to a terminal on a farm that executes.
  - code: not_executed
    kind: command
    status: null
    retryable: false
    cause: The terminal did not execute the command.
    action: Read the reason text; correct and send again only if it says how.
  - code: not_dispatched
    kind: command
    status: null
    retryable: false
    cause: The command was not handed to the terminal.
    action: Check the command's state, and send a new command if needed.
  - code: interrupted
    kind: command
    status: null
    retryable: false
    cause: The command was interrupted while running; its outcome is being settled.
    action: Wait for command.resolved, or until resolve_by; never resend while it is UNKNOWN.
  - code: ambiguous
    kind: command
    status: null
    retryable: false
    cause: The terminal could not tell whether the order reached the broker.
    action: Wait for command.resolved, or until resolve_by; never resend while it is UNKNOWN.
  - code: no_executor
    kind: command
    status: null
    retryable: false
    cause: The terminal had nothing able to run this command.
    action: Contact support.
  - code: no_config
    kind: command
    status: null
    retryable: false
    cause: The terminal was missing the configuration this command needs.
    action: Contact support.
  - code: terminal_not_launched
    kind: command
    status: null
    retryable: false
    cause: The terminal was not running.
    action: Wait until the terminal is ACTIVE, then send a new command.
  - code: unknown_type
    kind: command
    status: null
    retryable: false
    cause: The terminal does not know this kind of command.
    action: Contact support.
  - code: handler_failed
    kind: command
    status: null
    retryable: false
    cause: The terminal failed while handling the command.
    action: Check deal history before acting, and contact support if it repeats.
  - code: cooldown
    kind: command
    status: null
    retryable: false
    cause: The terminal was restarted too recently to restart again.
    action: Wait for retry_after_s, then ask again.
  - code: shutdown_timeout
    kind: command
    status: null
    retryable: false
    cause: The terminal did not stop in time during a restart.
    action: Read the operation; the platform recovers it.
  - code: terminal_removed
    kind: command
    status: null
    retryable: false
    cause: The terminal was removed while the operation ran.
    action: Nothing to do on that terminal.
  - code: deadline
    kind: command
    status: null
    retryable: false
    cause: The operation did not finish by its deadline.
    action: Read the operation's state and ask again if needed.
  - code: no_tick
    kind: command
    status: null
    retryable: false
    cause: No price arrived for the symbol in time.
    action: Ask again later, or check the symbol's session.
  - code: symbol_unknown
    kind: command
    status: null
    retryable: false
    cause: The terminal does not list the symbol.
    action: Use a symbol from the terminal's catalogue.
  - code: journal_unreadable
    kind: command
    status: null
    retryable: false
    cause: The terminal's journal could not be read.
    action: Ask again later.
  - code: deals_unreadable
    kind: command
    status: null
    retryable: false
    cause: The terminal's deal history could not be read.
    action: Ask again later.
  - code: maintenance
    kind: command
    status: null
    retryable: true
    cause: A maintenance window refused the queued order before it ran; nothing reached the broker.
    action: Send it again under a new Idempotency-Key after the window ends.
  - code: venue_unavailable
    kind: command
    status: null
    retryable: true
    cause: The venue could not be reached or was under maintenance; nothing was placed.
    action: Send it again under a new Idempotency-Key once the account is CONNECTED.
  - code: not_on_this_venue
    kind: command
    status: null
    retryable: false
    cause: The account's venue has no equivalent for this command as asked, such as removing a cTrader
      pending order's expiry.
    action: Change the command to one the venue takes; the route's description says which.
components:
  securitySchemes:
    mfxSignature:
      type: apiKey
      in: header
      name: X-MFX-Signature
      description: 'key-id + **Ed25519** request signature over timestamp\nnonce\nMETHOD\npath_with_query\nsha256_hex(body),
        base64-encoded. The nonce is inside the signed string: beside it, a captured request could be
        replayed under a fresh nonce for as long as its timestamp held. Companion headers X-MFX-Key, X-MFX-Timestamp
        (epoch ms, ±30 s), X-MFX-Nonce (unique per key for 5 minutes, and matching `^[A-Za-z0-9_-]{16,64}$`
        — it sits in a newline-delimited string, so it has an alphabet and not only a length; anything
        else is 401). The private key is returned once at issue and is never stored by the platform. **A
        4xx means the caller must change something; a 5xx means retrying later, unchanged, would work**.
        A refused signature is 401 `auth_error` with `details.reason` one of `missing_headers`, `timestamp_not_epoch_ms`,
        `nonce_format`, `timestamp_skew`, `nonce_replayed`, `unknown_key`, `expired_key`, `bad_signature`
        or `tenant_closed`. `expired_key` is answered only when the signature verifies against the expired
        key, so only that key''s holder learns it has expired; any other unusable key (never issued, revoked,
        deleted, or expired but badly signed) is `unknown_key`, which says nothing about which key ids
        exist. When the platform cannot check the nonce because its store is unreachable, the request
        was signed correctly and is **503 `dependency_unavailable`** with `Retry-After` and `details.reason
        = nonce_store_unavailable`: retry after that many seconds. The request is still refused, never
        let through unchecked. The same 503 with `details.reason = nonce_memory_restarted` answers a request
        signed before the store last came back empty: it cannot know that nonce, so a fresh signature
        is needed; re-sign and retry. **A disabled or suspended tenant.** A correctly signed request from
        a tenant the operator has disabled is **403 `tenant_disabled`**, every call. A suspended tenant''s
        request is **403 `tenant_suspended`**, except reads (term:read, acct:read, md:read, the stream)
        until `details.reads_until`, the end of its suspension grace. In both, `message` is the operator''s
        message for the tenant, shown as given, and `details.since` is when it began. Neither is retryable:
        it ends when the operator enables or resumes the tenant. A closed tenant stays 401 `tenant_closed`.
        **A disabled farm.** A call that names a terminal on a farm the operator has disabled is **403
        `farm_disabled`** (reads, orders, closes and its result and account channels alike), with `details.farm_id`
        and `details.since`. Its terminals keep running; the call works again when the operator enables
        the farm. **A maintenance window.** While a window runs, a call it suspends for the caller is
        **403 `maintenance`**, with `message` "Paused for planned maintenance until 02:38 UTC." and `details.window_id`,
        `details.window` (the label, MW-0031), `details.ends_at` (the current end), `details.service`
        (the suspended service that refused) and `details.suspended`. Only the window''s resolved scope
        is refused; order placement during an image upgrade is refused only for a terminal while it is
        being moved. Open positions are never closed by a window. `GET /v1/maintenance` says what is suspended
        and is always answered. Test vector, which an implementation should reproduce byte for byte: seed
        bytes 00..1f, timestamp 1790000000000, nonce 3f0c9a4e5b7d4c1e9a2b6d8f0a1c2e3f, `POST /v1/terminals?dry_run=false`,
        body `{"farm_id":"00000000-0000-0000-0000-000000000001"}` → signature OLOeJhRskf6kvodIyvrrpI/Hwlg3MXn//TTc64zpcl0qACk3BOhNfMV8yrVthZUdUXlOCntJAIrfgHTNK6faDg=='
  parameters:
    terminalId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    accountId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    grantId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ticket:
      name: ticket
      in: path
      required: true
      schema:
        type: integer
        format: int64
    cursor:
      name: cursor
      in: query
      required: false
      schema:
        type: string
    limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        maximum: 200
        default: 50
    idempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        maxLength: 128
      description: 'A key is remembered for 24 hours per key-holder. The same key with an identical body
        returns the original answer with `duplicate: true`. The same key with a DIFFERENT body is 409
        `conflict` with `details.reason = idempotency_key_reused` and `details.original_command_id`: silently
        answering a different order with the first order''s result is the failure that loses money unnoticed.
        The body is compared as its canonical JSON, and the SDK does this for the caller.'
    pathId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  headers:
    BudgetRemaining:
      description: The key's remaining request budget. Where requests are not counted yet, this is the
        key's configured allowance, and `X-MFX-Budget-Source` says so.
      schema:
        type: integer
        minimum: 0
    BudgetSource:
      description: '`counted` when the number is a measurement, `configured` when it is the key''s allowance,
        `unconfigured` when the key has none'
      schema:
        type: string
        enum:
        - counted
        - configured
        - unconfigured
    RetryAfter:
      description: Seconds to wait before retrying (429, and 503 dependency_unavailable)
      schema:
        type: integer
        minimum: 0
  responses:
    Accepted:
      description: Accepted — asynchronous; progress via events
    CommandAccepted:
      description: 'The command is persisted before anything is queued. A repeated `Idempotency-Key` with
        the same body returns the original command with `duplicate: true` and the same status, never a
        second command; with a different body it is 409 (see the Idempotency-Key parameter).'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CommandAccepted'
    Error:
      description: MfxError envelope — ValidationError 400 · AuthError 401 · ForbiddenError 403 · NotFoundError
        404 · ConflictError/StateError 409 · PlacementError 409 · RateLimitError 429 (Retry-After) · UpstreamError
        503 (never 502 or 504) · DependencyUnavailableError 503 (Retry-After; the request was valid and
        a platform dependency was not)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    ErrorBody:
      type: object
      required:
      - code
      - message
      properties:
        code:
          type: string
          description: 'Which rule refused the request, or which failure this is: the kind of error, not
            the HTTP status. **`x-known-values` beside this lists every code the platform sends today,
            and the list is not closed**: a new rule brings a new code, and it is added here in the release
            that sends it. A client must read a code it does not know as an error, by the HTTP status
            and `message`, and must never fail on it. A client generated from this contract gets text
            here, not a fixed set, for that reason.'
          examples:
          - state_error
          x-known-values:
            validation_error: 400, 413 or 422. The request cannot be taken as it was sent; `details` says
              which part
            auth_error: 401. The request is not signed by a key the platform knows
            forbidden: 403. The key may not do this
            not_found: 404. No such thing; also the answer for another tenant's id
            conflict: 409. The request conflicts with what already exists
            state_error: 409. The thing exists and is not in a state this can be done in
            unprocessable: '422. Well formed, and can never work as asked: an unsupported broker or server,
              a flag the farm does not offer'
            window_too_wide: 422. The time window asked for is wider than this read serves
            risk_refused: 422. An entry broke a Risk Management rule in force on the account; `details`
              has the reason, the rule, the figure, its limit and what the entry would have made it
            feature_not_entitled: 403. The tenant's plan does not include this feature, or this part of
              it; `details.feature` and `details.part`
            risk_override_required: 403. The request relaxes Risk Management's protection and needs a
              key with `risk:override` and a `reason`
            placement_error: 409. The terminal cannot be placed
            no_farm: 409. No farm the tenant can use fits the terminal; `details.why`
            farm_not_in_plan: 409. The farm named is not one the tenant's plan uses
            farm_required: 422. A tenant with its own farms named no farm; `details.farms` lists its farms
              taking terminals, `{id, slug}`
            quota_exceeded: 409. A quota of the tenant's plan is reached; `details` has the quota and
              what is in use
            no_room: 409. The terminal's cell cannot carry it at what is asked
            destination_refused: 409. The cell named as a move's or a drain's destination cannot take
              the terminals; `details.reason` says why and `details.destination_node_id` names the cell
            broker_not_supported: 409. MFX does not support this broker or server now; the message says
              why
            ambiguous_symbol: 409. The symbol is listed on more than one server or account type; `details.choices`
            cursor_too_old: 409. The cursor names an event the stream no longer holds; `details.oldest`
              is the oldest it does
            no_terminal_on_server: 409. The tenant has no terminal on that server to ask
            reads_busy: 429. Too many of your candle reads through terminals on this server are running
              at once; Retry-After
            terminal_reads_limit: 429. One of your terminals has served as many candle reads this minute
              as one terminal may (reads the candle store answers are not counted); Retry-After is the
              seconds to the next minute; `details.limit` is the reads a minute and `details.terminal_id`
              the terminal
            bar_series_limit: 409. The subscription would pass the closed-bar series a server allows;
              `details` has the limit and what is in use
            execution_not_permitted: 403. The terminal's farm does not carry orders
            release_refused: 409. An isolated cell has no clean full scan since it was isolated; `details.reason`
              says why
            scan_open: 409. A scan asked of the cell has no result yet; `details.scan_id` names it
            scan_busy_hours_reason_required: 409. A target cell is in busy trading hours and the request
              neither queued the scan nor gave a reason; `details.cells` names them, `details.until` is
              when the window ends
            farm_frozen: 409. The terminal's farm is inside a test window; `details` names its end
            farm_disabled: 403. The operator has disabled the terminal's farm
            maintenance: 403. A maintenance window suspends this for you until `details.ends_at`; `details.window_id`,
              `details.window` (its label), `details.service` (what refused) and `details.suspended`
            depth_not_offered: '422. The terminal''s farm offers no market depth: an operator has given
              it no depth limit'
            tenant_disabled: 403. The operator has disabled the tenant
            tenant_suspended: 403. The tenant is suspended and this is not a read inside its grace
            operation_in_progress: 409. Another lifecycle operation is running on the terminal
            positions_open: 409. The terminal has open positions; send `confirm_open_positions`
            superseded_by_waiting: 409. A stronger operation is already waiting for the terminal; `details.operation_id`
            rebuild_not_supported: 409. The cell's agent is older than a rebuild needs
            attach_not_supported: 409. The cell's agent cannot attach an expert advisor yet
            not_customer_code_farm: 409. The terminal's farm does not run customer code, so it carries
              no expert advisor
            ea_not_approved: 409. The version is not approved; `details.state` says what it is
            build_mismatch: '409. The version was not built for the MetaTrader build the terminal''s farm
              runs; `details.farm_build` and `details.built_for` say which, and `details.build` where
              the build for the farm''s MetaTrader build stands: `{state: queued | running | failed, failure}`'
            ea_attached: 409. The terminal already carries an expert advisor; detach it first
            no_ea_attached: 409. No expert advisor is attached to the terminal
            not_awaiting_confirmation: 409. The terminal's expert advisor is not waiting for a confirmation;
              `details.state` says where it stands
            confirmation_refused: 403. The confirmation code is wrong, used or expired, or five refusals
              in a row locked the confirmation; the answer does not say which
            force_not_needed: 409. The graceful route can still finish; `details.force_available_at`
            confirm_force_required: 409. A forced retire does not wait for the cell; send `confirm_force`
            terminal_not_retired: 409. A terminal on the cell would not retire, so the cell was not retired;
              `details.terminal_id`, `details.refusal`, and `details.retired`, which stay retired
            second_reason_required: '422. Retiring the cell with its terminals ends trading: a market
              is open or unread, or positions are open or uncounted; send `second_reason`. `details.brokers`,
              `details.positions`'
            cooldown: 429. The terminal was restarted too recently; `Retry-After`
            tenant_rate: 429. The tenant has started too many operations in the window; `Retry-After`
            concurrency: 429. Too many of the tenant's operations are running at once; `Retry-After`
            farm_capacity: 429. Too many terminals of the farm are restarting at once; `Retry-After`
            rate_limited: 429. A limit, named in `details.limit`, the tenant's ceiling or the key's cap
              as `details.scope` says; `Retry-After`
            mfa_locked: '423. Five wrong two-step sign-in codes in a row (the admin console): confirming
              is refused, the right code included, until `details.until`; `details.retry_after_s`, `Retry-After`'
            upstream_error: 503 (never 502 or 504, whose bodies the edge replaces). A cell, the broker
              or a service the platform calls did not answer as the platform needs; `details.reason` says
              why where there is one
            dependency_unavailable: 503. The request was valid and a store the platform needs did not
              answer; `Retry-After`
            internal_error: 500. A fault of the platform's own
        message:
          type: string
        details:
          type: object
          additionalProperties: true
          description: Only what the caller can act on. Never a stack trace, an internal message, a credential,
            or a Key Vault URI.
    Error:
      type: object
      required:
      - error
      properties:
        error:
          $ref: '#/components/schemas/ErrorBody'
    Ref:
      type: object
      description: A resolved foreign key — enough to render and link, never a second fetch.
      required:
      - id
      - label
      properties:
        id:
          type: string
          format: uuid
        label:
          type: string
          description: slug or code
          whichever the target uses as its human name: null
    Age:
      type: object
      description: An observation with its age. `seconds` is null when the observation is missing — which
        reads as UNKNOWN, never as zero and never as fresh (L14, L36, L43, guardrail 15).
      required:
      - at
      - seconds
      properties:
        at:
          type:
          - string
          - 'null'
          format: date-time
        seconds:
          type:
          - integer
          - 'null'
        stale:
          type: boolean
          description: 'The observation is older than its metric''s freshness bound, so it is unknown.
            For a cell''s heartbeat the bound is the heartbeat''s red line (`vitals.heartbeat_age_s.red`):
            the list, the Overview and the tile turn at the moment the SLA says down.'
    ConditionStatus:
      type: string
      description: Tri-state on purpose. `unknown` is what an unreachable agent produces, and collapsing
        it into `failed` invents an outage while collapsing it into `ok` hides one.
      enum:
      - ok
      - failed
      - unknown
    TerminalRestart:
      type: object
      additionalProperties: false
      required:
      - reason
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 500
          description: Why; written to the audit log and sent to the cell
        queue:
          type: boolean
          default: true
          description: 'When the ask is valid and refused only because the platform is busy (rule 2 cooldown,
            4 tenant rate, 5 tenant concurrency, 6 farm capacity), hold it and start it when it can, instead
            of answering 429. The answer is then 202 with `state: QUEUED` and where it waits. A valid
            ask always enters the queue unless you send `false`, which keeps the 429 (orchestrator: requests
            enter the queue at once). A hold that could not end before the queue''s deadline is refused
            at once either way'
        confirm_open_positions:
          type: boolean
          default: false
          description: 'Rule 3: required true when the terminal has open positions, or while the platform
            cannot yet tell (until the account''s first snapshot has arrived), and only while the platform''s
            open-position confirmation setting is on (it is off unless an operator turns it on). Off,
            it is not needed'
    TerminalDrain:
      type: object
      additionalProperties: false
      description: A drain. The body is optional; omitted, the reason is recorded as not given
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 500
          description: Why; written to the audit log and the terminal's history
        confirm_open_positions:
          type: boolean
          default: false
          description: 'Rule 3, as on TerminalRestart: required true when the terminal has open positions,
            or while the platform cannot tell, and only while the platform''s open-position confirmation
            setting is on. Positions stay open at the broker while the terminal is drained'
    OperationAccepted:
      type: object
      required:
      - operation_id
      - state
      properties:
        operation_id:
          type: string
          format: uuid
        state:
          type: string
          enum:
          - QUEUED
          - ACCEPTED
          - CLOSING
          - FORCED_STOP
          - RELAUNCHING
          - SUCCEEDED
          - FAILED
          - NOT_STARTED
          - EXPIRED
          - CANCELLED
          - SUPERSEDED
          description: 'QUEUED when the ask was valid and only busy: held, and started by the platform
            when it can. An operator''s asks always queue; a tenant''s only with `queue: true`'
        queue:
          oneOf:
          - $ref: '#/components/schemas/OperationQueue'
          - type: 'null'
          description: Where it waits, while QUEUED; null otherwise
        duplicate:
          type: boolean
          description: True when this Idempotency-Key was seen before, or when the terminal already had
            the same kind of operation waiting (a stronger kind replaces a waiting one, as described on
            restartTerminal); the original operation is returned
    BulkTerminalAsk:
      type: object
      additionalProperties: false
      description: Which of your terminals a bulk restart or retire takes, and why. At least one of the
        filters; given together they narrow each other
      required:
      - reason
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 500
          description: Why; written to the audit log and to each item
        farm_id:
          type:
          - string
          - 'null'
          format: uuid
          description: Every terminal of yours on this farm
        broker_id:
          type:
          - string
          - 'null'
          format: uuid
          description: Every terminal of yours on this broker
        terminal_ids:
          type:
          - array
          - 'null'
          items:
            type: string
            format: uuid
          maxItems: 1000
          description: These terminals
        confirm_open_positions:
          type: boolean
          default: false
          description: 'Rule 3, as on TerminalRestart, for every terminal taken: without it a terminal
            with open positions is refused (`refused[].code = positions_open`) and the rest are taken'
    BulkActionRefusal:
      type: object
      required:
      - terminal_id
      - code
      properties:
        terminal_id:
          type: string
          format: uuid
        code:
          type: string
          description: The governed-operation rule that refused it, as the single route answers it (e.g.
            positions_open, operation_in_progress, superseded_by_waiting, farm_frozen)
    BulkAction:
      type: object
      description: 'A bulk restart, retire or swap: judged once, answered at once, and carried out at
        the pace of the cells it touches. Each accepted terminal is one ordinary operation with `bulk_action_id`
        set, in its cell''s line; a refused one is listed in `refused` and never queued. Its items never
        expire: each waits for its cell or is cancelled. Cancel settles every item still QUEUED as CANCELLED
        and lets running ones finish; the line is never reordered.'
      required:
      - id
      - kind
      - state
      - requested_by
      - reason
      - requested_n
      - accepted_n
      - refused_n
      - refused
      - counts
      - expected_finish_at
      - late
      - created_at
      - finished_at
      properties:
        id:
          type: string
          format: uuid
        kind:
          type: string
          enum:
          - restart
          - retire
          - swap
          - cell_relogin
          description: 'cell_relogin: the platform''s own, opened when a cell comes back from a restart
            and logs its terminals in again'
        state:
          type: string
          enum:
          - RUNNING
          - DONE
          - CANCELLED
          - PARTIAL
          description: RUNNING while any item waits or runs; DONE when every item succeeded; PARTIAL when
            every item has ended and some did not succeed; CANCELLED when it was cancelled
        requested_by:
          type: string
          description: As on TerminalOperation
        reason:
          type: string
        requested_n:
          type: integer
          minimum: 0
          description: Terminals the filter named
        accepted_n:
          type: integer
          minimum: 0
        refused_n:
          type: integer
          minimum: 0
        refused:
          type: array
          items:
            $ref: '#/components/schemas/BulkActionRefusal'
        counts:
          type: object
          required:
          - queued
          - running
          - succeeded
          - failed
          - cancelled
          properties:
            queued:
              type: integer
              minimum: 0
            running:
              type: integer
              minimum: 0
            succeeded:
              type: integer
              minimum: 0
            failed:
              type: integer
              minimum: 0
              description: 'Ended without succeeding: FAILED, NOT_STARTED'
            cancelled:
              type: integer
              minimum: 0
        expected_finish_at:
          type:
          - string
          - 'null'
          format: date-time
          description: 'When the last item is expected to end, at each cell''s load now and the measured
            time an item takes: an expectation, not a promise. Null once it has ended, or when a cell
            it waits on has no plan'
        late:
          type: boolean
          description: True once it has run past the slow end of its expectation (the console reads that
            end as `expected_finish_p95_at`)
        created_at:
          type: string
          format: date-time
        finished_at:
          type:
          - string
          - 'null'
          format: date-time
    TerminalOperation:
      type: object
      description: A governed lifecycle operation; done only when the terminal produces ticks again
      required:
      - operation_id
      - kind
      - terminal_id
      - state
      - requested_by
      - reason
      - forced_stop
      - step
      - timeline
      - cooldown_until
      - created_at
      - finished_at
      properties:
        operation_id:
          type: string
          format: uuid
        kind:
          type: string
          enum:
          - restart
          - rebuild
          - move
          - retire
          - retry_login
          - attach
          - detach
          - drain
          - swap
          description: 'swap (orchestrator): the terminal moved to its farm''s newer image or MetaTrader
            build, a stop and a cold start on its own cell, at the lowest priority of its cell''s line'
        terminal_id:
          type: string
          format: uuid
        state:
          type: string
          enum:
          - QUEUED
          - ACCEPTED
          - CLOSING
          - FORCED_STOP
          - RELAUNCHING
          - SUCCEEDED
          - FAILED
          - NOT_STARTED
          - EXPIRED
          - CANCELLED
          - SUPERSEDED
          description: 'QUEUED is a state of the operation, never of the terminal: the terminal''s own
            state and its lifecycle record are untouched while the operation waits. A queued operation
            ends by starting (ACCEPTED, then as before) or in one of four ways in which nothing ran: NOT_STARTED
            (its turn came and the guard, run again on the terminal as it was then, refused it; `step`
            carries the refusal''s code), EXPIRED (still waiting at `queue.expires_at`; it is never run
            late; an item of a bulk action has no deadline and never expires), CANCELLED, or SUPERSEDED
            (a stronger ask took its place; `superseded_by`).'
        queue:
          oneOf:
          - $ref: '#/components/schemas/OperationQueue'
          - type: 'null'
          description: Where it waits, while QUEUED. Kept as it last stood, with a null `position`, once
            it has left the line; null for an operation that never waited
        superseded_by:
          type:
          - string
          - 'null'
          format: uuid
          description: The operation that replaced this one; set only on SUPERSEDED
        bulk_action_id:
          type:
          - string
          - 'null'
          format: uuid
          description: The bulk action it is an item of; null for an operation asked on its own
        requested_by:
          type: string
          description: key:<key id>, admin.<email> for an operator, system.healing for an automatic recovery
            step, or system.maintenance for a maintenance window's restart
        reason:
          type: string
        forced_stop:
          type:
          - boolean
          - 'null'
          description: True when the terminal would not close and its job was stopped; null until the
            cell says
        step:
          type:
          - string
          - 'null'
          description: The last step the cell reached; on FAILED, what failed (e.g. shutdown_timeout,
            deadline, cooldown)
        timeline:
          type: array
          items:
            type: object
            required:
            - at
            - state
            properties:
              at:
                type: string
                format: date-time
              state:
                type: string
        cooldown_until:
          type:
          - string
          - 'null'
          format: date-time
          description: When the next restart of this terminal is allowed (rule 2)
        created_at:
          type: string
          format: date-time
        finished_at:
          type:
          - string
          - 'null'
          format: date-time
    TerminalQueue:
      type: object
      description: Where a QUEUED terminal waits for its start. Each cell has one line, ordered by what
        the platform must do first (stops that relieve a busy cell, then recovery, then what was asked,
        then background work), then by class (streaming, dedicated, shared), then who waited longest.
        The order is never changed by hand.
      required:
      - queued_at
      - position
      - expected_start_at
      - reason
      properties:
        queued_at:
          type: string
          format: date-time
          description: When it entered its cell's line
        position:
          type:
          - integer
          - 'null'
          minimum: 1
          description: 'Its place in its cell''s line: 1 is next. Null when the platform has no current
            plan for the cell (unknown, never 0)'
        expected_start_at:
          type:
          - string
          - 'null'
          format: date-time
          description: 'When the last plan expects its slot, at the cell''s load now: an expectation,
            not a promise. Null when unknown'
        reason:
          type:
          - string
          - 'null'
          enum:
          - cell_busy
          - cell_settling
          - cell_at_stop_line
          - cell_silent
          - broker_budget
          - broker_cap
          - broker_maintenance
          - platform_ceiling
          - backoff
          - bulk_pace
          - null
          description: 'Why it waits, a coarse code: `cell_busy` its cell is busy now; `cell_settling`
            its cell started others a moment ago and lets them settle first; `cell_at_stop_line` its cell
            is at its limit and starts nothing new until it is lighter; `cell_silent` its cell has not
            reported for a minute; `broker_budget` the broker''s logins a minute are spent; `broker_cap`
            the broker has as many logins in flight as it takes; `broker_maintenance` the broker is in
            maintenance; `platform_ceiling` the platform''s own limit; `backoff` waiting after a failed
            attempt; `bulk_pace` a bulk action''s items go at the pace of their cells. Never a figure,
            never the cell. Null when nothing holds it but its place in line'
    OperationQueue:
      type: object
      description: Where a QUEUED operation waits. It waits in a line, behind other operations, or on
        a clock. Order in a line is class first (automatic recovery, then operator, then tenant), then
        who asked first.
      required:
      - held_by
      - class
      - position
      - starts_after
      - queued_at
      - expires_at
      - expected_start_at
      - reason
      properties:
        held_by:
          type: string
          enum:
          - farm_capacity
          - tenant_concurrency
          - cooldown
          - tenant_rate
          - cell_slots
          description: 'The rule that holds it. farm_capacity (rule 6) and tenant_concurrency (rule 5)
            are lines: it starts when one of the farm''s, or the tenant''s, operations settles. cooldown
            (rule 2) and tenant_rate (rule 4) are clocks: it starts at `starts_after`. cell_slots is its
            cell''s line: it starts when the cell, paced by its own load, has a slot for it'
        expected_start_at:
          type:
          - string
          - 'null'
          format: date-time
          description: 'Held by cell_slots: when the cell''s last plan expects its slot, an expectation
            and not a promise. Null for any other hold, and when unknown'
        reason:
          type:
          - string
          - 'null'
          enum:
          - cell_busy
          - cell_settling
          - cell_at_stop_line
          - cell_silent
          - broker_budget
          - broker_cap
          - broker_maintenance
          - platform_ceiling
          - backoff
          - bulk_pace
          - null
          description: 'Held by cell_slots: Why it waits, a coarse code: `cell_busy` its cell is busy
            now; `cell_settling` its cell started others a moment ago and lets them settle first; `cell_at_stop_line`
            its cell is at its limit and starts nothing new until it is lighter; `cell_silent` its cell
            has not reported for a minute; `broker_budget` the broker''s logins a minute are spent; `broker_cap`
            the broker has as many logins in flight as it takes; `broker_maintenance` the broker is in
            maintenance; `platform_ceiling` the platform''s own limit; `backoff` waiting after a failed
            attempt; `bulk_pace` a bulk action''s items go at the pace of their cells. Never a figure,
            never the cell. Null for any other hold'
        class:
          type: string
          enum:
          - healing
          - operator
          - tenant
          description: Whose ask it is; it sets the order in a line
        position:
          type:
          - integer
          - 'null'
          minimum: 1
          description: 'Its place in line: 1 is next, 2 has one ahead of it. It is a place, not how many
            wait. Null when held by a clock, and once it has left the line'
        starts_after:
          type:
          - string
          - 'null'
          format: date-time
          description: When a clock hold ends. Null for a line
        queued_at:
          type: string
          format: date-time
        expires_at:
          type:
          - string
          - 'null'
          format: date-time
          description: 'Not started by then, it settles EXPIRED and is never run late. queued_at plus
            the longest wait, 900 s unless an operator has changed it. Null for an item of a bulk action,
            which never expires: it waits for its cell or is cancelled'
        bulk_action_id:
          type:
          - string
          - 'null'
          format: uuid
          description: The bulk action it is an item of; null for an operation asked on its own
    TerminalCreate:
      type: object
      additionalProperties: false
      required:
      - broker_id
      - server_id
      properties:
        farm_id:
          type: string
          format: uuid
          description: 'The farm the terminal goes to. Required for a tenant with its own farms (enterprise
            and system plans): omitted, it is 422 farm_required listing them. Optional for a standard
            tenant: omitted, the platform chooses among the shared farms (GET /farms lists them) offering
            the usages this terminal needs, with room; the oldest wins a tie. The choice is on the answer
            as `farm`. None fits is 409 no_farm'
        broker_id:
          type: string
          format: uuid
        server_id:
          type: string
          format: uuid
          description: Must belong to broker_id; an unsupported server is 422
        streaming:
          type: boolean
          default: false
          description: Publishes quotes (usage quote_streaming)
        execution:
          type: boolean
          default: false
          description: Accepts orders; needs a master credential
        instruments:
          type: array
          items:
            type: string
          maxItems: 100
          description: Symbols to watch, in the broker's own names (e.g. EURUSD.sd). The farm's OS caps
            the count.
        labels:
          type: object
          additionalProperties:
            type: string
          description: Free-form, the tenant's own
        redundancy:
          type: string
          enum:
          - none
          - active_passive
          - active_active
          default: none
          description: 'The older word for `ha`: active_active asks for HA in hot mode and active_passive
            in warm mode. Sent with `ha` saying something else is 422'
        ha:
          $ref: '#/components/schemas/TerminalHa'
        refresh_ms:
          type: integer
          enum:
          - 5000
          - 4000
          - 3000
          - 2000
          - 1000
          - 500
          - 250
          - 200
          description: 'The terminal''s refresh rate in milliseconds: how often it sweeps prices and,
            while positions are open, reads the account. Omitted, the farm''s rate applies. Faster than
            the farm''s rate is 422 with details.allowed. With no farm named, only farms that allow the
            rate are considered, and none with room is 409 no_farm (why no_room). A flat account is read
            every 60 s whatever this says'
    TerminalHa:
      type: object
      additionalProperties: false
      description: MFX Hub HA for one terminal. On, MFX Hub runs a second terminal on the same broker
        login, on separate hardware, ready to take over; you keep this terminal's id for everything and
        never see the second one. It is not in your terminal quota, your usage or your terminals per login,
        and it is not billed while HA is not priced. It is one more session on the login, so the broker's
        limit of sessions applies.
      required:
      - enabled
      properties:
        enabled:
          type: boolean
        mode:
          type:
          - string
          - 'null'
          enum:
          - hot
          - warm
          - null
          description: 'hot: the second terminal stays logged in and takes over at once. warm: it waits
            on reserved capacity without a broker session and takes over after one login; not offered
            yet (422 `unprocessable`). Omitted: the mode this terminal already has, else hot.'
    TenantTerminalHa:
      type: object
      required:
      - enabled
      - mode
      - fallback_state
      description: 'This terminal''s MFX Hub HA. `enabled: false`, `mode: null` and `fallback_state: off`
        when HA is not on'
      properties:
        enabled:
          type: boolean
        mode:
          type:
          - string
          - 'null'
          enum:
          - hot
          - warm
          - null
          description: The mode in effect; null when HA is off
        fallback_state:
          type: string
          enum:
          - 'off'
          - starting
          - ready
          - waiting_for_capacity
          - repairing
          description: 'Where the second terminal stands. off: HA is not on. starting: it is being created,
            placed or logged in. ready: it is logged in and healthy. waiting_for_capacity: there is no
            separate hardware in the farm to place it on yet. repairing: it exists and is not healthy
            (offline, failed, degraded or being moved).'
    TerminalUpdate:
      type: object
      additionalProperties: false
      description: What a tenant may change on a running terminal. Send only the fields to change
      minProperties: 1
      properties:
        refresh_ms:
          type: integer
          enum:
          - 5000
          - 4000
          - 3000
          - 2000
          - 1000
          - 500
          - 250
          - 200
          description: As on TerminalCreate. Applied by the cell within a minute, without a restart
    TerminalInstruments:
      type: object
      additionalProperties: false
      description: 'The whole list, replacing the one the terminal has. Not a patch: send every instrument
        the terminal should watch. An empty list is allowed (an execution-only terminal watches nothing).'
      required:
      - instruments
      properties:
        instruments:
          type: array
          items:
            type: string
            minLength: 1
          maxItems: 100
          uniqueItems: true
          description: In the broker's own names (e.g. EURUSD.sd). The farm's OS caps the count.
        depth_instruments:
          type: array
          items:
            type: string
            minLength: 1
          maxItems: 20
          uniqueItems: true
          description: 'The symbols of `instruments` whose market depth (order book) this terminal reads
            and streams on `book:{server_id}:{symbol}`. The whole list, like `instruments`; `[]` stops
            depth. Omitted, the terminal keeps the depth symbols it has that are still in `instruments`,
            so an instrument removed is also no longer read for depth. At most the lesser of the farm''s
            `depth_max` and the platform''s per-terminal cap (422 `unprocessable`, details `{depth_instruments,
            max}`); a farm whose `depth_max` is 0 refuses any (422 `depth_not_offered`); a symbol that
            is not in `instruments` is 422 `unprocessable` (details `{not_instruments}`). Many brokers
            publish no depth for most FX symbols: asking for it costs nothing then, and the channel carries
            nothing.'
    TenantTerminal:
      type: object
      required:
      - id
      - farm
      - broker
      - server
      - streaming
      - execution
      - state
      - instruments
      - created_at
      properties:
        id:
          type: string
          format: uuid
        same_login_terminals:
          type:
          - integer
          - 'null'
          description: 'How many of YOUR live terminals use this terminal''s broker login, this one included.
            They share the account at the broker: each sees the same balance, positions and history. Another
            tenant''s use of the same login is never counted or shown here. Null until the terminal has
            a credential.'
        farm:
          $ref: '#/components/schemas/Ref'
        broker:
          $ref: '#/components/schemas/Ref'
        server:
          $ref: '#/components/schemas/Ref'
        server_kind:
          type:
          - string
          - 'null'
          enum:
          - demo
          - live
          - null
          description: The kind of the terminal's server as the operator recorded it, the `kind` of `GET
            /brokers/{id}/servers`. Known before any login, so it answers demo or live while a login is
            refused. Once the terminal has logged in, `GET /terminals/{id}/account` → `profile.account_type`
            is the account's own word (demo, live or contest) and wins.
        login_masked:
          type:
          - string
          - 'null'
          description: e.g. ****3456; null until a credential is submitted
        streaming:
          type: boolean
        execution:
          type: boolean
        state:
          type: string
          enum:
          - REQUESTED
          - QUEUED
          - PROVISIONING
          - LOGGING_IN
          - ACTIVE
          - OFFLINE
          - PARKED
          - DRAINING
          - DRAINED
          - RETIRED
          - FAILED
          description: 'As `Terminal.state`. OFFLINE: its cell cannot run it (`offline_reason` says why);
            it comes back by itself, or is moved after 15 minutes. DRAINED: you drained it; stopped and
            not billed, keeping its id, account and settings until you resume or retire it. PARKED: your
            account is suspended and its grace period ended; the terminal is stopped and keeps its settings,
            its place and its login. Its cell stops terminals a few at a time, so one may stay as it was
            for a while after the grace ends. It returns to LOGGING_IN by itself when your account is
            reinstated, or goes to DRAINING when it is retired. QUEUED: placed on a cell and waiting for
            its turn to start. A cell starts terminals a few at a time so that the ones already running
            are not slowed; `queue` says your place, when it is expected to start and why it waits. It
            is not trading yet; it starts by itself.'
        offline_reason:
          type:
          - string
          - 'null'
          enum:
          - power_off
          - vm_missing
          - no_heartbeat
          - null
          description: Why an OFFLINE terminal is offline; null in every other state
        queue:
          oneOf:
          - $ref: '#/components/schemas/TerminalQueue'
          - type: 'null'
          description: 'Where a QUEUED terminal waits for its start: your place, when it is expected to
            start and why it waits. Null in every other state'
        state_since:
          type:
          - string
          - 'null'
          format: date-time
          description: When it entered this state (its creation when it has not moved)
        state_expected_s:
          type:
          - integer
          - 'null'
          description: How long this state usually takes; null for a settled state
        conditions:
          type: object
          description: ProcessRunning, BrokerConnected, TicksFresh, TradeAllowed, CredentialLeased — each
            {status, reason, since, attributed_to}; absent means not yet observed
          additionalProperties:
            type: object
            properties:
              status:
                type: string
                enum:
                - ok
                - failed
                - unknown
              reason:
                type:
                - string
                - 'null'
                description: Why, when it is not ok. TicksFresh failed with slow_feed or broker_quiet
                  is your broker's feed, timed against its own usual pace
              since:
                type:
                - string
                - 'null'
                format: date-time
              attributed_to:
                type:
                - string
                - 'null'
                enum:
                - broker
                - null
                description: '`broker` when the terminal is running, logged in and answering and what
                  is wrong is the broker''s own feed (TicksFresh failed with slow_feed or broker_quiet):
                  the broker''s, not MFX Hub''s. Null otherwise (not attributed). `terminal.condition_changed`
                  carries the same field, and is sent again when a slow feed becomes a quiet broker or
                  the reverse.'
              broker_words:
                type:
                - string
                - 'null'
                maxLength: 120
                description: 'As `Condition.broker_words`: the broker''s own words when it refused the
                  login'
              refusal_kind:
                type:
                - string
                - 'null'
                enum:
                - invalid_account
                - other
                - null
                description: As `Condition.refusal_kind`
        instruments:
          type: array
          items:
            type: string
        depth_instruments:
          type: array
          items:
            type: string
          description: The symbols whose market depth this terminal reads; empty when none. Set with PUT
            /terminals/{id}/instruments
        labels:
          type: object
          additionalProperties:
            type: string
        redundancy:
          type: string
          enum:
          - none
          - active_passive
          - active_active
        replica_role:
          type:
          - string
          - 'null'
          enum:
          - writer
          - standby
          - null
        ha:
          $ref: '#/components/schemas/TenantTerminalHa'
        terminal_build:
          type:
          - integer
          - 'null'
        last_tick_at:
          type:
          - string
          - 'null'
          format: date-time
        refresh_ms:
          type: integer
          enum:
          - 5000
          - 4000
          - 3000
          - 2000
          - 1000
          - 500
          - 250
          - 200
          description: The refresh rate this terminal runs at
        created_at:
          type: string
          format: date-time
    TenantTerminalPage:
      type: object
      required:
      - items
      - next_cursor
      properties:
        next_cursor:
          type:
          - string
          - 'null'
          description: Opaque (created_at, id) cursor for the following page; null on the last page
        returned:
          type: integer
          description: How many items are in THIS page; never a total
        items:
          type: array
          items:
            $ref: '#/components/schemas/TenantTerminal'
    TradingAccount:
      type: object
      description: One trading account at one venue. Its state is its runner's, in words that hold on
        every venue. An MT5 account's id is the id of the terminal you created for it; with HA, both terminals
        run the one account and `runners` names them.
      required:
      - id
      - venue
      - environment
      - label
      - state
      - broker
      - login_masked
      - runners
      - created_at
      properties:
        id:
          type: string
          format: uuid
        venue:
          type: string
          enum:
          - mt5
          - ctrader
          description: The trading technology. cTrader accounts appear from the cTrader release
        environment:
          type:
          - string
          - 'null'
          enum:
          - live
          - demo
          - null
          description: 'live or demo. MT5: from the account''s own type once the terminal has logged in
            (contest is demo); null until then'
        label:
          type:
          - string
          - 'null'
          maxLength: 120
          description: Your own name for the account; null when none is set
        state:
          type: string
          enum:
          - PENDING
          - CONNECTING
          - CONNECTED
          - DEGRADED
          - PAUSED
          - REAUTH_NEEDED
          - RETIRED
          - FAILED
          description: 'PENDING: being placed. CONNECTING: logging in. CONNECTED: logged in, nothing failing.
            DEGRADED: logged in with a condition failing, or its runner cannot run it for now (it comes
            back by itself). PAUSED: drained by you, or stopped while your account is suspended. REAUTH_NEEDED:
            the broker refused the login as an invalid account; submit the credential again. RETIRED,
            FAILED: as the terminal''s. For MT5 it is the writing terminal''s state (`GET /terminals/{id}`
            has the detail)'
        broker:
          type: object
          required:
          - id
          - name
          properties:
            id:
              type:
              - string
              - 'null'
              format: uuid
              description: 'MT5: the broker''s id in GET /brokers; null for a venue whose brokers are
                not MFX broker rows'
            name:
              type: string
        login_masked:
          type:
          - string
          - 'null'
          description: e.g. ****3456; null until a credential is submitted
        runners:
          type: array
          description: 'MT5: the terminals that run the account, yours to read at /terminals/{id}; empty
            for a venue MFX runs without a terminal of yours'
          items:
            type: object
            required:
            - terminal_id
            - role
            properties:
              terminal_id:
                type: string
                format: uuid
              role:
                type:
                - string
                - 'null'
                enum:
                - writer
                - standby
                - null
                description: With HA, which terminal places orders; null without HA
        created_at:
          type: string
          format: date-time
    CtraderGrantCreate:
