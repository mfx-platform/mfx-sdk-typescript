  /terminals/{id}/resume:
    parameters:
    - $ref: '#/components/parameters/terminalId'
    post:
      tags:
      - terminals
      operationId: resumeTerminal
      summary: Resume a drained terminal - placed and logged in again exactly as a new terminal is
      description: 'Place a DRAINED terminal again. It keeps its id and goes back to REQUESTED, and from
        there it is placed and logged in exactly as a new terminal is. What can never work is refused
        now, before anything is written: its farm not taking terminals (409 `state_error`), its broker
        or server no longer supported (422 `unprocessable`, or 409 `broker_not_supported`), a usage or
        an instrument count its farm no longer offers (422). Otherwise it waits in REQUESTED until its
        farm has room, as a new terminal does, and becomes ACTIVE through the normal login. It is billed
        again from when it is ACTIVE. A terminal already REQUESTED, PROVISIONING, LOGGING_IN or ACTIVE
        is answered as it is: a resume sent twice is one resume. A DRAINING terminal is 409 `state_error`
        (resume it once it is DRAINED); so is any other state, and a suspended tenant''s resume. No quota
        is counted: a DRAINED terminal never left the terminal quota.'
      x-scope: term:write
      parameters:
      - $ref: '#/components/parameters/idempotencyKey'
      responses:
        '202':
          description: accepted; the terminal is REQUESTED (or already on its way back, as it is)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantTerminal'
        default:
          $ref: '#/components/responses/Error'
  /terminals/{id}/restart:
    parameters:
    - $ref: '#/components/parameters/terminalId'
    post:
      tags:
      - terminals
      operationId: restartTerminal
      summary: Restart a stuck terminal — governed, followed as an operation
      description: 'Close the terminal gracefully (60 s), stop it by force only if it will not close,
        relaunch it, and report SUCCEEDED only once it produces ticks again. Seven rules are checked in
        order before anything is written, the same guard the platform''s automatic recovery takes: one
        lifecycle operation per terminal at a time (409 `operation_in_progress`), a cooldown per terminal
        (429 `cooldown`), open positions need `confirm_open_positions` (409 `positions_open`) while the
        platform''s open-position confirmation setting is on (it is off unless an operator turns it on),
        a tenant rate (429 `tenant_rate`), tenant concurrency (429 `concurrency`), a farm blast radius
        (429 `farm_capacity`), and the general budget. A refusal names its rule in `error.code` and carries
        `Retry-After` when waiting helps. Unless `queue: false` is sent, the four busy refusals (cooldown,
        tenant rate, concurrency, farm capacity) are held instead: 202 with `state: QUEUED` and where
        it waits, started by the platform when it can, and settled EXPIRED if it has not started by `queue.expires_at`.
        A terminal has at most one waiting operation: the same kind again returns it with `duplicate:
        true`; a stronger kind replaces it (it settles SUPERSEDED); a weaker one is 409 `superseded_by_waiting`
        with `details.operation_id`. The same Idempotency-Key returns the original operation; a different
        body under it is 409.'
      x-scope: term:write
      parameters:
      - $ref: '#/components/parameters/idempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TerminalRestart'
      responses:
        '202':
          description: accepted; follow it at operations/{operation_id} or on the event stream
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationAccepted'
        default:
          $ref: '#/components/responses/Error'
