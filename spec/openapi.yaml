      summary: Send your EA a new parameter set - the platform numbers it, delivers it to the terminal,
        and keeps it for every later copy of the terminal
      description: 'The set replaces the one before. The platform gives it the next `version` (1 for the
        first), answers at once, and delivers it to the terminal''s EA, which reads it from its parameter
        file. You never send a version: ordering is the platform''s, so a retry or a race can never put
        an older set back. The newest set is also part of the terminal''s desired state, so a terminal
        copied again (detach and attach, or a move to another cell) starts with it, not with the EA''s
        defaults. `applied_version` on getExpertAdvisorParameters says when your EA runs it: your EA echoes
        the version it runs in every heartbeat line. Refused: 409 `no_ea_attached` when the terminal carries
        no expert; 400 `validation_error` when the set is not an object, when the file it makes would
        exceed 256 KiB (`details.bytes`, `details.max`), or when a key anywhere in it is named like a
        credential (`details.key`) - your EA can read this file, so it must never hold one; 404 for another
        tenant''s terminal. The same Idempotency-Key with the same body answers the same version again;
        with another body it is 409 `conflict` with `details.reason = idempotency_key_reused`. What the
        cell answered is kept on the platform: read the outcome on getExpertAdvisorParameters (`version`,
        `applied_version`, `converged`); getCommand shows only the command''s own state.'
