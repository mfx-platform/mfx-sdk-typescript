      operationId: closePositionPartial
      summary: Partially close a position — the volume to close, inside the symbol's step
      x-scope: exec:write
      parameters:
      - $ref: '#/components/parameters/idempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PositionClosePartial'
      responses:
        '202':
          $ref: '#/components/responses/CommandAccepted'
        default:
          $ref: '#/components/responses/Error'
  /terminals/{id}/positions/{ticket}/close-by:
    parameters:
    - $ref: '#/components/parameters/terminalId'
    - $ref: '#/components/parameters/ticket'
    post:
      tags:
      - execution
      operationId: closePositionBy
      summary: Close a position against an opposite one in the same symbol (hedging accounts)
      x-scope: exec:write
      parameters:
      - $ref: '#/components/parameters/idempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PositionCloseBy'
      responses:
        '202':
          $ref: '#/components/responses/CommandAccepted'
        default:
          $ref: '#/components/responses/Error'
  /terminals/{id}/positions/{ticket}/trailing-stop:
    parameters:
    - $ref: '#/components/parameters/terminalId'
    - $ref: '#/components/parameters/ticket'
    put:
      tags:
      - execution
      operationId: setTrailingStop
      summary: Set or change a position's trailing stop, kept by the platform
      description: The platform keeps the record first, then a `TRAILING_STOP_SET` command carries it
        to the cell. If a cell restarts or a terminal moves, the platform sends it again within one account
        snapshot. A stop loss set by anyone else ends it and the tenant is told (`position.trailing_stop_changed`,
        reason `stop_changed`). Refused as any order is on a terminal that may not execute.
      x-scope: exec:write
      parameters:
      - $ref: '#/components/parameters/idempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TrailingStopSet'
      responses:
        '202':
          $ref: '#/components/responses/CommandAccepted'
        default:
          $ref: '#/components/responses/Error'
    delete:
      tags:
      - execution
      operationId: clearTrailingStop
      summary: Remove a position's trailing stop; the stop stays where it is
      x-scope: exec:write
      parameters:
      - $ref: '#/components/parameters/idempotencyKey'
      responses:
        '202':
          $ref: '#/components/responses/CommandAccepted'
        default:
          $ref: '#/components/responses/Error'
  /commands/{id}:
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    get:
      tags:
      - execution
      operationId: getCommand
      summary: Command state + result — mt5_retcode, retcode_text, reason (granular), comment_raw, tickets,
        exec_price, exec_volume, broker_latency_ms, agent_latency_ms, terminal_state
      description: UNKNOWN is visible and not final; the platform asks the terminal again until `resolve_by`
        and resolves it to SUCCEEDED, FAILED or REJECTED (command.unknown, then command.resolved). Another
        tenant's command is 404.
      x-scope: exec:read
      responses:
        '200':
          description: the command
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Command'
