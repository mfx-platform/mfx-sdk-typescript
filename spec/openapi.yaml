    Venue:
      type: string
      description: The trading technology an account is on. A venue MFX Hub adds is a new value, so a
        client must read one it does not know
      enum:
      - mt5
      - ctrader
    CopyDecimal:
      type: string
      description: A decimal as a string, never a JSON number
      pattern: ^-?[0-9]+(\.[0-9]+)?$
    CopyLeaderState:
      type: string
      description: 'active: its deals are copied. paused: its entries are not, its closes still are. retired:
        final'
      enum:
      - active
      - paused
      - retired
    CopyLeaderSource:
      type: string
      description: 'account: one of your accounts, whose fills are seen as they happen. external: a source
        that sends signals to the signals route'
      enum:
      - account
      - external
    CopyFollowerState:
      type: string
      description: 'copying: receives the leader''s deals. paused: by you, its entries are not copied,
        closes of what it copied still are. stopped_out: a copy limit was reached; it copies nothing new
        until the period ends or the stop-out is reset. unfollowed: final.'
      enum:
      - copying
      - paused
      - stopped_out
      - unfollowed
    CopyGroupState:
      type: string
      enum:
      - active
      - paused
    CopyStopoutState:
      type: string
      description: 'active: in force. reset: ended early by a person, with a reason. expired: its period
        ended'
      enum:
      - active
      - reset
      - expired
    CopyLimitKind:
      type: string
      enum:
      - daily
      - monthly
      - lifetime
    CopyOutcome:
      type: string
      description: 'filled: the copy reached the venue and filled. refused: it was not sent, or the venue
        refused it; `reason` says why. skipped: the follower''s own options left it out (skip_pending,
        close_only). stopout: a close made by a stop-out.'
      enum:
      - filled
      - refused
      - skipped
      - stopout
    CopyReason:
      type: string
      description: 'Why a copy did not fill. The list is closed: a new reason is a change to this contract.
        mapping: no follower symbol matched, or two did. min_volume: the scaled volume is under the follower''s
        or the broker''s minimum; it is never enlarged. no_stop: fixed_risk needs the leader''s stop loss
        and there was none. risk_rule: a Risk Management rule on the follower account, or a leader or
        group limit, refused it. plan_limit: a Copy Trading limit of your plan. stopped_out: the follower
        is stopped out. signal_expired: the signal outlived its lifetime before it could be copied. skip_pending:
        the follower skips pending orders. close_only: the follower copies closes only. paused: the leader,
        the follower or its group is paused. account_not_connected: the follower account is not connected.
        market_closed: the symbol''s market is closed. no_conversion: no current rate to convert the leader''s
        figures into the follower account''s currency. not_on_this_venue: the follower''s venue cannot
        do what was asked. venue_unavailable: the venue did not answer. broker: the venue refused it;
        its own code is in `venue_code`.'
      enum:
      - mapping
      - min_volume
      - no_stop
      - risk_rule
      - plan_limit
      - stopped_out
      - signal_expired
      - skip_pending
      - close_only
      - paused
      - account_not_connected
      - market_closed
      - no_conversion
      - not_on_this_venue
      - venue_unavailable
      - broker
    CopyScalingMode:
      type: string
      description: 'How a leader volume becomes the follower''s, in base units first (volume times the
        leader symbol''s contract size), then the follower symbol''s lots, rounded down to its step. balance_ratio:
        times follower balance over leader balance, times multiplier. equity_ratio: the same with equity.
        fixed_multiplier: times multiplier. contract_size: the same exposure in units. fixed_volume: always
        `volume`, in the follower venue''s unit. fixed_risk: the follower''s equity times `risk_pct`,
        over the distance to the leader''s stop valued in the follower''s currency. The leader''s balance
        and equity are converted into the follower account''s currency first.'
      enum:
      - balance_ratio
      - equity_ratio
      - fixed_multiplier
      - contract_size
      - fixed_volume
      - fixed_risk
    CopyMatch:
      type: string
      description: 'How a leader symbol found its follower symbol. own_map: the follower''s own symbol
        map, which always wins. instrument_key: a follower symbol with the same instrument key in MFX
        Hub''s catalogue and an agreeing specification. same_name: the same name, with an agreeing specification.
        automatic: the leader''s name with a short prefix or suffix, with an agreeing specification.'
      enum:
      - own_map
      - instrument_key
      - same_name
      - automatic
    CopyLeaderFilters:
      type: object
      additionalProperties: false
      description: Which of the leader's deals are copied. Nothing set copies every deal
      properties:
        symbols:
          type: array
          maxItems: 500
          uniqueItems: true
          items:
            type: string
            maxLength: 64
          description: Only these leader symbols; empty or absent is every symbol
        tag:
          type:
          - string
          - 'null'
          maxLength: 64
          description: Only deals whose order carries this text in its comment, or in its label where
            the venue has labels
        side:
          type: string
          enum:
          - buy
          - sell
          - both
          default: both
    CopyLeaderCopies:
      type: object
      additionalProperties: false
      description: What of the leader's trading is copied
      properties:
        entries:
          type: boolean
          default: true
        pending:
          type: boolean
          default: true
          description: The leader's pending orders, placed, changed and cancelled
        sl:
          type: boolean
          default: true
        tp:
          type: boolean
          default: true
        modifications:
          type: boolean
          default: true
          description: Changes to the stop loss and take profit of an open position
        partial_closes:
          type: boolean
          default: true
        close_only:
          type: boolean
          default: false
          description: 'Copy closes only: no follower opens anything new from this leader'
    CopyLeaderLimits:
      type: object
      additionalProperties: false
      description: Limits on the leader's own deals. A deal over one is copied to no follower, and every
        follower's log row says `refused` with reason `risk_rule`.
      properties:
        max_risk_pct:
          oneOf:
          - $ref: '#/components/schemas/CopyDecimal'
          - type: 'null'
          description: The most a deal may risk to its stop loss, as a percentage of the leader account's
            equity; null is no limit
        max_leverage:
          oneOf:
          - $ref: '#/components/schemas/CopyDecimal'
          - type: 'null'
          description: The most notional exposure the leader account may hold after the deal, as a multiple
            of its equity; null is no limit
    CopyWhoMayJoin:
      type: object
      additionalProperties: false
      description: Which of your accounts may follow this leader
      properties:
        accounts:
          type: string
          enum:
          - any
          - listed
          default: any
          description: 'any: any of your accounts. listed: only those in account_ids'
        account_ids:
          type: array
          maxItems: 5000
          uniqueItems: true
          items:
            type: string
            format: uuid
    CopyLeaderCreate:
      type: object
      additionalProperties: false
      required:
      - source
      - signal_lifetime_s
      properties:
        source:
          $ref: '#/components/schemas/CopyLeaderSource'
        account_id:
          type:
          - string
          - 'null'
          format: uuid
          description: The account (an /accounts id) when source is account; absent or null when external
        filters:
          $ref: '#/components/schemas/CopyLeaderFilters'
        copies:
          $ref: '#/components/schemas/CopyLeaderCopies'
        signal_lifetime_s:
          type: integer
          minimum: 1
          maximum: 3600
          description: How long a signal may still be copied after MFX Hub makes it, in seconds. A follower
            that cannot act on it in time logs signal_expired. You set it; MFX Hub suggests none
        limits:
          $ref: '#/components/schemas/CopyLeaderLimits'
        who_may_join:
          $ref: '#/components/schemas/CopyWhoMayJoin'
    CopyLeaderUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        filters:
          $ref: '#/components/schemas/CopyLeaderFilters'
        copies:
          $ref: '#/components/schemas/CopyLeaderCopies'
        signal_lifetime_s:
          type: integer
          minimum: 1
          maximum: 3600
        limits:
          $ref: '#/components/schemas/CopyLeaderLimits'
        who_may_join:
          $ref: '#/components/schemas/CopyWhoMayJoin'
    CopyLeaderRetire:
      type: object
      additionalProperties: false
      required:
      - close_copied
      - reason
      properties:
        close_copied:
          type: boolean
          description: Close every follower's copied volume of this leader. False leaves those positions
            open, as the accounts' own
        reason:
          type: string
          minLength: 1
          maxLength: 500
    CopyLeader:
      type: object
      required:
      - id
      - source
      - account_id
      - venue
      - filters
      - copies
      - signal_lifetime_s
      - limits
      - who_may_join
      - state
      - followers_live
      - created_at
      - updated_at
      properties:
        id:
          type: string
          format: uuid
        source:
          $ref: '#/components/schemas/CopyLeaderSource'
        account_id:
          type:
          - string
          - 'null'
          format: uuid
          description: The leader account; null for an external leader
        venue:
          oneOf:
          - $ref: '#/components/schemas/Venue'
          - type: 'null'
          description: The leader account's venue; null for an external leader
        filters:
          $ref: '#/components/schemas/CopyLeaderFilters'
        copies:
          $ref: '#/components/schemas/CopyLeaderCopies'
        signal_lifetime_s:
          type: integer
          minimum: 1
        limits:
          $ref: '#/components/schemas/CopyLeaderLimits'
        who_may_join:
          $ref: '#/components/schemas/CopyWhoMayJoin'
        state:
          $ref: '#/components/schemas/CopyLeaderState'
        followers_live:
          type: integer
          minimum: 0
          description: Followers that have not unfollowed
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    CopyLeaderPage:
      type: object
      required:
      - stats
      - items
      - next_cursor
      properties:
        stats:
          type: object
          description: Over every leader the filters match, not this page
          required:
          - leaders
          - active
          - paused
          - retired
          properties:
            leaders:
              type: integer
            active:
              type: integer
            paused:
              type: integer
            retired:
              type: integer
        items:
          type: array
          items:
            $ref: '#/components/schemas/CopyLeader'
        next_cursor:
          type:
          - string
          - 'null'
        returned:
          type: integer
    CopyExternalOpen:
      type: object
      additionalProperties: false
      description: 'An external leader opens a position: a market entry. Exactly one of volume or units;
        both or neither is refused 422 unprocessable, details.reason volume_or_units'
      required:
      - id
      - symbol
      - side
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 64
          pattern: ^[A-Za-z0-9._:-]+$
          description: Your id for this signal, unique for the leader; a close names it
        symbol:
          type: string
          minLength: 1
          maxLength: 64
          description: Your name for the instrument
        instrument_key:
          type:
          - string
          - 'null'
          maxLength: 64
          description: The instrument key in MFX Hub's catalogue, for example fx:EURUSD or index:US30;
            followers' symbols are found by it
        side:
          type: string
          enum:
          - buy
          - sell
        volume:
          allOf:
          - $ref: '#/components/schemas/CopyDecimal'
          description: In lots of the instrument's standard contract in MFX Hub's catalogue
        units:
          allOf:
          - $ref: '#/components/schemas/CopyDecimal'
          description: In base units, in place of volume
        sl:
          oneOf:
          - $ref: '#/components/schemas/CopyDecimal'
          - type: 'null'
        tp:
          oneOf:
          - $ref: '#/components/schemas/CopyDecimal'
          - type: 'null'
        time:
          type:
          - string
          - 'null'
          format: date-time
          description: The source's own time for the signal, kept beside MFX Hub's and never used for
            its lifetime
        account:
          type:
          - object
          - 'null'
          additionalProperties: false
          description: The source's own account figures where it has them; kept with the signal, read
            by no follower
          required:
          - currency
          - balance
          - equity
          properties:
            currency:
              type: string
              pattern: ^[A-Z]{3}$
            balance:
              $ref: '#/components/schemas/CopyDecimal'
            equity:
              $ref: '#/components/schemas/CopyDecimal'
    CopyExternalClose:
      type: object
      additionalProperties: false
      description: An external leader closes the position an earlier open made; every follower closes
        what it copied from it
      required:
      - id
      - close
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 64
          pattern: ^[A-Za-z0-9._:-]+$
          description: Your id for this signal
        close:
          type: string
          minLength: 1
          maxLength: 64
          description: The id of the open this closes
        time:
          type:
          - string
          - 'null'
          format: date-time
    CopyExternalSignal:
      description: An open or a close; they are told apart by close, which only a close carries
      oneOf:
      - $ref: '#/components/schemas/CopyExternalOpen'
      - $ref: '#/components/schemas/CopyExternalClose'
    CopySignalAccepted:
      type: object
      required:
      - signal_id
      - id
      - leader_id
      - duplicate
      - iat
      - exp
      properties:
        signal_id:
          type: string
          format: uuid
          description: MFX Hub's id for the signal; the copy log names it
        id:
          type: string
          description: Your id, as sent
        leader_id:
          type: string
          format: uuid
        duplicate:
          type: boolean
          description: True when this leader sent this id before; the original signal is returned and
            nothing is copied again
        iat:
          type: string
          format: date-time
          description: When MFX Hub made the signal, UTC
        exp:
          type: string
          format: date-time
          description: After this no follower copies it (signal_expired)
    CopyScaling:
      type: object
      additionalProperties: false
      required:
      - mode
      description: 'The mode and the figure it needs: multiplier for balance_ratio, equity_ratio and fixed_multiplier
        (1 when absent for the ratios); volume for fixed_volume; risk_pct for fixed_risk. A missing figure
        the mode needs is 422 `validation_error`.'
      properties:
        mode:
          $ref: '#/components/schemas/CopyScalingMode'
        multiplier:
          allOf:
          - $ref: '#/components/schemas/CopyDecimal'
          description: Greater than 0
        volume:
          allOf:
          - $ref: '#/components/schemas/CopyDecimal'
          description: 'fixed_volume: in the follower venue''s unit (lots on MT5, units on cTrader)'
        risk_pct:
          allOf:
          - $ref: '#/components/schemas/CopyDecimal'
          description: 'fixed_risk: the percentage of the follower''s equity risked to the leader''s stop'
    CopyBounds:
      type: object
      additionalProperties: false
      description: The follower's own limits on one copy, in its venue's unit; the broker's apply as well,
        and the tighter wins
      properties:
        min_volume:
          oneOf:
          - $ref: '#/components/schemas/CopyDecimal'
          - type: 'null'
          description: Under it a copy is refused with min_volume, never enlarged
        max_volume:
          oneOf:
          - $ref: '#/components/schemas/CopyDecimal'
          - type: 'null'
          description: Over it a copy is cut to it
        max_open:
          type:
          - integer
          - 'null'
          minimum: 1
          description: The most positions copied from this leader open at once; a copy over it is refused
            with risk_rule
    CopyOptions:
      type: object
      additionalProperties: false
      properties:
        reverse:
          type: boolean
          default: false
          description: Copy the opposite side, with the stop loss and take profit swapped
        copy_sl:
          type: boolean
          default: true
        copy_tp:
          type: boolean
          default: true
        copy_pending:
          type: boolean
          default: true
          description: Place the leader's pending orders as pending orders. False copies one only when
            it fills, as a market entry. Needs a venue with pending orders
        skip_pending:
          type: boolean
          default: false
          description: Copy nothing that began as a pending order, even when it fills; logged skipped
            with skip_pending
        close_only:
          type: boolean
          default: false
          description: Copy closes only, so the follower winds down what it copied
        delay_ms:
          type: integer
          minimum: 0
          maximum: 60000
          default: 0
          description: Wait this long before sending each copy
    CopyRiskLimits:
      type: object
      additionalProperties: false
      description: The follower's copy limits, as a percentage of `basis`, in the follower account's currency.
        Reaching one stops the follower out; with close_on_stopout its copied volume of this leader is
        closed, never the account's own positions.
      properties:
        daily_pct:
          oneOf:
          - $ref: '#/components/schemas/CopyDecimal'
          - type: 'null'
        monthly_pct:
          oneOf:
          - $ref: '#/components/schemas/CopyDecimal'
          - type: 'null'
        lifetime_pct:
          oneOf:
          - $ref: '#/components/schemas/CopyDecimal'
          - type: 'null'
        basis:
          type: string
          enum:
          - balance
          - equity
          default: equity
    CopyFollowerCreate:
      type: object
      additionalProperties: false
      required:
      - account_id
      - leader_id
      description: scaling is required unless group_id names a group whose template has it
      properties:
        account_id:
          type: string
          format: uuid
          description: The follower account, an /accounts id
        leader_id:
          type: string
          format: uuid
        scaling:
          $ref: '#/components/schemas/CopyScaling'
        bounds:
          $ref: '#/components/schemas/CopyBounds'
        symbol_map:
          type: object
          maxProperties: 500
          additionalProperties:
            type: string
            minLength: 1
            maxLength: 64
          description: Leader symbol to follower symbol. Wins over every other match; a follower symbol
            the account does not have refuses with mapping
        options:
          $ref: '#/components/schemas/CopyOptions'
        risk_limits:
          $ref: '#/components/schemas/CopyRiskLimits'
        close_on_stopout:
          type: boolean
          default: false
        group_id:
          type:
          - string
          - 'null'
          format: uuid
          description: 'Enterprise: the group it joins'
    CopyFollowerUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        scaling:
          $ref: '#/components/schemas/CopyScaling'
        bounds:
          $ref: '#/components/schemas/CopyBounds'
        symbol_map:
          type: object
          maxProperties: 500
          additionalProperties:
            type: string
            minLength: 1
            maxLength: 64
        options:
          $ref: '#/components/schemas/CopyOptions'
        risk_limits:
          $ref: '#/components/schemas/CopyRiskLimits'
        close_on_stopout:
          type: boolean
    CopyFollower:
      type: object
      required:
      - id
      - account_id
      - venue
      - leader_id
      - scaling
      - bounds
      - symbol_map
      - options
      - risk_limits
      - close_on_stopout
      - group_id
      - mandate_version
      - state
      - stopouts
      - created_at
      - updated_at
      properties:
        id:
          type: string
          format: uuid
        account_id:
          type: string
          format: uuid
        venue:
          $ref: '#/components/schemas/Venue'
        leader_id:
          type: string
          format: uuid
        scaling:
          $ref: '#/components/schemas/CopyScaling'
        bounds:
          $ref: '#/components/schemas/CopyBounds'
        symbol_map:
          type: object
          additionalProperties:
            type: string
        options:
          $ref: '#/components/schemas/CopyOptions'
        risk_limits:
          $ref: '#/components/schemas/CopyRiskLimits'
        close_on_stopout:
          type: boolean
        group_id:
          type:
          - string
          - 'null'
          format: uuid
        mandate_version:
          type: integer
          minimum: 1
          description: The mandate's version; every change is a new one
        state:
          $ref: '#/components/schemas/CopyFollowerState'
        stopouts:
          type: array
          description: Its active stop-outs; empty when none
          items:
            $ref: '#/components/schemas/CopyStopout'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    CopyFollowerPage:
      type: object
      required:
      - stats
      - items
      - next_cursor
      properties:
        stats:
          type: object
          description: Over every follower the filters match, not this page
          required:
          - followers
          - copying
          - paused
          - stopped_out
          - unfollowed
          properties:
            followers:
              type: integer
            copying:
              type: integer
            paused:
              type: integer
            stopped_out:
              type: integer
            unfollowed:
              type: integer
        items:
          type: array
          items:
            $ref: '#/components/schemas/CopyFollower'
        next_cursor:
          type:
          - string
          - 'null'
        returned:
          type: integer
    CopyUnfollow:
      type: object
      additionalProperties: false
      required:
      - close_copied
      properties:
        close_copied:
          type: boolean
          description: Close the volume copied from this leader. False leaves it open, as the account's
            own
    CopyStopoutReset:
      type: object
      additionalProperties: false
      required:
      - reason
      properties:
        limit:
          $ref: '#/components/schemas/CopyLimitKind'
        reason:
          type: string
          minLength: 1
          maxLength: 500
    CopyStopout:
      type: object
      required:
      - id
      - follower_id
      - limit
      - used
      - period_start
      - period_end
      - closed
      - state
      - reset
      - created_at
      properties:
        id:
          type: string
          format: uuid
        follower_id:
          type: string
          format: uuid
        limit:
          $ref: '#/components/schemas/CopyLimitKind'
        used:
          allOf:
          - $ref: '#/components/schemas/CopyDecimal'
          description: How much of the limit was used, in the follower account's currency
        period_start:
          type: string
          format: date-time
        period_end:
          type:
          - string
          - 'null'
          format: date-time
          description: Null for a lifetime limit
        closed:
          type: array
          description: The copied volume it closed, when close_on_stopout was set
          items:
            type: object
            required:
            - symbol
            - volume
            - command_id
            properties:
              symbol:
                type: string
              volume:
                $ref: '#/components/schemas/CopyDecimal'
              command_id:
                type:
                - string
                - 'null'
                format: uuid
        state:
          $ref: '#/components/schemas/CopyStopoutState'
        reset:
          type:
          - object
          - 'null'
          description: Who reset it, when and why; null unless reset
          required:
          - by
          - at
          - reason
          properties:
            by:
              type: string
            at:
              type: string
              format: date-time
            reason:
              type: string
        created_at:
          type: string
          format: date-time
    CopyStopoutPage:
      type: object
      required:
      - items
      - next_cursor
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/CopyStopout'
        next_cursor:
          type:
          - string
          - 'null'
        returned:
          type: integer
    CopyPreviewRequest:
      type: object
      additionalProperties: false
      required:
      - account_id
      - leader_id
      - scaling
      - rows
      properties:
        account_id:
          type: string
          format: uuid
          description: The account that would follow
        leader_id:
          type: string
          format: uuid
        scaling:
          $ref: '#/components/schemas/CopyScaling'
        bounds:
          $ref: '#/components/schemas/CopyBounds'
        symbol_map:
          type: object
          maxProperties: 500
          additionalProperties:
            type: string
            minLength: 1
            maxLength: 64
        options:
          $ref: '#/components/schemas/CopyOptions'
        rows:
          type: array
          minItems: 1
          maxItems: 200
          description: The leader deals to try, each a leader symbol and a volume in the leader venue's
            unit
          items:
            type: object
            additionalProperties: false
            required:
            - symbol
            - volume
            properties:
              symbol:
                type: string
                minLength: 1
                maxLength: 64
              volume:
                $ref: '#/components/schemas/CopyDecimal'
              price:
                oneOf:
                - $ref: '#/components/schemas/CopyDecimal'
                - type: 'null'
                description: 'fixed_risk: the entry; the current price when absent'
              sl:
                oneOf:
                - $ref: '#/components/schemas/CopyDecimal'
                - type: 'null'
                description: 'fixed_risk: the leader''s stop loss'
    CopyPreview:
      type: object
      required:
      - account_id
      - venue
      - leader_id
      - refusal
      - inputs
      - rows
      properties:
        account_id:
          type: string
          format: uuid
        venue:
          $ref: '#/components/schemas/Venue'
        leader_id:
          type: string
          format: uuid
        refusal:
          type:
          - object
          - 'null'
          description: Why the follow itself would be refused, as creating it would answer; null when
            it would be accepted
          required:
          - reason
          - options
          properties:
            reason:
              type: string
              description: not_on_this_venue, follows_itself, not_admitted or needs_leader_account
            options:
              type: array
              items:
                type: string
              description: 'not_on_this_venue: the options the venue cannot honour'
        inputs:
          type: object
          description: The figures the rows were worked from
          required:
          - leader_currency
          - follower_currency
          - rate
          - leader_balance
          - leader_equity
          - follower_balance
          - follower_equity
          - read_at
          properties:
            leader_currency:
              type:
              - string
              - 'null'
            follower_currency:
              type:
              - string
              - 'null'
            rate:
              type:
              - string
              - 'null'
              description: Leader currency to follower currency; null when the currencies are the same
                or no rate is current
            leader_balance:
              type:
              - string
              - 'null'
            leader_equity:
              type:
              - string
              - 'null'
            follower_balance:
              type:
              - string
              - 'null'
            follower_equity:
              type:
              - string
              - 'null'
            read_at:
              type:
              - string
              - 'null'
              format: date-time
        rows:
          type: array
          items:
            type: object
            required:
            - leader_symbol
            - leader_volume
            - instrument_key
            - follower_symbol
            - matched_by
            - follower_volume
            - reason
            properties:
              leader_symbol:
                type: string
              leader_volume:
                type: string
              instrument_key:
                type:
                - string
                - 'null'
              follower_symbol:
                type:
                - string
                - 'null'
                description: Null when no symbol matched
              matched_by:
                oneOf:
                - $ref: '#/components/schemas/CopyMatch'
                - type: 'null'
              follower_volume:
                type:
                - string
                - 'null'
                description: In the follower venue's unit; null when refused
              reason:
                oneOf:
                - $ref: '#/components/schemas/CopyReason'
                - type: 'null'
                description: Why this row would be refused; null when it would be copied
    CopyStages:
      type: object
      additionalProperties: false
      description: Milliseconds each stage took, each measured on its own machine. A stage that did not
        happen for this copy is absent. broker_ms is the venue's time and is not MFX Hub's.
      properties:
        detect_ms:
          type: number
          minimum: 0
          description: Seeing the leader's deal
        sign_ms:
          type: number
          minimum: 0
          description: Reporting and signing the signal
        deliver_ms:
          type: number
          minimum: 0
          description: Delivering it to the follower's copy host
        expand_ms:
          type: number
          minimum: 0
          description: Mapping, scaling and the risk check
        queue_ms:
          type: number
          minimum: 0
          description: Waiting behind the follower account's own command
        hand_ms:
          type: number
          minimum: 0
          description: Handing the order to the venue
        broker_ms:
          type: number
          minimum: 0
          description: The venue's own time
    CopyLogEntry:
      type: object
      required:
      - id
      - created_at
      - signal_id
      - leader_id
      - follower_id
      - account_id
      - venue
      - action
      - side
      - instrument_key
      - outcome
      - reason
      - venue_code
      - command_id
      - copied_volume
      - price
      - slippage
      - stages
      - mfx_ms
      - signal_to_order_ms
      properties:
        id:
          type: string
          format: uuid
        created_at:
          type: string
          format: date-time
          description: The signal's time; every row of one signal carries it
        signal_id:
          type: string
          format: uuid
        leader_id:
          type: string
          format: uuid
        follower_id:
          type: string
          format: uuid
        account_id:
          type: string
          format: uuid
          description: The follower account
        venue:
          $ref: '#/components/schemas/Venue'
        action:
          type: string
          enum:
          - open
          - modify
          - close
          - close_part
          - pending_place
          - pending_modify
          - pending_cancel
          description: What the leader did
        side:
          type: string
          enum:
          - buy
          - sell
        instrument_key:
          type:
          - string
          - 'null'
        outcome:
          $ref: '#/components/schemas/CopyOutcome'
        reason:
          oneOf:
          - $ref: '#/components/schemas/CopyReason'
          - type: 'null'
          description: Null exactly when filled
        venue_code:
          type:
          - string
          - 'null'
          description: The venue's own code beside broker, as the venue gave it
        command_id:
          type:
          - string
          - 'null'
          format: uuid
          description: The command the copy became; GET /commands/{id} has it
        copied_volume:
          type:
          - string
          - 'null'
          description: In the follower venue's unit
        price:
          type:
          - string
          - 'null'
        slippage:
          type:
          - string
          - 'null'
          description: The follower's fill price less the leader's, as a price distance; positive is worse
            for the follower
        stages:
          $ref: '#/components/schemas/CopyStages'
        mfx_ms:
          type:
          - number
          - 'null'
          description: 'MFX Hub''s part: every stage but broker_ms, added up'
        signal_to_order_ms:
          type:
          - number
          - 'null'
          description: 'deliver_ms + expand_ms + queue_ms + hand_ms: from a held signal to the order call'
    CopyLogPage:
      type: object
      required:
      - stats
      - items
      - next_cursor
      properties:
        stats:
          type: object
          description: Over every row the filters and the window match, not this page
          required:
          - copies
          - filled
          - refused
          - skipped
          - stopout
          - mfx_ms_p50
          - mfx_ms_p99
          - signal_to_order_ms_p50
          - broker_ms_p50
          properties:
            copies:
              type: integer
            filled:
              type: integer
            refused:
              type: integer
            skipped:
              type: integer
            stopout:
              type: integer
            mfx_ms_p50:
              type:
              - number
              - 'null'
              description: Null when no row has the stages
            mfx_ms_p99:
              type:
              - number
              - 'null'
            signal_to_order_ms_p50:
              type:
              - number
              - 'null'
            broker_ms_p50:
              type:
              - number
              - 'null'
        items:
          type: array
          items:
            $ref: '#/components/schemas/CopyLogEntry'
        next_cursor:
          type:
          - string
          - 'null'
        returned:
          type: integer
    CopyGroupTemplate:
      type: object
      additionalProperties: false
      description: What a follower created into the group starts from, for every field it leaves out
      properties:
        scaling:
          $ref: '#/components/schemas/CopyScaling'
        bounds:
          $ref: '#/components/schemas/CopyBounds'
        options:
          $ref: '#/components/schemas/CopyOptions'
        risk_limits:
          $ref: '#/components/schemas/CopyRiskLimits'
        close_on_stopout:
          type: boolean
    CopyGroupCreate:
      type: object
      additionalProperties: false
      required:
      - name
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        template:
          $ref: '#/components/schemas/CopyGroupTemplate'
        gross_exposure_cap:
          oneOf:
          - $ref: '#/components/schemas/CopyDecimal'
          - type: 'null'
          description: The most gross exposure the group's followers may hold together, in your reporting
            currency; a copy over it is refused with risk_rule. Null is no cap
        placement_policy:
          type:
          - string
          - 'null'
          maxLength: 64
          description: How the group's followers are placed; null is the platform's default
    CopyGroupUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        template:
          $ref: '#/components/schemas/CopyGroupTemplate'
        gross_exposure_cap:
          oneOf:
          - $ref: '#/components/schemas/CopyDecimal'
          - type: 'null'
        placement_policy:
          type:
          - string
          - 'null'
          maxLength: 64
    CopyGroup:
      type: object
      required:
      - id
      - name
      - template
      - gross_exposure_cap
      - placement_policy
      - state
      - followers_live
      - created_at
      - updated_at
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        template:
          $ref: '#/components/schemas/CopyGroupTemplate'
        gross_exposure_cap:
          type:
          - string
          - 'null'
        placement_policy:
          type:
          - string
          - 'null'
        state:
          $ref: '#/components/schemas/CopyGroupState'
        followers_live:
          type: integer
          minimum: 0
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    CopyGroupPage:
      type: object
      required:
      - stats
      - items
      - next_cursor
      properties:
        stats:
          type: object
          required:
          - groups
          - active
          - paused
          properties:
            groups:
              type: integer
            active:
              type: integer
            paused:
              type: integer
        items:
          type: array
          items:
            $ref: '#/components/schemas/CopyGroup'
        next_cursor:
          type:
          - string
          - 'null'
        returned:
          type: integer
    CopyGroupMembers:
      type: object
      additionalProperties: false
      required:
      - follower_ids
      properties:
        follower_ids:
          type: array
          minItems: 1
          maxItems: 500
          uniqueItems: true
          items:
            type: string
            format: uuid
    CopyGroupMembersResult:
      type: object
      required:
      - results
      properties:
        results:
          type: array
          items:
            type: object
            required:
            - follower_id
            - outcome
            - reason
            properties:
              follower_id:
                type: string
                format: uuid
              outcome:
                type: string
                enum:
                - done
                - unchanged
                - refused
              reason:
                type:
                - string
                - 'null'
                description: 'Why it was refused: not_found, in_another_group, unfollowed'
    CopyUsage:
      type: object
      description: 'Copy Trading''s limits of your plan. Copied orders are counted here and are limited
        by these, not by commands_per_s: one leader deal may be copied to more followers at once than
        the command burst allows.'
      required:
      - leaders
      - followers
      - signals_per_day
      - log_retention_days
      - copied_commands_today
      properties:
        leaders:
          $ref: '#/components/schemas/UsageLimit'
          description: Leaders that are not retired
        followers:
          $ref: '#/components/schemas/UsageLimit'
          description: Followers that have not unfollowed
        signals_per_day:
          $ref: '#/components/schemas/UsageLimit'
          description: Signals made in the current UTC day, from every leader
        log_retention_days:
          type:
          - integer
          - 'null'
          minimum: 1
          description: How long the copy log keeps a row; null when your contract sets it
        copied_commands_today:
          type:
          - integer
          - 'null'
          minimum: 0
          description: Orders copied in the current UTC day; null where not yet measured
    CopyLeaderDeal:
      type: object
      description: The leader's deal a copy came from, in venue-neutral terms
      required:
      - action
      - side
      - units
      - price
      - instrument_key
      properties:
        action:
          type: string
          enum:
          - open
          - modify
          - close
          - close_part
          - pending_place
          - pending_modify
          - pending_cancel
        side:
          type: string
          enum:
          - buy
          - sell
        units:
          type: string
          description: The leader's volume in base units
        price:
          type:
          - string
          - 'null'
        instrument_key:
          type:
          - string
          - 'null'
    CopyCopied:
      type: object
      description: '`data` of `copy.copied`: one follower''s copy filled'
      required:
      - schema_version
      - signal_id
      - leader_id
      - follower_id
      - account_id
      - venue
      - command_id
      - deal
      - as
      - latency_ms
      - slippage
      - stages
      - at
      properties:
        schema_version:
          type: string
        signal_id:
          type: string
          format: uuid
        leader_id:
          type: string
          format: uuid
        follower_id:
          type: string
          format: uuid
        account_id:
          type: string
          format: uuid
          description: The follower account
        venue:
          $ref: '#/components/schemas/Venue'
        command_id:
          type: string
          format: uuid
        deal:
          $ref: '#/components/schemas/CopyLeaderDeal'
        as:
          type: object
          description: What the copy became on the follower account
          required:
          - symbol
          - side
          - volume
          - price
          properties:
            symbol:
              type: string
            side:
              type: string
              enum:
              - buy
              - sell
            volume:
              type: string
              description: In the follower venue's unit
            price:
              type:
              - string
              - 'null'
        latency_ms:
          type:
          - number
          - 'null'
          description: MFX Hub's part (mfx_ms of the log row)
        slippage:
          type:
          - string
          - 'null'
        stages:
          $ref: '#/components/schemas/CopyStages'
        at:
          type: string
          format: date-time
    CopyRefused:
      type: object
      description: '`data` of `copy.refused`: one follower''s copy did not fill (refused, skipped or a
        stop-out''s close)'
      required:
      - schema_version
      - signal_id
      - leader_id
      - follower_id
      - account_id
      - venue
      - deal
      - outcome
      - reason
      - venue_code
      - why
      - at
      properties:
        schema_version:
          type: string
        signal_id:
          type: string
          format: uuid
        leader_id:
          type: string
          format: uuid
        follower_id:
          type: string
          format: uuid
        account_id:
          type: string
          format: uuid
        venue:
          $ref: '#/components/schemas/Venue'
        deal:
          $ref: '#/components/schemas/CopyLeaderDeal'
        outcome:
          $ref: '#/components/schemas/CopyOutcome'
        reason:
          $ref: '#/components/schemas/CopyReason'
        venue_code:
          type:
          - string
          - 'null'
          description: The venue's own code beside broker
        why:
          type:
          - string
          - 'null'
          description: The reason in words, for a person
        at:
          type: string
          format: date-time
    CopyStopoutEvent:
      type: object
      description: '`data` of `copy.stopout`: a follower reached a copy limit and is stopped out'
      required:
      - schema_version
      - stopout_id
      - follower_id
      - leader_id
      - account_id
      - venue
      - limit
      - used
      - closed
      - at
      properties:
        schema_version:
          type: string
        stopout_id:
          type: string
          format: uuid
        follower_id:
          type: string
          format: uuid
        leader_id:
          type: string
          format: uuid
        account_id:
          type: string
          format: uuid
        venue:
          $ref: '#/components/schemas/Venue'
        limit:
          $ref: '#/components/schemas/CopyLimitKind'
        used:
          type: string
          description: In the follower account's currency
        closed:
          type: array
          description: The copied volume closed, when close_on_stopout is set
          items:
            type: object
            required:
            - symbol
            - volume
            - command_id
            properties:
              symbol:
                type: string
              volume:
                type: string
              command_id:
                type:
                - string
                - 'null'
                format: uuid
        at:
          type: string
          format: date-time
    CopyDrift:
      type: object
      description: '`data` of `copy.drift`: the follower''s copied positions differ from what the leader''s
        open positions and the mandate say it should hold, found when the copied positions are healed
        from the account. Resync after correcting the cause; MFX Hub trades nothing to close the gap.'
      required:
      - schema_version
      - follower_id
      - leader_id
      - account_id
      - venue
      - drift_pct
      - at
      properties:
        schema_version:
          type: string
        follower_id:
          type: string
          format: uuid
        leader_id:
          type: string
          format: uuid
        account_id:
          type: string
          format: uuid
        venue:
          $ref: '#/components/schemas/Venue'
        drift_pct:
          type: string
          description: How far the copied exposure is from the expected, as a percentage of the expected
        at:
          type: string
          format: date-time
    CopyStateChanged:
      type: object
      description: '`data` of `copy.state_changed`: a follower''s state changed'
      required:
      - schema_version
      - follower_id
      - leader_id
      - account_id
      - venue
      - from
      - to
      - why
      - at
      properties:
        schema_version:
          type: string
        follower_id:
          type: string
          format: uuid
        leader_id:
          type: string
          format: uuid
        account_id:
          type: string
          format: uuid
        venue:
          $ref: '#/components/schemas/Venue'
        from:
          $ref: '#/components/schemas/CopyFollowerState'
        to:
          $ref: '#/components/schemas/CopyFollowerState'
        why:
          type: string
          description: For example paused, resumed, stopout, stopout_reset, stopout_expired, unfollowed,
            leader_retired. A new word may be added; read one you do not know as text
        at:
          type: string
          format: date-time
paths:
  /accounts:
    get:
      tags:
      - accounts
      operationId: listTradingAccounts
      summary: List your trading accounts over every venue, newest first (cursor pagination)
      description: Every account of yours, retired ones included, newest first. `venue`, `environment`
        and `state` narrow the list in the query, before the page is cut, so a filtered page is never
        short for being filtered.
      x-scope: acct:read
      parameters:
      - $ref: '#/components/parameters/cursor'
      - $ref: '#/components/parameters/limit'
      - name: venue
        in: query
        required: false
        description: one venue, or several comma-separated
        schema:
          type: array
          items:
            type: string
            enum:
            - mt5
            - ctrader
        style: form
        explode: false
      - name: environment
        in: query
        required: false
        schema:
          type: string
          enum:
          - live
          - demo
      - name: state
        in: query
        required: false
        description: one state, or several comma-separated
        schema:
          type: array
          items:
            type: string
            enum:
            - PENDING
            - CONNECTING
            - CONNECTED
            - DEGRADED
            - PAUSED
            - REAUTH_NEEDED
            - RETIRED
            - FAILED
        style: form
        explode: false
      responses:
        '200':
          description: a page of accounts
          headers:
            X-MFX-Budget-Remaining:
              $ref: '#/components/headers/BudgetRemaining'
            X-MFX-Budget-Source:
              $ref: '#/components/headers/BudgetSource'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TradingAccountPage'
        default:
          $ref: '#/components/responses/Error'
  /accounts/{id}:
    parameters:
    - $ref: '#/components/parameters/accountId'
    get:
      tags:
      - accounts
      operationId: getTradingAccount
      summary: One trading account, by its id or by the id of one of its terminals
      description: An MT5 account is found by its own id or by the id of either of its HA terminals. Another
        tenant's account, or an id that is not an account of yours, is 404.
      x-scope: acct:read
      responses:
        '200':
          description: the account
          headers:
            X-MFX-Budget-Remaining:
              $ref: '#/components/headers/BudgetRemaining'
            X-MFX-Budget-Source:
              $ref: '#/components/headers/BudgetSource'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TradingAccount'
        default:
          $ref: '#/components/responses/Error'
  /accounts/{id}/account:
    parameters:
    - $ref: '#/components/parameters/accountId'
    get:
      tags:
      - accounts
      operationId: getTradingAccountFunds
      summary: Balance, equity, margin and profile of one trading account, on any venue
      description: 'The account''s lead runner answers it (its writer, else its only runner): the same
        answer as the terminal read of an MT5 account, on any venue. Another tenant''s account is 404.
        On cTrader, equity is computed by the platform from the balance, each open position''s floating
        profit at the bid for a buy and the ask for a sell, its swap and its commission, because Spotware
        sends none; `stale` is true when it could not be computed for longer than the platform''s stale
        window.'
      x-scope: acct:read
      responses:
        '200':
          description: the account now; terminal_id is its lead runner
          headers:
            X-MFX-Budget-Remaining:
              $ref: '#/components/headers/BudgetRemaining'
            X-MFX-Budget-Source:
              $ref: '#/components/headers/BudgetSource'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
        default:
          $ref: '#/components/responses/Error'
  /accounts/{id}/positions:
    parameters:
    - $ref: '#/components/parameters/accountId'
    get:
      tags:
      - accounts
      operationId: listTradingAccountPositions
      summary: Open positions of one trading account (as_of), never paged
      description: 'The account''s lead runner answers it (its writer, else its only runner): the same
        answer as the terminal read of an MT5 account, on any venue. Another tenant''s account is 404.
        A cTrader position''s volume is in lots of its symbol (cTrader''s volume divided by its lot size),
        and its ticket is cTrader''s position id.'
      x-scope: acct:read
      responses:
        '200':
          description: every open position, as of one snapshot
          headers:
            X-MFX-Budget-Remaining:
              $ref: '#/components/headers/BudgetRemaining'
            X-MFX-Budget-Source:
              $ref: '#/components/headers/BudgetSource'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PositionList'
        default:
          $ref: '#/components/responses/Error'
  /accounts/{id}/orders/pending:
    parameters:
    - $ref: '#/components/parameters/accountId'
    get:
      tags:
      - accounts
      operationId: listTradingAccountPendingOrders
      summary: Pending orders of one trading account (as_of), never paged
      description: 'The account''s lead runner answers it (its writer, else its only runner): the same
        answer as the terminal read of an MT5 account, on any venue. Another tenant''s account is 404.'
      x-scope: acct:read
      responses:
        '200':
          description: every pending order, as of one snapshot
          headers:
            X-MFX-Budget-Remaining:
              $ref: '#/components/headers/BudgetRemaining'
            X-MFX-Budget-Source:
              $ref: '#/components/headers/BudgetSource'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PendingOrderList'
        default:
          $ref: '#/components/responses/Error'
  /accounts/{id}/history/deals:
    parameters:
    - $ref: '#/components/parameters/accountId'
    - name: from
      in: query
      required: true
      schema:
        type: string
        format: date-time
    - name: to
      in: query
      required: true
      schema:
        type: string
        format: date-time
    - name: position
      in: query
      required: false
      schema:
        type: integer
        format: int64
        minimum: 1
      description: Only the deals of this position
    - $ref: '#/components/parameters/cursor'
    - $ref: '#/components/parameters/limit'
    get:
      tags:
      - accounts
      operationId: listTradingAccountDeals
      summary: Deals of one trading account in a window, newest first by (time, deal), optionally of one
        position
      description: 'The account''s lead runner answers it (its writer, else its only runner): the same
        answer as the terminal read of an MT5 account, on any venue. Another tenant''s account is 404.
        Read from the venue on demand, bounded at 10 s, never stored; `to - from` is at most 31 days,
        as the terminal read. On cTrader every time is Spotware''s UTC (no broker clock is involved),
        a deal''s `entry` is `out` when it closed volume and `in` otherwise, `close_reason` is null (cTrader
        states none on a deal), and `magic` is the origin marker the order was placed with (its label).'
      x-scope: acct:read
      responses:
        '200':
          description: a page of deals
          headers:
            X-MFX-Budget-Remaining:
              $ref: '#/components/headers/BudgetRemaining'
            X-MFX-Budget-Source:
              $ref: '#/components/headers/BudgetSource'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DealPage'
        '422':
          description: window_too_wide - more than 31 days, or from after to
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: upstream_error - venue_timeout (no answer within 10 s) or deals_unreadable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        default:
          $ref: '#/components/responses/Error'
  /accounts/{id}/md/subscriptions:
    parameters:
    - $ref: '#/components/parameters/accountId'
    post:
      tags:
      - md
      operationId: createAccountSubscription
      summary: Stream one symbol's spots of one of your cTrader accounts; state pending until its first
        spot
      description: 'The cTrader counterpart of `POST /md/subscriptions`, keyed on the account instead
        of a server. The platform subscribes the symbol''s spots on that account at Spotware, and they
        stream on the `md:{account_id}:{symbol}` channel as `md.tick`. Two of your accounts at one broker
        and environment share one stream. A resource, not a command: it is created at once, `pending`
        until the first spot arrives. One per account and symbol: asking again answers the live one; asking
        after a stop reopens it. Stopped with `DELETE /md/subscriptions/{id}`. Another tenant''s account,
        or none, is 404; an MT5 account is 409 `state_error` with `details.reason` `not_on_this_venue`
        (it streams its server: `POST /md/subscriptions`).'
      x-scope: md:write
      parameters:
      - $ref: '#/components/parameters/idempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountMdSubscriptionCreate'
      responses:
        '201':
          description: created, state pending
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountMdSubscription'
        '409':
          description: state_error - an MT5 account (`details.reason` `not_on_this_venue`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        default:
          $ref: '#/components/responses/Error'
    get:
      tags:
      - md
      operationId: listAccountSubscriptions
      summary: The account's market-data subscriptions, newest first
      x-scope: md:read
      parameters:
      - $ref: '#/components/parameters/cursor'
      - $ref: '#/components/parameters/limit'
      responses:
        '200':
          description: a page of the account's subscriptions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountMdSubscriptionPage'
        default:
          $ref: '#/components/responses/Error'
  /accounts/{id}/md/candles:
    parameters:
    - $ref: '#/components/parameters/accountId'
    - name: symbol
      in: query
      required: true
      schema:
        type: string
    - name: tf
      in: query
      required: true
      schema:
        type: string
        enum:
        - M1
        - M5
        - M15
        - M30
        - H1
        - H4
        - D1
        - W1
        - MN1
    - name: from
      in: query
      required: true
      schema:
        type: string
        format: date-time
    - name: to
      in: query
      required: true
      schema:
        type: string
        format: date-time
    - name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 1000
        default: 1000
    get:
      tags:
      - md
      operationId: getAccountCandles
      summary: Historical candles of one of your cTrader accounts by bar time, read from Spotware through
        the account; at most 1000 bars per call, the newest of the window
      description: 'The cTrader counterpart of `GET /md/candles`, keyed on the account instead of a broker
        and server. The bars are Spotware''s trendbars for the account''s own symbol name (`GET /accounts/{id}/symbols`),
        in UTC, `v` the bar''s tick volume, oldest first, the forming bar included when the window reaches
        now. `source` is `terminal`: the account''s runner read them, and nothing is stored. The read
        counts against the same per-terminal limit a minute as `GET /md/candles` (429 `terminal_reads_limit`).
        Another tenant''s account, or none, is 404; an unknown symbol is 404; an MT5 account is 409 `state_error`
        with `details.reason` `not_on_this_venue` (its candles are its server''s: `GET /md/candles`).'
      x-scope: md:read
      responses:
        '200':
          description: candles, oldest first
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CandleList'
        '409':
          description: state_error - an MT5 account (`details.reason` `not_on_this_venue`), or an account
            with no runner yet
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: terminal_reads_limit - the account's runner has served as many reads this minute
            as one terminal may (`details.limit` a minute). Ask again after Retry-After
          headers:
            Retry-After:
              schema:
                type: integer
              description: Seconds to the start of the next minute
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: upstream_error - terminal_timeout (no answer within 10 s), terminal_unavailable
            (the account is not connected now) or candles_unreadable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        default:
          $ref: '#/components/responses/Error'
  /accounts/{id}/symbols:
    parameters:
    - $ref: '#/components/parameters/accountId'
    get:
      tags:
      - accounts
      operationId: listTradingAccountSymbols
      summary: The symbols one cTrader account can trade, with their volume rules and leverage
      description: 'Read from Spotware through the account and held for an hour; what one account of a
        broker can trade need not be another''s. A volume a command sends must be a whole `volume_step`
        between `volume_min` and `volume_max`, in lots. An MT5 account is answered 409 `not_on_this_venue`:
        its symbols are its broker''s catalogue (`/brokers/{id}/symbols`).'
      x-scope: acct:read
      responses:
        '200':
          description: the account's symbols
          headers:
            X-MFX-Budget-Remaining:
              $ref: '#/components/headers/BudgetRemaining'
            X-MFX-Budget-Source:
              $ref: '#/components/headers/BudgetSource'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TradingSymbolList'
        '409':
          description: not_on_this_venue - an MT5 account
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: upstream_error - venue_unavailable (the account is not connected now)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        default:
          $ref: '#/components/responses/Error'
  /accounts/{id}/orders:
    parameters:
    - $ref: '#/components/parameters/accountId'
    post:
