      operationId: bulkRestartTerminals
      summary: Restart many of your terminals at once - accepted at once, carried out at the pace of their
        cells
      description: One request for many terminals. Each terminal the filter names is judged by the same
        rules as `POST /terminals/{id}/restart`; a refused one is listed in `refused` with its rule's
