      schema:
        type: integer
        format: int64
        minimum: 1
      description: 'Only the deals of this position (Deal.position): its opening deal, any partial closes
        and its closing deal, inside from/to. A position open longer than 31 days is read window by window'
    - $ref: '#/components/parameters/cursor'
    - $ref: '#/components/parameters/limit'
