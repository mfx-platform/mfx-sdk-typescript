                $ref: '#/components/schemas/TenantTerminal'
        '422':
          description: 'unprocessable — more instruments than the farm carries (details `{instruments,
            max}`), a name listed twice, names the catalogue does not know (details `{unknown: [...]}`,
            up to 20), more depth symbols than the terminal may read (details `{depth_instruments, max}`)
