      responses:
        '200':
          description: the operation, CANCELLED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TerminalOperation'
        '409':
          description: 'state_error — the operation is not waiting: it has started, or it has ended in
            another way than being cancelled (details.state)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        default:
          $ref: '#/components/responses/Error'
  /terminals/{id}/credentials:
    parameters:
    - $ref: '#/components/parameters/terminalId'
    post:
      tags:
      - credentials
      operationId: submitCredentials
      summary: Submit or rotate credentials (master | investor) — stored securely, response by reference,
        never echoed
      description: 'The first submission for a terminal stores its credential. A later one for the **same
        login** rotates it: a new stored version, used from the terminal''s next login. `takes_effect`
        says when that is: an ACTIVE terminal is restarted now, open positions or not while the platform''s
        open-position confirmation setting is off (its default), a FAILED one rejoins its login queue
        now, any other uses it at its next login. When the restart or retry-login is refused, `not_applied_reason`
        says why. A different login is 409 `conflict` (`details.reason = login_changed`): another account
        is another terminal. A DRAINING or RETIRED terminal is 409 `state_error`. **Several terminals
        on one login.** A login may be given to more than one terminal, on every plan, and each trades
        independently; they share the account at the broker. Two limits apply to a terminal''s FIRST credential.
        The plan''s entitlement, terminals per login, counted on your own terminals: 409 `quota_exceeded`
        with `details.reason = login_terminal_limit` and `details {quota, in_use}`. The broker server''s
        session cap, counted on every session on the login: 409 `placement_error` with `details.reason
        = login_session_limit` and no counts. While the server''s cap is still being measured by another
        terminal, the same refusal carries `details.retry_after_s`. A session above what the server is
        known to allow is accepted as a watched probe: if the broker refuses it or it displaces another
        session, that terminal is stopped and FAILED or retired with the reason, and the cap is recorded.'
      x-scope: term:write
      parameters:
      - $ref: '#/components/parameters/idempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CredentialSubmission'
      responses:
        '202':
          description: accepted — the login is stored and the terminal holds a reference
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CredentialAccepted'
        '404':
          description: no such terminal for this tenant — another tenant's id is never a 403
        '409':
          description: '`broker_not_supported` — MFX does not support this broker or this server now,
            and says why in words (`message` is the sentence the operator recorded). details: `{refused_by:
            permission | server_disabled, reason, broker_id, server_id}`. The SDK raises it as UnsupportedBrokerError.
            Other 409s (state_error, conflict) keep their codes.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        default:
          $ref: '#/components/responses/Error'
