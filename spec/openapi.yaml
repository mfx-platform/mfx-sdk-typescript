      summary: Cancel a queued operation — only while it waits
      description: 'Settles a QUEUED operation CANCELLED; nothing ran and the terminal is untouched. An
        operation that has started is not cancelled here. Audited, and announced as `terminal.operation_changed`.
        A tenant cancels what one of its own keys asked for: an operation the platform''s operators queued
