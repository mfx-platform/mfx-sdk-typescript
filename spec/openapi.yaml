      x-scope: md:read
      responses:
        '200':
          description: one page of symbols
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SymbolPage'
        '400':
          description: server_id_required | account_type_required (details.choices) | bad cursor or filter
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
