  /md/candles:
    parameters:
    - name: broker
      in: query
      required: true
      schema:
        type: string
    - name: server_id
      in: query
      required: false
      schema:
        type: string
    - name: symbol
      in: query
      required: true
      schema:
        type: string
    - name: tf
      in: query
      required: true
      schema:
        type: string
        enum:
        - M1
        - M5
        - M15
        - M30
        - H1
        - H4
        - D1
        - W1
        - MN1
    - name: from
      in: query
      required: true
      schema:
        type: string
        format: date-time
    - name: to
      in: query
      required: true
      schema:
        type: string
        format: date-time
    - name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 1000
        default: 1000
    get:
      tags:
      - md
      operationId: getCandles
      summary: Historical candles by bar time, from the platform's store when it holds the window complete,
        else read through one of your own terminals on the server; at most 1000 bars per call, the newest
        of the window
      description: |
        Where the bars come from is in `source`: `store` (the platform's candle store, which keeps
        closed bars of the series you read and costs your terminals nothing), `terminal` (read
        through one of your own ACTIVE terminals on the server), or `store+terminal` (closed bars
        from the store, the rest from a terminal).

        **Reads that reach a terminal are limited per terminal per minute.** Each such read makes
        MetaTrader on your terminal load that history, and a terminal flooded with deep reads stops
        serving its prices and orders. Past the limit the answer is 429 `terminal_reads_limit` with
        `Retry-After` (the seconds to the next minute); `details.limit` says the limit. Reads the
        store answers are never counted. To stay well under it: keep closed bars once you have them
        (they never change), follow new bars on the candles channel (`md.candle_closed`) instead of
        polling, and read only the range you are missing.
      x-scope: md:read
      responses:
        '200':
          description: candles, oldest first; Retry-After when the store is still repairing the window
            (complete_to says how far it is whole)
          headers:
            Retry-After:
              schema:
                type: integer
              description: Seconds; only while the store repairs a gap in the window
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CandleList'
        '429':
          description: 'reads_busy — too many of your reads through terminals on this server are running
            at once; terminal_reads_limit — the terminal that would serve this read has served as many
            reads this minute as one terminal may (`details.limit` a minute, `details.terminal_id`). Reads
            the store answers whole (`source: store`) are never refused this way; a read that needs a
            terminal is, for any part outside the store. Ask again after Retry-After'
          headers:
            Retry-After:
              schema:
                type: integer
              description: 'Seconds: for terminal_reads_limit, to the start of the next minute'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: upstream_error — terminal_timeout (no answer within 10 s), broker_clock_unknown
            (no clock measured for the server yet), or the cell's word
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        default:
          $ref: '#/components/responses/Error'
