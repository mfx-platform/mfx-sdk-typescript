  /terminals/{id}/drain:
    parameters:
    - $ref: '#/components/parameters/terminalId'
    post:
      tags:
      - terminals
      operationId: drainTerminal
      summary: Drain a terminal - it is closed gracefully and kept, holding no cell and not billed, until
        you resume it
      description: 'Close the terminal gracefully and keep it. A drain is a governed operation under the
        rules of restartTerminal: one lifecycle operation per terminal at a time (409 `operation_in_progress`),
        a cooldown per terminal (429 `cooldown`), open positions need `confirm_open_positions` (409 `positions_open`)
        while the platform''s open-position confirmation setting is on, the tenant rate and concurrency,
        counted with moves and retires (429 `tenant_rate`, `concurrency`), and the farm blast radius (429
        `farm_capacity`). A refusal names its rule in `error.code` and carries `Retry-After` when waiting
        helps. A drain is never queued. Offered for an ACTIVE or OFFLINE terminal; any other state is
        409 `state_error`. The answer is the terminal DRAINING. Its cell stops it as it stops a retired
        terminal; it is then DRAINED (`terminal.state_changed`) and the operation, kind `drain`, succeeds
        (`terminal.operation_changed`). A DRAINED terminal keeps its id, broker account and credential,
        instruments, depth instruments, labels, refresh rate and expert-advisor attachment record; it
        runs nothing (no MT5 session, no expert advisor), holds no cell slot, and is not billed from the
        moment it is DRAINED. It still counts toward the terminal quota (terminals that are not RETIRED)
        and toward its login''s terminal and session limits, because it keeps its account and logs in
        again when resumed. Resume it with POST /terminals/{id}/resume; retire it with DELETE /terminals/{id},
        at once since it holds nothing. A DELETE while it is DRAINING makes the drain end in RETIRED instead.
        The same Idempotency-Key answers the terminal as it now is; a different body under it is 409 `conflict`.'
      x-scope: term:write
      parameters:
      - $ref: '#/components/parameters/idempotencyKey'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TerminalDrain'
      responses:
        '202':
          description: accepted; the terminal is DRAINING, and DRAINED once its cell has stopped it
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantTerminal'
        default:
          $ref: '#/components/responses/Error'
  /terminals/{id}/ha:
    parameters:
