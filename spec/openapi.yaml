        '409':
          description: no_terminal_on_server
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: upstream_error — terminal_timeout (no tick within 5 s) or no_tick
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        default:
          $ref: '#/components/responses/Error'
