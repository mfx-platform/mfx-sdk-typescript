      operationId: confirmExpertAdvisor
      summary: Turn on live trading for an EA on a real-money account after a green trial, with the one-time
        code from the trial email
      description: '409 `not_awaiting_confirmation` unless the terminal''s attachment is waiting for it.
        A code that is wrong, used or expired is 403 `confirmation_refused`, and the answer does not say
        which. Five refusals in a row lock the confirmation for that attachment until an operator looks.
