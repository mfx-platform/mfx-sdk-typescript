          - draining
          - retired
    TenantFarmPage:
      type: object
      required:
      - items
      - next_cursor
      properties:
        next_cursor:
          type:
          - string
          - 'null'
          description: Opaque (created_at, id) cursor for the following page; null on the last page
        returned:
          type: integer
          description: How many items are in THIS page; never a total
        items:
          type: array
          items:
            $ref: '#/components/schemas/TenantFarm'
    Account:
      type: object
      description: 'What the terminal''s account looks like now: the fast numerics and the slow facts.
        The cell reads the account every 250 ms while positions are open and sends it when it changes
        (every 60 s flat); this answers from the platform''s latest copy, never a round trip to the cell,
        and the same numbers are pushed on the stream''s `account:{terminal_id}` channel as an `account.snapshot`,
        then `account.marks` (not on `events`). Each half carries when it was observed; a half never observed
        is null, not zero.'
      required:
      - terminal_id
      - snapshot
      - profile
      - stale
      properties:
        terminal_id:
          type: string
          format: uuid
        stale:
          type: boolean
          description: True when nothing arrived from the cell for 15 s with positions open (three missed
            keep-alives) or 180 s flat; the numbers are then the last known, as of `snapshot.ts`
        snapshot:
          type:
          - object
          - 'null'
          properties:
            ts:
              type: string
              format: date-time
            balance:
              type: string
              description: Decimal as a string, in the account currency
            equity:
              type: string
            margin:
              type: string
            margin_free:
              type: string
            margin_level:
              type:
              - string
              - 'null'
              description: Null with no open positions
            credit:
              type:
              - string
              - 'null'
              description: The broker's credit on the account (MT5 ACCOUNT_CREDIT), in the account currency;
                part of equity, not of balance. Null from a cell that does not send it
            open_positions_count:
              type: integer
        profile:
          type:
          - object
          - 'null'
          properties:
            currency:
              type: string
            currency_digits:
              type:
              - integer
              - 'null'
              description: 'How many decimals the account currency has (MT5 ACCOUNT_CURRENCY_DIGITS):
                every money figure of this account carries exactly this many'
            leverage:
              type: integer
            company:
              type: string
            account_type:
              type: string
              enum:
              - demo
              - live
              - contest
            margin_mode:
              type: string
              enum:
              - netting
              - exchange
              - hedging
            trade_allowed:
              type: boolean
            expert_allowed:
              type: boolean
            max_sessions:
              type:
              - integer
              - 'null'
            observed_at:
              type: string
              format: date-time
    Spread:
      type: object
      description: 'One instrument''s spread as the tenant''s own terminal sees it. A shared feed cannot
        answer this: the spread a user trades against is the one their broker gives *their* account, so
        it is read from their terminal and carries `age_s` — a spread is never returned without saying
        how old it is, because a stale spread reads as a live one and is acted on.'
      required:
      - symbol
      - bid
      - ask
      - spread_points
      - digits
      - tick_time
      - age_s
      properties:
        symbol:
          type: string
        bid:
          type: string
          description: decimal as a string
        ask:
          type: string
        spread_points:
          type: integer
          description: ask − bid in points, as MT5 counts them
        spread_price:
          type: string
          description: ask − bid in the quote currency, decimal as a string
        digits:
          type: integer
        pip_value_per_lot:
          type:
          - string
          - 'null'
          description: from the terminal, never derived; null until the terminal has reported it
        tick_time:
          type: string
          format: date-time
          description: UTC
        age_s:
          type: number
          description: how old the tick is; a caller decides for itself what is too old
    SpreadList:
      type: object
      description: 'Every instrument this terminal streams, not a page: a terminal carries at most instruments_max
        (100 Windows, 65 Linux).'
      required:
      - terminal_id
      - items
      - as_of
      properties:
        terminal_id:
          type: string
          format: uuid
        items:
          type: array
          items:
            $ref: '#/components/schemas/Spread'
        as_of:
          type: string
          format: date-time
          description: when the platform last heard from the terminal
    UsageLimit:
      type: object
      description: 'One limit: the figure in force, where it comes from, whether the platform applies
        it yet, and how much of it is in use where that is measured. Under `key` it is the figure for
        the calling key; under `tenant` the ceiling for all the tenant''s keys together.'
      required:
      - limit
      - source
      - enforced
      - used
      properties:
        limit:
          type: integer
          minimum: 1
          description: 'Under `key`, for commands_per_s, commands_burst and ws_conns: the lower of the
            key''s cap and the tenant''s ceiling (a key with no cap may use the whole ceiling). A key
            whose commands_per_s cap applies and that has no commands_burst cap of its own bursts to twice
            that cap, never past the tenant''s burst (source key_override, key_cap null). Otherwise the
            figure itself.'
        source:
          type: string
          enum:
          - plan
          - tenant_override
          - key_override
          description: Where `limit` comes from. A tenant ceiling is the tenant's own figure, else the
            plan's. Under `key`, key_override when the key's own cap or figure is what applies.
        key_cap:
          type:
          - integer
          - 'null'
          minimum: 1
          description: 'Under `key`, for commands_per_s, commands_burst and ws_conns only: the key''s
            own cap, null when the key has none (the default). Absent elsewhere.'
        enforced:
          type: boolean
          description: 'False while the figure is published and not yet applied to this tenant: a request
            over it is not refused. True once it is: an execution command over its rate is 429 `rate_limited`
            with `Retry-After`, and the stream refuses, drops or closes as its limit says, naming the
            limit in `details.limit`.'
        used:
          type:
          - integer
          - 'null'
          description: Current use where the platform measures it; null where it does not yet
    Usage:
      type: object
      description: The calling key's and its tenant's limits, each with where it comes from and how much
        of it is in use. Read it to pace an integration below the limits rather than finding them through
        429s.
      required:
      - plan
      - key
      - tenant
      - farms
      - per_login
      - lifecycle
      - webhooks
      - as_of
      properties:
        plan:
          type: string
          enum:
          - standard
          - enterprise
          - system
          description: The tenant's plan, whose defaults apply where nothing is overridden
        key:
          type: object
          description: The limits as they apply to the calling key. For commands_per_s, commands_burst
            and ws_conns that is the tenant's ceiling, lowered by the key's own cap where it has one.
          required:
          - key_id
          - commands_per_s
          - commands_burst
          - md_msgs_per_s
          - ws_conns
          - account_channels_per_conn
          properties:
            key_id:
              type: string
            commands_per_s:
              $ref: '#/components/schemas/UsageLimit'
              description: Execution commands per second, steady
            commands_burst:
              $ref: '#/components/schemas/UsageLimit'
              description: The most execution commands accepted at once; the steady rate refills it
            md_msgs_per_s:
              $ref: '#/components/schemas/UsageLimit'
              description: Market-data messages per second on this key's stream connections
            ws_conns:
              $ref: '#/components/schemas/UsageLimit'
              description: Stream connections open at once
            account_channels_per_conn:
              $ref: '#/components/schemas/UsageLimit'
              description: '`account:{terminal_id}` channels one connection may hold at once'
        tenant:
          type: object
          required:
          - commands_per_s
          - commands_burst
          - ws_conns
          - terminals
          properties:
            commands_per_s:
              $ref: '#/components/schemas/UsageLimit'
              description: Execution commands per second, steady, all the tenant's keys together
            commands_burst:
              $ref: '#/components/schemas/UsageLimit'
              description: The most execution commands accepted at once, all keys together; the steady
                rate refills it
            ws_conns:
              $ref: '#/components/schemas/UsageLimit'
              description: Stream connections open at once, all keys together
            terminals:
              type: object
              description: Terminals the tenant may have, not counting retired ones. A request over it
                is 409 `quota_exceeded`.
              required:
              - limit
              - used
              - source
              properties:
                limit:
                  type: integer
                  minimum: 1
                used:
                  type: integer
                  minimum: 0
                source:
                  type: string
                  enum:
                  - tenant_override
                  - platform_default
        farms:
          type: array
          description: The farms the tenant may place a terminal on, each with what one of its cells holds
            and how many terminals are on it now.
          items:
            type: object
            required:
            - farm
            - cap
            - used
            properties:
              farm:
                $ref: '#/components/schemas/Ref'
              cap:
                type:
                - integer
                - 'null'
                description: 'Terminals one cell of the farm holds, not the farm''s total: a farm adds
                  cells by itself as it fills, so it has no total of its own. Null where no cap is set'
              used:
                type: integer
                minimum: 0
                description: Terminals on the whole farm now, not counting retired ones. It may be more
                  than `cap` once the farm has more than one cell
        per_login:
          type: object
          description: How many terminals may run on one broker login.
          required:
          - plan_limit
          - servers
          properties:
            plan_limit:
              type: integer
              minimum: 0
              description: '0: only the broker server''s own limit applies'
            servers:
              type: array
              description: Each enabled broker server, with the number of sessions it is known to allow
                on one login.
              items:
                type: object
                required:
                - broker
                - server
                - max_sessions
                - max_sessions_source
                properties:
                  broker:
                    $ref: '#/components/schemas/Ref'
                  server:
                    $ref: '#/components/schemas/Ref'
                  max_sessions:
                    type:
                    - integer
                    - 'null'
                    description: 'Null: not known yet'
                  max_sessions_source:
                    type:
                    - string
                    - 'null'
                    enum:
                    - probed
                    - limit
                    - operator
                    - null
                    description: '`probed`: seen to hold this many, a lower bound; `limit`: the ceiling
                      found; `operator`: entered, final'
        lifecycle:
          type: object
          description: The rules a terminal operation (restart, rebuild, move, retire, retry, attach,
            detach, drain) is refused by.
          required:
          - cooldown_s
          - tenant_rate_per_hour
          - concurrency
          - farm_share
          - queue_max_wait_s
          properties:
            cooldown_s:
              type: object
              additionalProperties:
                type: integer
                minimum: 0
              description: Seconds a terminal rests after an operation of this kind; refused 429 `cooldown`
            tenant_rate_per_hour:
              type: object
              additionalProperties:
                type: integer
                minimum: 1
              description: Operations of this kind and its kin per tenant per hour; refused 429 `tenant_rate`
            concurrency:
              type: object
              additionalProperties:
                type: integer
                minimum: 1
              description: Operations of this kind and its kin a tenant may have open at once; refused
                429 `concurrency`
            farm_share:
              type: number
              description: The share of a farm's terminals that may be in an operation at once (never
                fewer than one); refused 429 `farm_capacity`
            queue_max_wait_s:
              type: integer
              minimum: 0
              description: How long a refused operation may wait its turn
        webhooks:
          type: object
          required:
          - endpoints
          - timeout_ms
          - retry_after_seconds
          - pause_after_hours
          - failure_days
          - in_flight_per_endpoint
          properties:
            endpoints:
              type: object
              required:
              - limit
              - used
              properties:
                limit:
                  type: integer
                  minimum: 1
                used:
                  type: integer
                  minimum: 0
            timeout_ms:
              type: integer
            retry_after_seconds:
              type: array
              items:
                type: integer
              description: The waits before each retry of a failed delivery
            pause_after_hours:
              type: integer
            failure_days:
              type: integer
            in_flight_per_endpoint:
              type: integer
        copy:
          $ref: '#/components/schemas/CopyUsage'
          description: Copy Trading's limits; absent when your plan does not include Copy Trading
        as_of:
          type: string
          format: date-time
    MdSubscriptionCreate:
      type: object
      additionalProperties: false
      required:
      - server_id
      - symbol
      properties:
        server_id:
          type: string
          format: uuid
          description: The broker is the server's own
        symbol:
          type: string
          description: In the broker's own name, as the tenant's catalogue lists it
        timeframes:
          type: array
          items:
            type: string
            enum:
            - M1
            - M5
            - M15
            - M30
            - H1
            - H4
            - D1
            - W1
            - MN1
          description: Candles to build; none means ticks only
        delivery:
          type: string
          enum:
          - ws
          - redis_push
          default: ws
        connector_id:
          type:
          - string
          - 'null'
          format: uuid
          description: Required for redis_push, which is not yet available
    MdSubscription:
      type: object
      required:
      - id
      - broker
      - server
      - symbol
      - timeframes
      - delivery
      - state
      - created_at
      properties:
        id:
          type: string
          format: uuid
        broker:
          $ref: '#/components/schemas/Ref'
        server:
          $ref: '#/components/schemas/Ref'
        symbol:
          type: string
        timeframes:
          type: array
          items:
            type: string
        delivery:
          type: string
          enum:
          - ws
          - redis_push
        state:
          type: string
          enum:
          - pending
          - streaming
          - degraded
          - stopped
          description: '`pending` until the first tick. `degraded` when the symbol cannot tick or should
            be ticking and is not (`degraded_reason`); its stream stays granted'
        degraded_reason:
          type:
          - string
          - 'null'
          enum:
          - symbol_removed
          - subscription_refused
          - terminal_disconnected
          - report_stale
          - no_ticks_in_session
          - bars_unwatched
          - bars_gap
          - null
          description: 'Why the subscription is `degraded`; null in every other state. `symbol_removed`:
            the broker no longer lists the symbol. `subscription_refused`: the broker refused it on every
            one of your ACTIVE terminals on the server that carries it. `terminal_disconnected`: you have
            no ACTIVE terminal on the server and no report of the symbol has arrived for the unknown window.
            `report_stale`: a terminal is ACTIVE and still none has arrived, for instance because none
            of them carries the symbol any more. `no_ticks_in_session`: the symbol''s own hours say it
            is trading and it has not ticked for the silence window (measured at the newest report); it
            recovers on two reports in a row that each bring a new tick inside the window, or when its
            session closes. Nothing is degraded for silence outside the symbol''s trading session. `bars_unwatched`:
            the subscription asks for timeframes and none of your terminals on the server watches the
            symbol, so no closed bar can be sent. `bars_gap`: a closed-bar series has a gap the platform
            could not repair (no terminal to read it through); GET says how far it is complete.'
        degraded_since:
          type:
          - string
          - 'null'
          format: date-time
          description: When it became degraded; null in every other state
        degraded_cause:
          type:
          - string
          - 'null'
          enum:
          - broker
          - platform
          - null
          description: 'Whose cause the degradation is; null in every other state. `broker`: the broker
            removed or refused the symbol, or, for `no_ticks_in_session`, no terminal on the server has
            ticked it inside the silence window either. `platform`: your terminals are lost or not reporting,
            or the symbol is ticking for other terminals on the server and not for this subscription.
            Judged again on every pass; a change sends no event.'
        first_tick_at:
          type:
          - string
          - 'null'
          format: date-time
        created_at:
          type: string
          format: date-time
    WebhookEndpointCreate:
      type: object
      description: 'An address MFX Hub calls for the tenant''s events. `https` only, port 443 or 8443,
        a host name and not an address, no credentials in the URL; a name that resolves to a private,
        loopback, link-local, metadata or MFX Hub address is refused with 422. The number of endpoints
        a tenant may have is limited (409 `quota_exceeded`). Each delivery''s body is the event as the
        `events` channel carries its `data`: `type`, the fields of the schema `x-event-payloads` on `/stream`
        names for that type, and `id`, the event''s cursor (`MFX-Event-Id`).'
      additionalProperties: false
      required:
      - url
      - event_types
      properties:
        url:
          type: string
          format: uri
          maxLength: 2048
        event_types:
          type: array
          minItems: 1
          maxItems: 64
          description: Event types as the events channel names them (`position.closed`), a family (`terminal.*`),
            or `*` for all. Ticks and candles are not events and are never sent this way
          items:
            type: string
            maxLength: 64
        description:
          type:
          - string
          - 'null'
          maxLength: 200
    WebhookEndpointUpdate:
      type: object
      description: 'Fields left out keep their value. `status: active` resumes an endpoint paused by the
        tenant, an operator or the platform; `paused` pauses it'
      additionalProperties: false
      properties:
        url:
          type: string
          format: uri
          maxLength: 2048
        event_types:
          type: array
          minItems: 1
          maxItems: 64
          items:
            type: string
            maxLength: 64
        description:
          type:
          - string
          - 'null'
          maxLength: 200
        status:
          type: string
          enum:
          - active
          - paused
    WebhookEndpoint:
      type: object
      description: One endpoint and how it is doing. A delivery that worked is a count and a time, never
        a record; what did not arrive is read from its failures. Never the secret.
      required:
      - id
      - url
      - event_types
      - description
      - status
      - paused_reason
      - paused_by
      - delivered
      - last_delivered_at
      - last_failed_at
      - retrying
      - dead
      - cursor
      - previous_secret_until
      - created_at
      properties:
        id:
          type: string
          format: uuid
        url:
          type: string
        event_types:
          type: array
          items:
            type: string
        description:
          type:
          - string
          - 'null'
        status:
          type: string
          enum:
          - active
          - paused
        paused_reason:
          type:
          - string
          - 'null'
          description: Why it is paused, in words; null while active
        paused_by:
          type:
          - string
          - 'null'
          enum:
          - tenant
          - operator
          - platform
          - null
          description: 'platform: nothing was delivered for the platform''s pause period while events
            failed'
        delivered:
          type: integer
          minimum: 0
          description: Events delivered since the endpoint was made
        last_delivered_at:
          type:
          - string
          - 'null'
          format: date-time
        last_failed_at:
          type:
          - string
          - 'null'
          format: date-time
        retrying:
          type: integer
          minimum: 0
          description: Failed events still being tried
        dead:
          type: integer
          minimum: 0
          description: Events whose last try failed, kept for a limited number of days
        cursor:
          type:
          - string
          - 'null'
          description: 'The last event of the stream handed on: what a resume continues from'
        previous_secret_until:
          type:
          - string
          - 'null'
          format: date-time
          description: After a rotation, until when the previous secret also signs
        created_at:
          type: string
          format: date-time
    WebhookEndpointCreated:
      description: 'The endpoint, and its signing secret: shown in this answer and never again'
      allOf:
      - $ref: '#/components/schemas/WebhookEndpoint'
      - type: object
        required:
        - secret
        properties:
          secret:
            type: string
            description: 32 random bytes, base64url. Stored securely and shown only here; not in any GET,
              event, log or audit record
    WebhookEndpointList:
      type: object
      required:
      - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/WebhookEndpoint'
    WebhookSecretRotated:
      type: object
      description: The new secret, shown once. The previous one signs beside it until `previous_secret_until`,
        a day
      required:
      - secret
      - previous_secret_until
      properties:
        secret:
          type: string
        previous_secret_until:
          type: string
          format: date-time
    WebhookAttempt:
      type: object
      required:
      - at
      - outcome
      - status_code
      - ms
      properties:
        at:
          type: string
          format: date-time
        outcome:
          type: string
          enum:
          - status
          - timeout
          - connection
          - tls
          - refused_address
          description: 'status: the receiver answered, not 2xx. Never a text from the receiver''s side'
        status_code:
          type:
          - integer
          - 'null'
        ms:
          type:
          - integer
          - 'null'
    WebhookFailure:
      type: object
      description: One event that did not arrive at the first try, with every attempt made on it. Kept
        for a limited number of days
      required:
      - id
      - event_id
      - event_type
      - state
      - attempts
      - next_attempt_at
      - prune_at
      properties:
        id:
          type: string
          format: uuid
        event_id:
          type: string
          description: 'The event''s cursor in the tenant''s stream: MFX-Event-Id'
        event_type:
          type: string
        state:
          type: string
          enum:
          - retrying
          - delivered
          - dead
        attempts:
          type: array
          items:
            $ref: '#/components/schemas/WebhookAttempt'
        next_attempt_at:
          type:
          - string
          - 'null'
          format: date-time
        prune_at:
          type: string
          format: date-time
    WebhookFailurePage:
      type: object
      required:
      - items
      - next_cursor
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/WebhookFailure'
        next_cursor:
          type:
          - string
          - 'null'
    WebhookReplay:
      type: object
      description: 'Send again every event after `after` that the endpoint asks for, marked MFX-Delivery-Attempt:
        replay; or one dead letter by its id'
      additionalProperties: false
      properties:
        after:
          type: string
          description: A cursor of the tenant's stream. Refused 409 cursor_too_old, with details.oldest,
            when the stream no longer holds it
        failure_id:
          type: string
          format: uuid
    WebhookReplayAccepted:
      type: object
      required:
      - events
      properties:
        events:
          type: integer
          minimum: 0
          description: How many events are queued to be sent again
    WebhookTestAccepted:
      type: object
      required:
      - event_id
      properties:
        event_id:
          type: string
          description: The cursor of the `webhook.test` event sent
    WebhookEndpointPaused:
      type: object
      description: '`data` of a `webhook.endpoint_paused` message on the `events` channel'
      required:
      - schema_version
      - endpoint_id
      - by
      - reason
      - at
      properties:
        schema_version:
          type: string
        endpoint_id:
          type: string
          format: uuid
        by:
          type: string
          enum:
          - tenant
          - operator
          - platform
        reason:
          type: string
        at:
          type: string
          format: date-time
    WebhookEndpointResumed:
      type: object
      description: '`data` of a `webhook.endpoint_resumed` message on the `events` channel'
      required:
      - schema_version
      - endpoint_id
      - by
      - at
      properties:
        schema_version:
          type: string
        endpoint_id:
          type: string
          format: uuid
        by:
          type: string
          enum:
          - tenant
          - operator
        at:
          type: string
          format: date-time
    WebhookTest:
      type: object
      description: '`data` of a `webhook.test` message: sent only by the test route, to that endpoint
        alone'
      required:
      - schema_version
      - endpoint_id
      - at
      properties:
        schema_version:
          type: string
        endpoint_id:
          type: string
          format: uuid
        at:
          type: string
          format: date-time
    MdSubscriptionDegraded:
      type: object
      description: '`data` of an `md.subscription_degraded` message on the `events` channel: sent once
        when a subscription becomes degraded, whatever the cause. A reason or a cause that gives way to
        another while it stays degraded sends nothing; read the subscription for the reason and the cause
        that hold now.'
      required:
      - schema_version
      - subscription_id
      - broker_id
      - server_id
      - symbol
      - reason
      - cause
      - since
      properties:
        schema_version:
          type: string
        subscription_id:
          type: string
          format: uuid
        broker_id:
          type: string
          format: uuid
        server_id:
          type: string
          format: uuid
        symbol:
          type: string
        reason:
          type: string
          enum:
          - symbol_removed
          - subscription_refused
          - terminal_disconnected
          - report_stale
          - no_ticks_in_session
        cause:
          type: string
          enum:
          - broker
          - platform
          description: Whose cause it is, as the subscription's `degraded_cause`; on a recovery, the cause
            it recovered from. Sent whatever the cause
        since:
          type: string
          format: date-time
        last_tick_at:
          type: string
          format: date-time
          description: The symbol's last tick; absent when it has not ticked
    MdSubscriptionRecovered:
      type: object
      description: '`data` of an `md.subscription_recovered` message on the `events` channel: sent once
        when a degraded subscription is delivering again. `reason` is what it recovered from and `since`
        when it had become degraded.'
      required:
      - schema_version
      - subscription_id
      - broker_id
      - server_id
      - symbol
      - reason
      - cause
      - since
      - recovered_at
      properties:
        schema_version:
          type: string
        subscription_id:
          type: string
          format: uuid
        broker_id:
          type: string
          format: uuid
        server_id:
          type: string
          format: uuid
        symbol:
          type: string
        reason:
          type: string
          enum:
          - symbol_removed
          - subscription_refused
          - terminal_disconnected
          - report_stale
          - no_ticks_in_session
        cause:
          type: string
          enum:
          - broker
          - platform
          description: Whose cause it is, as the subscription's `degraded_cause`; on a recovery, the cause
            it recovered from. Sent whatever the cause
        since:
          type: string
          format: date-time
        recovered_at:
          type: string
          format: date-time
        last_tick_at:
          type: string
          format: date-time
          description: Absent when the symbol has not ticked
    MaintenanceWindowChanged:
      example:
        schema_version: '1'
        window_id: 5b1d7e0a-2c44-4f0e-9a51-7d3b8c6e1f20
        label: MW-0031
        state: in_progress
        starts_at: '2026-11-05T10:00:00Z'
        ends_at: '2026-11-05T12:00:00Z'
        message: Planned maintenance on 3 of your terminals until about 12:00 UTC
        terminals: '3'
        change: eta_moved
      type: object
      description: '`data` of a `maintenance.window_changed` message on the `events` channel, and the
        same event to webhooks: sent when a window is announced to you, starts, its expected end or its
        message changes, ends or is cancelled. The fields are those of `TenantMaintenance`, as the window
        stands after the change; `GET /maintenance` answers the same. On the stream every value is text,
        as on every event.'
      required:
      - schema_version
      - window_id
      - label
      - state
      - starts_at
      - ends_at
      - message
      - terminals
      - change
      properties:
        schema_version:
          type: string
          description: The payload's version; 1
        window_id:
          type: string
          format: uuid
        label:
          type: string
          description: MW-0031
        state:
          type: string
          enum:
          - scheduled
          - in_progress
          - completed
          - cancelled
        starts_at:
          type: string
          format: date-time
        ends_at:
          type: string
          format: date-time
          description: 'The current expected end: the ETA while in progress'
        message:
          type: string
          description: The notice as sent to you, with your own counts; empty when the notice is off
        terminals:
          type: string
          description: How many of your terminals are in the window; GET /maintenance/{id}/terminals lists
            them, each with its own expected time
        change:
          type: string
          enum:
          - announced
          - started
          - eta_moved
          - message_changed
          - ended
          - cancelled
          description: What moved this time
    TerminalJournal:
      type: object
      required:
      - terminal_id
      - from
      - read_at
      - lines
      properties:
        terminal_id:
          type: string
          format: uuid
        from:
          type: string
          enum:
          - live
          - last_words
          description: 'live: read from the running terminal now. last_words: kept by its cell when it
            stopped'
        read_at:
          type: string
          format: date-time
          description: 'When the cell read the journal: now for live, the stop for last_words'
        stopped:
          type:
          - string
          - 'null'
          enum:
          - stopped
          - failed
          - retired
          - null
          description: For last_words, why the cell kept them; null for live
        lines:
          type: array
          items:
            $ref: '#/components/schemas/JournalLine'
          description: Newest first
    JournalLine:
      type: object
      required:
      - ts
      - source
      - message
      properties:
        ts:
          type: string
          format: date-time
          description: 'UTC: the journal file''s date and the line''s time, converted from the cell''s
            clock'
        source:
          type: string
          description: The journal's own source column as MetaTrader writes it, e.g. Network, Terminal,
            Trades
        message:
          type: string
          maxLength: 200
          description: The line as written, account numbers masked, file paths removed, at most 200 characters.
            MetaTrader's journal has no level column, so none is given
    BrokerCatalogue:
      type: object
      required:
      - server_id
      - account_type
      - source
      - catalogue_hash
      - symbols
      - refreshed_at
      properties:
        server_id:
          type: string
          format: uuid
        account_type:
          type: string
          description: The broker's symbol variant, as on GET /brokers/{id}/symbols
        source:
          type: string
          enum:
          - live
          - last_known
          description: As SymbolPage.source
        catalogue_hash:
          type: string
          description: sha256 over every listed symbol's name, spec_hash, description and identity fields,
            in name order
        symbols:
          type: integer
          description: Symbols listed now (removed ones excluded)
        refreshed_at:
          type: string
          format: date-time
          description: The newest refreshed_at of its rows
    BrokerCatalogueList:
      type: object
      required:
      - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/BrokerCatalogue'
    SymbolSpecChanged:
      type: object
      description: '`data` of a `symbol.spec_changed` message on the `events` channel: sent once for each
        change a tenant''s terminal reported to a symbol on its own catalogue (one server and account
        type) - the specification a program sizes a trade by, what trading the broker allows, the trade
        sessions, or the symbol''s removal. A pip value that moves with the exchange rate is not a change
        and sends nothing; read it on the catalogue. On the stream every value is text, and `before` and
        `after` are JSON objects as text.'
      required:
      - schema_version
      - terminal_id
      - broker_id
      - server_id
      - account_type
      - symbol
      - change
      - before
      - after
      - observed_at
      properties:
        schema_version:
          type: string
        terminal_id:
          type: string
          format: uuid
          description: 'The join key: the terminal whose report showed the change. Every terminal of the
            tenant on that server and account type reads the same catalogue'
        broker_id:
          type: string
          format: uuid
        server_id:
          type: string
          format: uuid
        account_type:
          type: string
        symbol:
          type: string
        change:
          type: string
          enum:
          - spec
          - trading
          - sessions
          - removed
          - added
          - came_back
          - description
          - identity
          description: 'added: new on the catalogue; came_back: listed again after a removal; description:
            the broker''s long name changed; identity: path, isin, exchange, category, currency_base,
            basis or calc_mode changed. MetaTrader has no rename: a renamed symbol is removed and added,
            and isin is how the two may be matched'
        before:
          type:
          - object
          - 'null'
          description: 'The symbol before (digits, contract_size, volume_min, volume_step, volume_max,
            trade_mode, margin_currency, pip_value_per_lot, trade_sessions, description, the broker facts
            and the identity fields), decimals as strings. By change: added, null; came_back, as last
            stored before it vanished; spec, trading, sessions, description and identity, as stored before
            the report; removed, as last stored'
        after:
          type:
          - object
          - 'null'
          description: The symbol after, same shape, as the report left it; null for a removal
        observed_at:
          type: string
          format: date-time
          description: When the terminal read its list
    MdSubscriptionPage:
      type: object
      required:
      - items
      - next_cursor
      properties:
        next_cursor:
          type:
          - string
          - 'null'
          description: Opaque (created_at, id) cursor for the following page; null on the last page
        returned:
          type: integer
          description: How many items are in THIS page; never a total
        items:
          type: array
          items:
            $ref: '#/components/schemas/MdSubscription'
    AccountMdSubscriptionCreate:
      type: object
      additionalProperties: false
      required:
      - symbol
      properties:
        symbol:
          type: string
          description: As `GET /accounts/{id}/symbols` lists it
    AccountMdSubscription:
      type: object
      description: A cTrader account's market-data subscription
      required:
      - id
      - account_id
      - symbol
      - state
      - created_at
      properties:
        id:
          type: string
          format: uuid
          description: Stopped with DELETE /md/subscriptions/{id}
        account_id:
          type: string
          format: uuid
        symbol:
          type: string
        state:
          type: string
          enum:
          - pending
          - streaming
          - stopped
          description: '`pending` until the first spot after it; `streaming` once one has arrived'
        first_tick_at:
          type:
          - string
          - 'null'
          format: date-time
        created_at:
          type: string
          format: date-time
    AccountMdSubscriptionPage:
      type: object
      required:
      - items
      - next_cursor
      properties:
        next_cursor:
          type:
          - string
          - 'null'
          description: Opaque (created_at, id) cursor for the following page; null on the last page
        returned:
          type: integer
          description: How many items are in THIS page; never a total
        items:
          type: array
          items:
            $ref: '#/components/schemas/AccountMdSubscription'
    CredentialSubmission:
      type: object
      description: 'What a tenant sends to put its own broker login on a terminal. The only request body
        in MFX Hub that carries a secret: it is read once, wrapped, written to the platform''s secret
        store and never kept anywhere else, logged or echoed. Unknown properties are refused rather than
        ignored, so a misspelled password is an error and not a credential with no password.'
      required:
      - login
      - password
      - server
      additionalProperties: false
      properties:
        login:
          type: integer
          minimum: 1
          description: The MT5 account number
        password:
          type: string
          minLength: 1
          maxLength: 256
          format: password
          writeOnly: true
        server:
          type: string
          minLength: 1
          maxLength: 128
          description: Must be the terminal's own broker server; a mismatch is a 400
        cred_type:
          type: string
          enum:
          - master
          - investor
          default: master
          description: An investor credential turns execution off
    CredentialAccepted:
      type: object
      description: The reference, and nothing else. There is no property here a secret could live in,
        and nothing a client could do with the reference that resubmitting would not do better.
      required:
      - credential_ref_id
      - terminal_id
      - cred_type
      - execution_disabled
      - rotated
      - takes_effect
      - operation_id
      properties:
        rotated:
          type: boolean
          description: True when this replaced the credential the terminal already had
        takes_effect:
          type: string
          enum:
          - first_login
          - restart
          - retry_login
          - next_login
          description: 'When the terminal logs in with what was submitted. `first_login` for a first credential.
            For a rotation: `restart` (it was ACTIVE and is being restarted now), `retry_login` (it was
            FAILED and rejoins the login queue now), or `next_login` (nothing was started, or the operation
            was refused; its next login uses it).'
        operation_id:
          type:
          - string
          - 'null'
          format: uuid
          description: The restart or retry-login a rotation opened, to follow on the operations routes;
            null when none
        not_applied_reason:
          type:
          - string
          - 'null'
          description: 'Why a rotation of a running terminal was not applied now (`takes_effect` is `next_login`
            because the restart or retry-login was refused): the refusal''s own `error.code`, such as
            `operation_in_progress`, `cooldown`, `tenant_rate` or `positions_open`. Null in every other
            answer. The credential is stored either way.'
        same_login_terminals_stale:
          type: integer
          description: 'On a password change (`rotated: true`): how many of your OTHER live terminals
            use the same login and were last given their password before this submission. Each terminal
            holds its own credential, so after changing the password at the broker, submit it to each
            of them. 0 in every other answer.'
        credential_ref_id:
          type: string
          format: uuid
        terminal_id:
          type: string
          format: uuid
        cred_type:
          type: string
          enum:
          - master
          - investor
        execution_disabled:
          type: boolean
          description: True when this submission turned execution off, so the caller learns it here rather
            than from an order being refused later.
    SymbolState:
      type: string
      description: 'Checked in this order, first match wins: unknown (no terminal of the tenant on this
        server is connected, or the newest symbol report from one is older than 180 s by default — could-not-read
        is never reported as closed) → trade_disabled → closed_session (broker time outside this weekday''s
        trade sessions) → paused (inside trade sessions, a watched symbol with no tick for 300 s by default)
        → close_only → long_only / short_only → open.'
      enum:
      - open
      - closed_session
      - paused
      - trade_disabled
      - close_only
      - long_only
      - short_only
      - unknown
    SymbolStatus:
      type: object
      required:
      - state
      - reason
      - since
      - next_open
      - last_tick_age_s
      - quote_watched
      - as_of
      properties:
        state:
          $ref: '#/components/schemas/SymbolState'
        reason:
          type:
          - string
          - 'null'
          enum:
          - terminal_disconnected
          - report_stale
          - trade_mode_disabled
          - outside_trade_session
          - no_ticks_in_session
          - trade_mode_close_only
          - trade_mode_long_only
          - trade_mode_short_only
          - null
          description: null when open.
        since:
          type:
          - string
          - 'null'
          format: date-time
          description: when the current state began, where known
        next_open:
          type:
          - string
          - 'null'
          format: date-time
          description: closed_session only — the next trade-session start, UTC
        last_tick_age_s:
          type:
          - number
          - 'null'
          description: null when the symbol is not watched
        quote_watched:
          type: boolean
          description: True when a terminal of the tenant has this symbol in its instruments, so tick
            age is known and `paused` can be detected. An unwatched symbol is never reported paused.
        as_of:
          type: string
          format: date-time
          description: when this status was worked out
    TradeSession:
      type: object
      required:
      - day
      - from
      - to
      description: One trade session in BROKER time, as MT5 reports it.
      properties:
        day:
          type: string
          enum:
          - mon
          - tue
          - wed
          - thu
          - fri
          - sat
          - sun
        from:
          type: string
          pattern: ^[0-2][0-9]:[0-5][0-9]$
        to:
          type: string
          pattern: ^[0-2][0-9]:[0-5][0-9]$
          description: 24:00 means end of day
    Symbol:
      type: object
      required:
      - symbol
      - description
      - server_id
      - account_type
      - digits
      - contract_size
      - volume_min
      - volume_max
      - volume_step
      - trade_mode
      - margin_currency
      - pip_value_per_lot
      - spec_hash
      - trade_sessions
      - refreshed_at
      - status
      properties:
        symbol:
          type: string
        description:
          type: string
        server_id:
          type: string
          format: uuid
        account_type:
          type: string
        digits:
          type: integer
        contract_size:
          type: string
          description: decimal as a string
        volume_min:
          type: string
        volume_max:
          type: string
        volume_step:
          type: string
        trade_mode:
          type: string
          enum:
          - disabled
          - longonly
          - shortonly
          - closeonly
          - full
        margin_currency:
          type: string
        profit_currency:
          type:
          - string
          - 'null'
          description: The currency the profit is computed in (SYMBOL_CURRENCY_PROFIT).
        point:
          type:
          - string
          - 'null'
          description: 'One point, the smallest price step the symbol is quoted in (SYMBOL_POINT): 0.00001
            on a five-digit FX pair.'
        tick_size:
          type:
          - string
          - 'null'
          description: The smallest price change a price may make (SYMBOL_TRADE_TICK_SIZE); a price off
            it is put on it by the snap rule.
        tick_value:
          type:
          - string
          - 'null'
          description: 'What one tick is worth on one lot, in the account currency (SYMBOL_TRADE_TICK_VALUE).
            A quote figure like pip_value_per_lot: it moves with the exchange rate where the profit currency
            is not the account''s, and it is not in spec_hash.'
        stops_level:
          type:
          - integer
          - 'null'
          description: How close to the current price, in points, a stop loss, a take profit or a pending
            price may be set (SYMBOL_TRADE_STOPS_LEVEL); 0 means the broker sets no minimum.
        freeze_level:
          type:
          - integer
          - 'null'
          description: How close to the current price, in points, a pending order or a position's stops
            can no longer be changed (SYMBOL_TRADE_FREEZE_LEVEL); 0 means none.
        swap_long:
          type:
          - string
          - 'null'
          description: The swap a buy position pays or earns a night, in the unit swap_type names (SYMBOL_SWAP_LONG).
        swap_short:
          type:
          - string
          - 'null'
          description: As swap_long, for a sell position (SYMBOL_SWAP_SHORT)
        swap_type:
          type:
          - string
          - 'null'
          enum:
          - disabled
          - points
          - currency_symbol
          - currency_margin
          - currency_deposit
          - interest_current
          - interest_open
          - reopen_current
          - reopen_bid
          - null
          description: The unit of swap_long and swap_short (MT5 SYMBOL_SWAP_MODE 0-8, lower-cased).
        margin_initial:
          type:
          - string
          - 'null'
          description: The broker's initial margin setting for one lot (SYMBOL_MARGIN_INITIAL), in the
            unit the symbol's margin calculation mode uses; 0 when the broker leaves it to the calculation
            mode. To pre-check margin read margin_per_lot.
        margin_maintenance:
          type:
          - string
          - 'null'
          description: As margin_initial, the maintenance margin (SYMBOL_MARGIN_MAINTENANCE)
        margin_per_lot:
          type:
          - string
          - 'null'
          description: 'The margin one lot bought at the current ask holds, in the account currency, as
            the terminal computes it (order_calc_margin) with this account''s leverage. A quote figure
            like pip_value_per_lot: it moves with price and is not in spec_hash.'
        filling_modes:
          type:
          - array
          - 'null'
          items:
            type: string
            enum:
            - fok
            - ioc
            - boc
          description: 'The fill policies the broker allows besides return (SYMBOL_FILLING_MODE flags:
            fill or kill, immediate or cancel, book or cancel).'
        pip_value_per_lot:
          type:
          - string
          - 'null'
          description: 'from the terminal, never derived. A quote figure, not part of the specification:
            it moves with the exchange rate, is kept within the platform''s tolerance of the terminal''s
            own value for a watched symbol, and neither moves spec_hash nor raises symbol.spec_changed'
        spec_hash:
          type: string
          description: changes drive symbol.spec_changed. Taken over digits, contract_size, volume_min,
            volume_max, volume_step, trade_mode, margin_currency, profit_currency, point, tick_size, stops_level,
            freeze_level, swap_long, swap_short, swap_type, margin_initial, margin_maintenance and filling_modes;
            not over the quote figures pip_value_per_lot, tick_value and margin_per_lot
        trade_sessions:
          type:
          - array
          - 'null'
          description: null when the terminal could not report sessions; closed_session is then never
            derived
          items:
            $ref: '#/components/schemas/TradeSession'
        refreshed_at:
          type: string
          format: date-time
        status:
          $ref: '#/components/schemas/SymbolStatus'
        path:
          type:
          - string
          - 'null'
          description: Where the broker files the symbol (SYMBOL_PATH), e.g. Shares\US\NVDA. Null when
            the broker leaves it empty; never inferred
        isin:
          type:
          - string
          - 'null'
          description: SYMBOL_ISIN, as the broker fills it; null when empty
        exchange:
          type:
          - string
          - 'null'
          description: SYMBOL_EXCHANGE; null when empty
        category:
          type:
          - string
          - 'null'
          description: SYMBOL_CATEGORY, the broker's own free text; null when empty
        currency_base:
          type:
          - string
          - 'null'
          description: SYMBOL_CURRENCY_BASE; null when empty
        basis:
          type:
          - string
          - 'null'
          description: SYMBOL_BASIS, the underlying asset of a derivative; null when empty
        calc_mode:
          type:
          - string
          - 'null'
          description: SYMBOL_TRADE_CALC_MODE as MetaTrader names it, lower-case without its prefix (forex,
            futures, cfd, cfdindex, cfdleverage, forex_no_leverage, exch_stocks, exch_futures, exch_options,
            exch_options_margin, exch_bonds, exch_stocks_moex, exch_bonds_moex, serv_collateral); a number
            without a name is given as its digits
    SymbolPage:
      type: object
      required:
      - items
      - next_cursor
      properties:
        source:
          type: string
          enum:
          - live
          - last_known
          description: 'live: a terminal of yours runs on this server and account type. last_known: none
            does any more; the rows are the last your terminals reported, each with its refreshed_at'
        next_cursor:
          type:
          - string
          - 'null'
          description: Opaque (created_at, id) cursor for the following page; null on the last page
        returned:
          type: integer
          description: How many items are in THIS page; never a total
        items:
          type: array
          items:
            $ref: '#/components/schemas/Symbol'
    SymbolQuote:
      type: object
      required:
      - symbol
      - server_id
      - account_type
      - bid
      - ask
      - tick_time
      - broker_time
      - age_s
      - state
      properties:
        symbol:
          type: string
        server_id:
          type: string
          format: uuid
        account_type:
          type: string
        bid:
          type: string
          description: decimal as a string
        ask:
          type: string
        tick_time:
          type: string
          format: date-time
          description: UTC
        broker_time:
          type: string
          description: the tick time on the broker's clock, no offset (MT5 server time), e.g. 2026-09-17T17:07:10.612
        age_s:
          type: number
        state:
          $ref: '#/components/schemas/SymbolState'
    MaintenanceService:
      type: string
      enum:
      - terminal_creation
      - terminal_management
      - order_placement
      - farm_creation
      - farm_management
      - market_data
      - expert_advisors
      - terminal_logins
      - tenant_console_read_only
      - tenant_console_unavailable
      description: A service a window may suspend.
    TenantMaintenance:
      type: object
      description: A maintenance window as a tenant of its scope sees it
      required:
      - id
      - label
      - state
      - starts_at
      - ends_at
      - expected_minutes
      - started_at
      - ended_at
      - message
      - suspended
      - terminals
      - console
      properties:
        id:
          type: string
          format: uuid
        label:
          type: string
          description: MW-0031
        state:
          type: string
          enum:
          - scheduled
          - in_progress
          - completed
          - cancelled
          description: in_progress covers running, paused and verifying; completed covers aborted (service
            restored)
        starts_at:
          type: string
          format: date-time
        ends_at:
          type: string
          format: date-time
          description: 'The current expected end: the ETA while in progress'
        expected_minutes:
          type: integer
        started_at:
          type:
          - string
          - 'null'
          format: date-time
        ended_at:
          type:
          - string
          - 'null'
          format: date-time
        message:
          type:
          - string
          - 'null'
          description: The tenant notification as scheduled, with this tenant's own counts; null when
            the notice is off
        suspended:
          type: array
          items:
            $ref: '#/components/schemas/MaintenanceService'
          description: The services suspended for this tenant
        terminals:
          type: integer
          description: 'This tenant''s terminals in scope: previewed before the start, resolved after'
        console:
          type: string
          enum:
          - normal
          - read_only
          - unavailable
          description: What the tenant console must do while it is in progress; normal otherwise
    TenantMaintenancePage:
      type: object
      required:
      - items
      - next_cursor
      properties:
        next_cursor:
          type:
          - string
          - 'null'
          description: Opaque cursor for the following page; null on the last page
        returned:
          type: integer
          description: How many items are in THIS page; never a total
        items:
          type: array
          items:
            $ref: '#/components/schemas/TenantMaintenance'
    TenantMaintenanceTerminal:
      type: object
      required:
      - terminal_id
      - state
      - since
      - eta_at
      properties:
        terminal_id:
          type: string
          format: uuid
        state:
          type: string
          enum:
          - waiting
          - migrating
          - back
          - attention
          description: waiting for its batch; migrating (moving to a new machine, or restarting); back;
            attention (did not come back, an operator is on it)
        since:
          type:
          - string
          - 'null'
          format: date-time
        eta_at:
          type:
          - string
          - 'null'
          format: date-time
          description: 'When this terminal is expected back: its batch''s expected end while migrating,
            its batch''s expected start plus a batch while waiting'
    TenantMaintenanceTerminalPage:
      type: object
      required:
      - items
      - next_cursor
      properties:
        next_cursor:
          type:
          - string
          - 'null'
          description: Opaque cursor for the following page; null on the last page
        returned:
          type: integer
          description: How many items are in THIS page; never a total
        items:
          type: array
          items:
            $ref: '#/components/schemas/TenantMaintenanceTerminal'
    OwnContact:
      type: object
      description: A person at the tenant and what they are told. The representative is emailed about
        code and confirms live trading on a real-money account.
      required:
      - id
      - role
      - name
      - email
      - mobile
      - updated_at
      properties:
        id:
          type: string
          format: uuid
        role:
          type: string
          enum:
          - representative
          - technical
          - billing
        name:
          type: string
        email:
          type: string
          format: email
        mobile:
          type:
          - string
          - 'null'
          description: In international form; null when none was given. Nothing is sent to it
        updated_at:
          type: string
          format: date-time
    OwnContacts:
      type: object
      description: The tenant's contacts, the representative first. They are set for the tenant by the
        platform's operators; ask support to change one. Where no contact holds a role, a notice for it
        goes to the address the tenant was created with.
      required:
      - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/OwnContact'
    ExpertAdvisorUpload:
      type: object
      additionalProperties: false
      description: 'One expert advisor''s source: its `.mq5` and its own includes (`.mqh`). The platform
        reads it, checks it and builds it, so what runs is what was checked. A compiled `.ex5` is refused:
        it cannot be read. The size of the whole bundle and the number of files are bounded (8 MiB and
        30 files unless an operator has changed them).'
      required:
      - name
      - files
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 64
          pattern: ^[A-Za-z0-9][A-Za-z0-9 _.-]*$
          description: What the tenant calls it. Each upload under a name is its next version
        files:
          type: array
          minItems: 1
          items:
            type: object
            additionalProperties: false
            required:
            - path
            - content_base64
            properties:
              path:
                type: string
                maxLength: 200
                description: 'Where the file sits inside the bundle, with forward slashes and no `..`:
                  `MyEa.mq5`, `Include/risk.mqh`. Exactly one file is the `.mq5`; every other file is
                  a `.mqh`. An `#include` is resolved inside the bundle or in MetaTrader''s standard library,
                  nowhere else'
              content_base64:
                type: string
                description: The file, base64. Text, in UTF-8 or in UTF-16 with a byte order mark, as
                  MetaEditor saves it
    TenantExpertAdvisor:
      type: object
      description: 'One version of the tenant''s expert advisor: where it stands, its verdict, and where
        it runs. Never the source.'
      required:
      - id
      - name
      - version
      - state
      - verdict
      - findings
      - policy_version
      - analysers
      - source_sha256
      - build_sha256
      - size_bytes
      - file_count
      - terminals
      - decision
      - source_kept_until
      - source_deleted_at
      - created_at
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        version:
          type: integer
          description: Counts the uploads under this name, from 1
        state:
          type: string
          enum:
          - uploaded
          - analysing
          - judged
          - held
          - approved
          - rejected
          - withdrawn
          - revoked
          description: 'uploaded and analysing: being checked. held: a finding needs a person, and one
            is looking. approved: it may be attached to a terminal. rejected: refused, and the report
            says why. withdrawn: the tenant deleted it. revoked: an operator took it off every terminal'
        verdict:
          oneOf:
          - $ref: '#/components/schemas/EaColour'
          - type: 'null'
          description: Null until it is judged
        findings:
          type: object
          description: How many findings of each colour, under the policy version it was judged by. All
            zero until it is judged
          required:
          - red
          - amber
          - note
          properties:
            red:
              type: integer
            amber:
              type: integer
            note:
              type: integer
        policy_version:
          type:
          - integer
          - 'null'
          description: The policy version it was judged by; null until it is judged
        trials:
          $ref: '#/components/schemas/EaTrialCount'
        analysers:
          type: array
          description: 'Each check and where it stands. One that could not run does not approve the version:
            it holds it for a person, and `failure` says which check and why, in plain words'
          items:
            type: object
            required:
            - analyser
            - state
            - finished_at
            - failure
            properties:
              analyser:
                type: string
                enum:
                - scan
                - rules
                - build
                - review
              state:
                type: string
                enum:
                - pending
                - running
                - done
                - failed
                - skipped
              finished_at:
                type:
                - string
                - 'null'
                format: date-time
              failure:
                type:
                - string
                - 'null'
        source_sha256:
          type: string
          description: 'SHA-256 of the bundle as it was uploaded: the version''s identity'
        build_sha256:
          type:
          - string
          - 'null'
          description: SHA-256 of the file the platform built from it; null until it is built
        size_bytes:
          type: integer
          description: The files of the bundle together
        file_count:
          type: integer
        uploaded_by_operator:
          type: boolean
          description: true where the platform operator uploaded it for you rather than one of your keys.
            Absent from older answers
        terminals:
          type: array
          description: The tenant's terminals this version is attached to now; empty while it is on none
          items:
            type: object
            required:
            - terminal_id
            - state
            - since
            - symbol
            - timeframe
            properties:
              terminal_id:
                type: string
                format: uuid
              state:
                type: string
                enum:
                - deploying
                - trial
                - awaiting_confirmation
                - running
              since:
                type: string
                format: date-time
              symbol:
                type: string
              timeframe:
                type: string
                description: e.g. M1
              trial:
                oneOf:
                - $ref: '#/components/schemas/EaTrial'
                - type: 'null'
                description: The trial on this terminal, with its figures and verdict once judged; null
                  while it is deploying, and absent from older answers
        last_trial:
          oneOf:
          - type: object
            required:
            - terminal_id
            - state
            - symbol
            - timeframe
            - ended_at
            - ended_reason
            - trial
            properties:
              terminal_id:
                type: string
                format: uuid
              state:
                type: string
                enum:
                - trial
                - awaiting_confirmation
                - running
                - detached
                description: Where that attachment stands now; detached once it has left the terminal
              symbol:
                type: string
              timeframe:
                type: string
                description: e.g. M1
              ended_at:
                type:
                - string
                - 'null'
                format: date-time
                description: When the attachment left the terminal; null while it is on it
              ended_reason:
                type:
                - string
                - 'null'
                enum:
                - trial_failed
                - confirmation_expired
                - revoked
                - terminal_retired
                - null
                description: Why the platform took it off the terminal; null while it is on it, and for
                  your own detach
              trial:
                $ref: '#/components/schemas/EaTrial'
          - type: 'null'
          description: 'The newest trial of this version on any of your terminals, running or ended, kept
            after the attachment has left the terminal so a failed trial can still be read: its figures,
            its verdict and, in the report (`EaReport.trial`), the rule each failed figure crossed. Null
            where it has never been on trial, and absent from older answers'
        decision:
          oneOf:
          - type: object
            required:
            - decision
            - reason
            - at
            properties:
              decision:
                type: string
                enum:
                - approve
                - reject
                - ask_change
                - revoke
              reason:
                type:
                - string
                - 'null'
                description: What the operator wrote for you
              at:
                type: string
                format: date-time
          - type: 'null'
          description: 'The last thing a person at the platform decided on this version, with the reason
            written for you; null where the checks decided by themselves. `revoke`: it was taken off every
            terminal and can be attached to none again'
        source_kept_until:
          type:
          - string
          - 'null'
          format: date-time
          description: 'A rejected or withdrawn version: when its source is deleted. Null while it is
            kept without an end'
        source_deleted_at:
          type:
          - string
          - 'null'
          format: date-time
          description: 'When its source was deleted: past its keeping time, or at once where a broker
            login or a private key was found in it. Null while it is kept. The report stays'
        created_at:
          type: string
          format: date-time
    ExpertAdvisorAttach:
      type: object
      description: 'Attach an approved version to a terminal. A governed operation of kind `attach`: the
        terminal is relaunched with the expert loaded and trading by experts off, and the operation succeeds
        when the terminal produces again, which is when the trial starts.'
      additionalProperties: false
      required:
      - expert_advisor_id
      - symbol
      - timeframe
      - reason
      properties:
        expert_advisor_id:
          type: string
          format: uuid
          description: The version; it must be `approved` and built for the MetaTrader build the terminal's
            farm runs
        symbol:
          type: string
          minLength: 1
          description: The chart's symbol, in the broker's own name; one the terminal's server lists
        timeframe:
          type: string
          enum:
          - M1
          - M5
          - M15
          - M30
          - H1
          - H4
          - D1
          - W1
          - MN1
          description: The chart's timeframe
        reason:
          type: string
          minLength: 1
          maxLength: 500
          description: Why; written to the audit log
        queue:
          type: boolean
          default: false
          description: As on TerminalRestart
        confirm_open_positions:
          type: boolean
          default: false
          description: As on TerminalRestart
    ExpertAdvisorConfirm:
      type: object
      additionalProperties: false
      required:
      - code
      properties:
        code:
          type: string
          minLength: 6
          maxLength: 64
          description: The one-time code from the trial email sent to the tenant's representative. It
            is bound to the build and the terminal and expires with the trial window plus a day
    ExpertAdvisorAttachment:
      type: object
      description: 'One terminal''s attachment of a version: what the confirmation answers'
      required:
      - terminal_id
      - expert_advisor
      - state
      - since
      - symbol
      - timeframe
      properties:
        terminal_id:
          type: string
          format: uuid
        expert_advisor:
          $ref: '#/components/schemas/Ref'
        state:
          type: string
          enum:
          - deploying
          - trial
          - awaiting_confirmation
          - running
        since:
          type: string
          format: date-time
        symbol:
          type: string
        timeframe:
          type: string
    ExpertAdvisorParametersPut:
      type: object
      description: A parameter set for the terminal's EA. Your keys go in `params`; the platform writes
        them, with `enabled` and the version it assigns, to the EA's parameter file (`MQL5/Files/mfx/params.json`),
        so they never collide with the platform's own keys.
      additionalProperties: false
      required:
      - enabled
      - params
      properties:
        enabled:
          type: boolean
          description: 'False asks your EA to stop trading (a soft pause): it is honoured by the EA, and
            the hard stop stays the platform''s'
        params:
          type: object
          additionalProperties: true
          description: Your EA's settings, any JSON object. With the platform's keys the file is at most
            256 KiB and 32 levels deep; no key anywhere may be named like a credential (password, secret,
            token, api key, private key, login)
    ExpertAdvisorParameters:
      type: object
      description: The newest parameter set for a terminal, and how far its EA has taken it up
      required:
      - terminal_id
      - version
      - enabled
      - params
      - accepted_at
      - applied_version
      - applied_seen_at
      - converged
      properties:
        terminal_id:
          type: string
          format: uuid
        version:
          type: integer
          minimum: 1
          description: Assigned by the platform; one more than the set before
        enabled:
          type: boolean
        params:
          type: object
          additionalProperties: true
        accepted_at:
          type: string
          format: date-time
        applied_version:
          type:
          - integer
          - 'null'
          description: The version your EA last said it runs, from its heartbeat line as the terminal
            reported it; null until it has said
        applied_seen_at:
          type:
          - string
          - 'null'
          format: date-time
          description: When the platform first heard that applied_version
        converged:
          type: boolean
          description: True when applied_version equals version. False past the grace window (60 s unless
            an operator changed it) raises the terminal condition EaParamsNotApplied
    TenantExpertAdvisorPage:
      type: object
      required:
      - items
      - next_cursor
      properties:
        next_cursor:
          type:
          - string
          - 'null'
          description: Opaque (created_at, id) cursor for the following page; null on the last page
        returned:
          type: integer
          description: How many items are in THIS page; never a total
        items:
          type: array
          items:
            $ref: '#/components/schemas/TenantExpertAdvisor'
    EaColour:
      type: string
      enum:
      - red
      - amber
      - green
      - grey
      description: 'A verdict''s colour. green: nothing found, or notes only. amber: needs a person. red:
        refused. grey: nothing could be judged yet. The verdict of a version is its worst finding under
        the policy version it was judged by.'
    EaRuleGroup:
      type: string
      enum:
      - security
      - threat
      - performance
      - trading
      - interface
      - contract_build
      - best_practice
    EaFinding:
      type: object
      description: One finding of a report. `evidence` is quoted from the source at the lines named; a
        finding of the AI review whose evidence is not there is dropped before the report is made. A found
        secret is masked wherever it appears.
      required:
      - rule_id
      - group
      - name
      - colour
      - found_by
      - file
      - line_from
      - line_to
      - evidence
      - why
      - change
      properties:
        rule_id:
          type: string
          description: e.g. SEC-06
        group:
          $ref: '#/components/schemas/EaRuleGroup'
        name:
          type: string
          description: The rule in an operator's words
        colour:
          type: string
          enum:
          - red
          - amber
          - note
          - grey
          description: 'Under the report''s policy version. grey: the check could not be made on this
            file'
        found_by:
          type: string
          enum:
          - rules
          - scan
          - build
          - review
          - trial
        file:
          type:
          - string
          - 'null'
          description: The file of the bundle; null for a finding of the scan or the trial
        line_from:
          type:
          - integer
          - 'null'
        line_to:
          type:
          - integer
          - 'null'
        evidence:
          type:
          - string
          - 'null'
          description: The lines quoted, or the figure measured
        why:
          type: string
          description: Why it matters, in plain words
        change:
          type:
          - string
          - 'null'
          description: What the tenant should change
    EaTrialFigure:
      type: object
      description: One thing a trial measured, with the platform's grade. Show `display` in the colour
        of `grade` and work nothing out yourself.
      required:
      - key
      - label
      - value
      - display
      - grade
      properties:
        key:
          type: string
          enum:
          - cpu_avg
          - cpu_peak
          - memory_added
          - objects_added
          - disk_written
          - orders_peak
          - heartbeat
        label:
          type: string
          description: e.g. Processor, worst minute
        value:
          type:
          - number
          - 'null'
          description: Null until the cell has reported it. While the trial runs, the figure so far
        display:
          type:
          - string
          - 'null'
          description: The value as the page shows it, e.g. "41 % of its cap" or "every time"
        grade:
          type:
          - string
          - 'null'
          enum:
          - green
          - amber
          - red
          - null
          description: Against the trial line in force when it was judged; null while there is no value,
            and while the trial runs
    EaTrialCount:
      type: object
      description: 'How this version''s trials went, shown beside its colour: a trial colours the terminal''s
        attachment, not the version, so the version says how many of its terminals'' trials failed out
        of those judged. Every attachment of the version counts, on a terminal now or ended. Absent from
        older answers'
      required:
      - failed
      - judged
      properties:
        failed:
          type: integer
          description: Trials judged amber, red or grey
        judged:
          type: integer
          description: Trials judged; one still running, or ended before it was judged, is not counted
    EaTrial:
      type: object
      description: A trial with trading off on one terminal
      required:
      - state
      - started_at
      - ended_at
      - minutes
      - verdict
      - figures
      properties:
        state:
          type: string
          enum:
          - running
          - ended
        started_at:
          type: string
          format: date-time
        ended_at:
          type:
          - string
          - 'null'
          format: date-time
        minutes:
          type: integer
          description: The trial length in force when it started
        verdict:
          oneOf:
          - $ref: '#/components/schemas/EaColour'
          - type: 'null'
          description: Null while it runs, and for a trial that ended before it was judged (you detached
            the expert during it)
        figures:
          type: array
          items:
            $ref: '#/components/schemas/EaTrialFigure'
          description: 'Always the seven, in the order of `key`''s values: the figures so far while it
            runs, the judged ones once it has ended'
    EaReport:
      type: object
      description: 'The report of one version: the same one the tenant reads through the API and receives
        by email.'
      required:
      - policy_version
      - verdict
      - categories
      - findings
      - summary
      properties:
        policy_version:
          type: integer
          description: The policy version it was judged by
        verdict:
          $ref: '#/components/schemas/EaColour'
        categories:
          type: array
          description: One entry for each rule group, in the register's order
          items:
            type: object
            required:
            - group
            - colour
            - findings
            properties:
              group:
                $ref: '#/components/schemas/EaRuleGroup'
              colour:
                $ref: '#/components/schemas/EaColour'
              findings:
                type: integer
        findings:
          type: array
          items:
            $ref: '#/components/schemas/EaFinding'
        summary:
          type:
          - string
          - 'null'
          description: The AI review's paragraph for the tenant; null where it did not run
        trial:
          oneOf:
          - $ref: '#/components/schemas/EaReportTrial'
          - type: 'null'
          description: 'The newest judged trial of this version: its verdict, what it found and its figures.
            The version''s own verdict, findings and categories stay those of its checks; a trial is judged
            on one terminal. Null until a trial has been judged, and absent from older answers'
    EaReportTrial:
      type: object
      description: One judged trial, as the report carries it
      required:
      - terminal_id
      - ended_at
      - verdict
      - findings
      - reason
      - figures
      properties:
        terminal_id:
          type: string
          format: uuid
        ended_at:
          type: string
          format: date-time
          description: When it was judged
        verdict:
          $ref: '#/components/schemas/EaColour'
        findings:
          type: array
          items:
            $ref: '#/components/schemas/EaFinding'
          description: 'One for each trial rule its figures crossed, `found_by` trial, with the figure
            measured and the line in `evidence`. Empty on a green trial, and on one that failed because
            nothing was measured or the wrong build was loaded: `reason` says which'
        reason:
          type:
          - string
          - 'null'
          description: Why it was not green, in one line; null on a green trial
        figures:
          type: array
          items:
            $ref: '#/components/schemas/EaTrialFigure'
          description: The seven, as judged
    RiskAmount:
      type: object
      description: A limit as money in the account currency, or as a percentage of the rule's reference;
        exactly one
      properties:
        amount:
          type: string
          pattern: ^-?[0-9]+(\.[0-9]+)?$
        pct:
          type: string
          pattern: ^-?[0-9]+(\.[0-9]+)?$
    RiskActionKind:
      type: string
      description: An action a rule may take, each authorised separately. close_positions needs close_scope
      enum:
      - notify
      - block_entries
      - cancel_pending
      - close_positions
    RiskActions:
      type: object
      required:
      - kinds
      properties:
        kinds:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            $ref: '#/components/schemas/RiskActionKind'
        cancel_scope:
          type: string
          enum:
          - mfx_pending
          - all_pending
          description: Which pending orders cancel_pending reaches
        close_scope:
          type: string
          enum:
          - mfx_positions
          - all_positions
          description: Which positions close_positions reaches; previewed before the version is saved
    RiskDailyLoss:
      type: object
      required:
      - limit
      - basis
      - warn_at
      - act_at
      - check_entries
      - actions
      properties:
        limit:
          $ref: '#/components/schemas/RiskAmount'
        basis:
          type: string
          enum:
          - start_balance
          - start_equity
          - higher_of_both
        warn_at:
          $ref: '#/components/schemas/RiskAmount'
        act_at:
          $ref: '#/components/schemas/RiskAmount'
        check_entries:
          type: boolean
          description: Refuse an entry whose loss at its stop would take the day past act_at (risk_daily_loss)
        actions:
          $ref: '#/components/schemas/RiskActions'
    RiskDrawdown:
      type: object
      required:
      - kind
      - limit
      - initial
      - warn_at
      - act_at
      - actions
      properties:
        kind:
          type: string
          enum:
          - static
          - trailing
        limit:
          $ref: '#/components/schemas/RiskAmount'
        initial:
          type: string
          pattern: ^-?[0-9]+(\.[0-9]+)?$
          description: 'The reference: the balance at activation, or a stated account size'
        peak_basis:
          type: string
          enum:
          - equity
          - balance
          description: trailing only
        peak_when:
          type: string
          enum:
          - intraday
          - end_of_day
          description: 'trailing only: every read, or at each reset'
        warn_at:
          $ref: '#/components/schemas/RiskAmount'
        act_at:
          $ref: '#/components/schemas/RiskAmount'
        actions:
          $ref: '#/components/schemas/RiskActions'
    RiskExposure:
      type: object
      properties:
        gross_limit:
          type: string
          pattern: ^-?[0-9]+(\.[0-9]+)?$
        per_symbol_limit:
          type: string
          pattern: ^-?[0-9]+(\.[0-9]+)?$
        include_pending:
          type: boolean
        max_positions:
          type: integer
          minimum: 0
        max_pending:
          type: integer
          minimum: 0
    RiskLossAtStops:
      type: object
      required:
      - limit
      - no_stop
      properties:
        limit:
          $ref: '#/components/schemas/RiskAmount'
        no_stop:
          type: string
          enum:
          - refuse
          - count_notional
    RiskSchedule:
      type: object
      required:
      - mode
      - zone
      - windows
      properties:
        mode:
          type: string
          enum:
          - allowed
          - blocked
        zone:
          type: string
          description: An IANA time zone, or broker for the broker's clock
        windows:
          type: array
          minItems: 1
          items:
            type: object
            required:
            - days
            - from
            - to
            properties:
              days:
                type: array
                minItems: 1
                items:
                  type: string
                  enum:
                  - mon
                  - tue
                  - wed
                  - thu
                  - fri
                  - sat
                  - sun
              from:
                type: string
                pattern: ^[0-2][0-9]:[0-5][0-9]$
              to:
                type: string
                pattern: ^[0-2][0-9]:[0-5][0-9]$
    RiskProfile:
      type: object
      description: 'A template the tenant confirmed: it filled the rules and adds its own labelled rules.
        Updating a template never changes an active version'
      required:
      - name
      - version
      - confirmed_at
      properties:
        name:
          type: string
          maxLength: 200
        version:
          type: string
          maxLength: 64
        confirmed_at:
          type: string
          format: date-time
        profit_target:
          $ref: '#/components/schemas/RiskAmount'
        min_trading_days:
          type: integer
          minimum: 0
        consistency:
          type:
          - string
          - 'null'
          maxLength: 500
          description: The tenant's own words; shown, not evaluated
        on_target:
          $ref: '#/components/schemas/RiskActions'
    RiskRules:
      type: object
      additionalProperties: false
