  /stream:
    get:
      tags:
      - stream
      operationId: openStream
      summary: WebSocket upgrade (wss://ws.mfxhub.com/v1/stream; dev wss://ws.dev.mfxhub.com/v1/stream)
        — Ed25519 signature at upgrade (mfxSignature); channels md · candles · events · results · account
        · ea · book; 24 h max lifetime; drop-oldest ticks per slow client
      description: 'Control messages are JSON: `StreamClientMessage` in, `StreamServerMessage` out. Channels
        are keyed by id (`StreamChannel`). Results and events carry a per-channel `seq` and are replayed
        on `resume` for up to 15 minutes; ticks and candles are not replayed. Account state travels on
        the terminal''s own `account:{terminal_id}` channel, not on `events`: `account.snapshot` on every
        subscribe and resume (a snapshot, never a replay), when the position set changes and every 60
        s, and `account.marks` in between. Account messages are samples: a slow client loses them before
        any event, and a `seq` gap means resume. `position.*` and `account.profile_changed` stay on `events`;
        fills stay on `results:{terminal_id}`. Market depth travels on `book:{server_id}:{symbol}` as
        `md.book`: the newest book on subscribe, then each change. While a planned maintenance window
        suspends the tenant''s market data, its `md:`, `candles:` and `book:` channels carry an `md.status`
        of `maintenance` and no data, then `live` when it ends (`MdStatusMessage`). The upgrade request
        is signed as any call is (`mfxSignature`, Ed25519): over `GET`, the path with its query and an
        empty body. Each event''s `data` is described by the schema `x-event-payloads` names for its type;
        on `events` it also carries the `type`. Close codes are listed in `x-close-codes`.'
      x-scope: per-channel (md:read for md, candles and book; exec:read or acct:read for events; exec:read
        for results; acct:read for account)
      x-close-codes:
        '4001': re-authenticate (credentials expired, rotated or revoked)
        '4008': slow consumer — the client fell too far behind and was dropped
        '4009': lifetime reached (24 h); reconnect and resume
      x-events:
      - terminal.state_changed
      - terminal.condition_changed
      - terminal.operation_changed
      - command.completed
      - command.failed
      - position.opened
      - position.modified
      - position.closed
      - position.trailing_stop_changed
      - account.snapshot
      - account.marks
      - account.profile_changed
      - md.candle_closed
      - md.book
      - md.status
      - md.subscription_degraded
      - md.subscription_recovered
      - webhook.endpoint_paused
      - webhook.endpoint_resumed
      - webhook.test
      - expert_advisor.state_changed
      - expert_advisor.attachment_changed
      - expert_advisor.telemetry
      - expert_advisor.telemetry_lost
      - symbol.spec_changed
      - symbol.status_changed
      - feed.degraded
      - feed.recovered
      - farm.state_changed
      - platform.update_pending
      - replica.failover
      x-event-payloads:
        terminal.state_changed:
          $ref: '#/components/schemas/TerminalStateChanged'
        terminal.condition_changed:
          $ref: '#/components/schemas/TerminalConditionChanged'
        terminal.operation_changed:
          $ref: '#/components/schemas/TerminalOperationChanged'
        command.completed:
          $ref: '#/components/schemas/CommandOutcome'
        command.failed:
          $ref: '#/components/schemas/CommandOutcome'
        position.opened:
          $ref: '#/components/schemas/PositionOpened'
        position.modified:
          $ref: '#/components/schemas/PositionModified'
        position.closed:
          $ref: '#/components/schemas/PositionClosed'
        position.trailing_stop_changed:
          $ref: '#/components/schemas/PositionTrailingStopChanged'
        account.snapshot:
          $ref: '#/components/schemas/AccountSnapshotMessage'
        account.marks:
          $ref: '#/components/schemas/AccountMarksMessage'
        account.profile_changed:
          $ref: '#/components/schemas/AccountProfileChanged'
        md.book:
          $ref: '#/components/schemas/BookMessage'
        md.status:
          $ref: '#/components/schemas/MdStatusMessage'
        md.subscription_degraded:
          $ref: '#/components/schemas/MdSubscriptionDegraded'
        md.subscription_recovered:
          $ref: '#/components/schemas/MdSubscriptionRecovered'
        webhook.endpoint_paused:
          $ref: '#/components/schemas/WebhookEndpointPaused'
        webhook.endpoint_resumed:
          $ref: '#/components/schemas/WebhookEndpointResumed'
        webhook.test:
          $ref: '#/components/schemas/WebhookTest'
        expert_advisor.state_changed:
          $ref: '#/components/schemas/ExpertAdvisorStateChanged'
        expert_advisor.attachment_changed:
          $ref: '#/components/schemas/ExpertAdvisorAttachmentChanged'
        expert_advisor.telemetry:
          $ref: '#/components/schemas/EaTelemetryMessage'
        expert_advisor.telemetry_lost:
          $ref: '#/components/schemas/EaTelemetryLostMessage'
        symbol.spec_changed:
          $ref: '#/components/schemas/SymbolSpecChanged'
      responses:
        '101':
          description: switching protocols
        '429':
          description: over WS connection quota
          headers:
            Retry-After:
              $ref: '#/components/headers/RetryAfter'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        default:
          $ref: '#/components/responses/Error'
  /webhooks:
    get:
      tags:
      - webhooks
      operationId: listWebhooks
      summary: The tenant's webhook endpoints, each with how it is doing
      x-scope: hook:read
      responses:
        '200':
          description: endpoints
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookEndpointList'
        default:
          $ref: '#/components/responses/Error'
    post:
      tags:
      - webhooks
      operationId: createWebhook
      summary: Register an endpoint; its signing secret is in this answer and in no other
      x-scope: hook:write
      parameters:
      - $ref: '#/components/parameters/idempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WebhookEndpointCreate'
      responses:
        '201':
          description: the endpoint and its secret
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookEndpointCreated'
        '409':
          description: quota_exceeded - webhooks.endpoints_per_tenant reached
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: validation_error - not https on 443 or 8443, an address and not a name, credentials
