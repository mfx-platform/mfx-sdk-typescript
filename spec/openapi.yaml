# The public MFX Hub API: the tenant routes, without the platform's internal annotations.
openapi: 3.1.0
info:
  title: MFX API
  version: 1.0.0-beta.1
  summary: MT5-terminal-fleet-as-a-service — tenant-aware market data, account intelligence and execution
  description: |
    Base URL `https://api.mfxhub.com/v1` (development: `https://api.dev.mfxhub.com/v1`).
    Auth: `X-MFX-Key`, `X-MFX-Timestamp`, `X-MFX-Nonce`, `X-MFX-Signature` — an Ed25519 signature
    over `timestamp\nnonce\nMETHOD\npath_with_query\nsha256_hex(body)`.
    The nonce is under the signature, so a captured request cannot be replayed under a fresh one.
    Every write requires `Idempotency-Key`. Lists are cursor-paginated (`cursor`, `limit ≤ 200`).
    **Decimals.** Every price, volume and money figure is a
    decimal string, in both directions. On the way out a price carries exactly its symbol's `digits`, a
    money figure exactly the account currency's `currency_digits` (`Account.profile`), and a volume the
    decimals of its symbol's `volume_step`; a broker's own trailing float noise is never passed on. On the
    way in one rule covers every price and volume field: a value within 1e-6 of a multiple of the
    symbol's increment (its tick size for a price, its `volume_step` for a volume) is put exactly onto
    that multiple, and a value further off is sent as given, for the broker to accept or refuse.
    Every response carries `X-MFX-Budget-Remaining` and `X-MFX-Budget-Source`;
    429 carries `Retry-After`.
    **MFX Hub never answers 502 or 504 itself.** A failure upstream of the platform - the
    tenant's own terminal or cell that did not answer or could not do what was asked, or a service
    the platform calls that refused - is **503 `upstream_error`** with `details.reason` where there is
    one. Branch on `error.code`, not on the status: 503 is also `dependency_unavailable`, which
    carries `Retry-After`. A 502 or 504 a client does receive is the edge's own, with no error body,
    and means MFX Hub could not be reached.
    Execution endpoints return 202 with a `command_id`; results arrive on `WSS /v1/stream` and `GET /v1/commands/{id}`.
  x-sdk-min-version: 0.1.0
servers:
- url: https://api.mfxhub.com/v1
  description: production
- url: https://api.dev.mfxhub.com/v1
  description: development
tags:
- name: terminals
  description: Provision, inspect, drain and retire terminals (scope term:read / term:write)
- name: credentials
  description: Submit or rotate broker credentials. They are stored securely and the response carries
    a reference, never the secret (term:write)
- name: execution
  description: Orders and positions — signed, idempotent, per-terminal FIFO (exec:write / exec:read)
- name: account
  description: Live account state, positions, orders, deal history, the user's own spread (acct:read)
- name: md
  description: Broker catalogue, servers, symbols with trade_mode, streaming subscriptions, candles (md:read
    / md:write)
- name: farms
  description: Tenant-visible, read-only view of the tenant's farms (term:read)
- name: expert advisors
  description: 'A tenant''s own expert advisors: upload the source, read the verdict and the report, withdraw
    (ea:read / ea:write). Only for a tenant with a farm that runs customer code'
- name: usage
  description: Quota consumption and remaining budget (billing:read)
- name: stream
  description: Multiplexed WebSocket stream — md, candles, events, results
- name: webhooks
  description: MFX Hub calls the tenant's own HTTPS address for the events it asks for, signed, tried
    again when it fails, and kept when it keeps failing (hook:read / hook:write)
- name: maintenance
  description: 'Planned maintenance on the tenant''s terminals: what is scheduled and in progress, what
    is paused and until when, and where each terminal is (term:read)'
- name: connectors
  description: Tenant-owned Redis push delivery — reserved in v1, not yet available (md:write)
