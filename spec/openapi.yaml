      operationId: listMaintenance
      summary: Planned maintenance on your terminals - windows scheduled, in progress and recently ended
      description: 'A window in progress is listed to every tenant in its scope; a scheduled one once
        it has been announced to you. `suspended` is what the API refuses you while it is in progress,
        with 403 `maintenance` and `details.ends_at`; `console` is what your console shows. Answered under
        every suspension, including a console made unavailable. Unfiltered: scheduled and in progress,
        soonest first.'
      x-scope: term:read
