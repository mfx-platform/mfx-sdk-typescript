  /terminals/{id}/history/deals:
    parameters:
    - $ref: '#/components/parameters/terminalId'
    - name: from
      in: query
      required: true
      description: A UTC instant; the broker's own clock is applied on the way to MT5
      schema:
        type: string
        format: date-time
    - name: to
      in: query
      required: true
      description: A UTC instant, as from
      schema:
        type: string
        format: date-time
    - name: position
      in: query
      required: false
      schema:
        type: integer
        format: int64
        minimum: 1
      description: 'Only the deals of this position (Deal.position): its opening deal, any partial closes
        and its closing deal, inside from/to. A position open longer than 31 days is read window by window'
    - $ref: '#/components/parameters/cursor'
    - $ref: '#/components/parameters/limit'
    get:
      tags:
      - account
      operationId: listDeals
      summary: Deals in a window, newest first by (time, deal), optionally of one position
      description: 'Read from the broker on demand with a read-only request through the terminal, bounded
        at 10 s. Nothing is stored: the broker is the book of record for history. `to - from` is at most
        31 days; `next_cursor` continues the window before the oldest deal returned. With `position`,
        only that position''s deals are returned: the window is still read from the broker and the other
        deals are left out, so a page can hold fewer than `limit`, and even none, while `next_cursor`
        is not null. Keep asking until it is null. Every time is UTC: MT5 stamps deals on the broker server''s
        own clock (UTC+2 or UTC+3 on many servers, moving with daylight saving), and the platform converts
        each deal, and the window, with that server''s measured clock. When no clock has been measured
        for the server yet the read is refused rather than guessed (503 `broker_clock_unknown`); it answers
        once a terminal on the server has received a price.'
      x-scope: acct:read
      responses:
        '200':
          description: a page of deals
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DealPage'
        '422':
          description: window_too_wide - more than 31 days, or from after to
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: 'upstream_error - terminal_timeout (no answer within 10 s), deals_unreadable, or
            broker_clock_unknown (no clock measured for the server yet: retry once a terminal on it has
            a price)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        default:
          $ref: '#/components/responses/Error'
  /terminals/{id}/spread:
    parameters:
    - $ref: '#/components/parameters/terminalId'
    get:
      tags:
      - account
      operationId: getSpread
      summary: The user's own spread per instrument, read from the user's terminal (a shared feed cannot
        serve it)
      description: 'The last tick of every instrument this terminal streams, as the tenant''s own terminals
        on this server reported it. Nothing is sent to the cell, and a tick report arrives about once
        a minute, so read `age_s`: for a price now, read the symbol''s quote or subscribe to `md`. An
        instrument with no tick yet is left out, so the list can be shorter than the terminal''s instruments
        and is empty for a terminal that streams none. Only an ACTIVE terminal answers: any other state
        is 409 `state_error` with `details.state`.'
      x-scope: acct:read
      responses:
        '200':
          description: The spread per instrument, each with the age of the tick it came from
          headers:
            X-MFX-Budget-Remaining:
              $ref: '#/components/headers/BudgetRemaining'
            X-MFX-Budget-Source:
              $ref: '#/components/headers/BudgetSource'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SpreadList'
        '409':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
