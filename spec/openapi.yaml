        ≠ tradeable), pip_value_per_lot, spec_hash, trade sessions and derived status
      description: 'Read from the tenant''s own terminals on that server. MFX holds no broker accounts
        and never shares one tenant''s catalogue with another. A server and account type where your terminals
        reported a catalogue and none runs any more is answered from the last report, with `source: last_known`
