  /expert-advisors:
    post:
      tags:
      - expert advisors
      operationId: uploadExpertAdvisor
      summary: Upload an expert advisor's source to be checked
      description: 'Stores the bundle where no cell can reach it and starts the checks; the answer is
        the new version in state `uploaded`. Read the version until `verdict` is set, then the report.
        The same bundle uploaded again answers the version it already made (200) and nothing is checked
        twice, unless the tenant withdrew that version. For an approved version it also starts a build
        for each MetaTrader build of the tenant''s customer-code farms that the version has no build for
        and none running (a farm moved to a newer MetaTrader, or such a build failed); an attach''s 409
        `build_mismatch` says where it stands. Refused with 409 `conflict` and `details.why`: `no_customer_code_farm`
        (the tenant has no farm that runs customer code) or `uploads_off` (an operator has switched uploads
        off). A tenant already keeping as many versions as it may is 409 `quota_exceeded` with `details
        {quota, in_use}`: withdraw one.'
      x-scope: ea:write
      parameters:
      - $ref: '#/components/parameters/idempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExpertAdvisorUpload'
      responses:
        '202':
          description: accepted, state uploaded; the checks have started
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantExpertAdvisor'
        '200':
          description: this bundle was uploaded before; the version it made, as it stands now
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantExpertAdvisor'
        '422':
          description: 'validation_error, with `details.why`: `compiled_file` (an `.ex5`), `not_source`
            (a file that is neither `.mq5` nor `.mqh`), `entry_file` (not exactly one `.mq5`), `bad_path`,
            `duplicate_path`, `bad_base64`, `not_text`, `empty_file`, `too_many_files` (`details.max`)
            or `too_large` (`details.max_mib`). `details.path` names the file where one file is at fault.
            Nothing is stored'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: conflict or quota_exceeded, as described above
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        default:
          $ref: '#/components/responses/Error'
    get:
      tags:
      - expert advisors
      operationId: listExpertAdvisors
      summary: List the tenant's expert advisor versions, newest first (cursor pagination)
      x-scope: ea:read
      parameters:
      - $ref: '#/components/parameters/cursor'
      - $ref: '#/components/parameters/limit'
      responses:
        '200':
          description: a page of versions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantExpertAdvisorPage'
        default:
          $ref: '#/components/responses/Error'
  /expert-advisors/{id}:
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    get:
      tags:
      - expert advisors
      operationId: getExpertAdvisor
      summary: One version - its state, its verdict, each check and where it runs
      x-scope: ea:read
      responses:
        '200':
          description: the version; another tenant's id is 404, never 403
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantExpertAdvisor'
        default:
          $ref: '#/components/responses/Error'
    delete:
      tags:
      - expert advisors
      operationId: withdrawExpertAdvisor
      summary: Withdraw a version
      description: 'The version becomes `withdrawn` and can no longer be attached; a check still running
        on it stops. Its source is deleted after the keeping time (`source_kept_until`); the report stays.
        Withdrawing a withdrawn version answers it again. Refused while a terminal carries it: detach
        it first.'
      x-scope: ea:write
      parameters:
      - $ref: '#/components/parameters/idempotencyKey'
      responses:
        '200':
          description: the version, withdrawn
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantExpertAdvisor'
        '409':
          description: state_error - a terminal carries it (`details.terminals`), or an operator revoked
            it
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        default:
          $ref: '#/components/responses/Error'
  /expert-advisors/{id}/report:
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    get:
      tags:
      - expert advisors
      operationId: getExpertAdvisorReport
      summary: The report of one version - the verdict, one colour for each group of rules, every finding
        with its lines and what to change
      description: The same report an operator reads and the tenant's representative is emailed. A found
        secret is masked wherever it appears, and no source is in it beyond the lines a finding quotes.
      x-scope: ea:read
      responses:
        '200':
          description: the report
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EaReport'
        '409':
          description: state_error - it is not judged yet (`details.state`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        default:
          $ref: '#/components/responses/Error'
  /tenant/contacts:
    get:
