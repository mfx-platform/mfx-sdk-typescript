              schema:
                $ref: '#/components/schemas/CopyFollower'
        '409':
          description: conflict - already_following; state_error - the leader is retired; quota_exceeded
            - plan_limit (details.limit)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: unprocessable - not_on_this_venue (details.options), follows_itself, not_admitted,
            needs_leader_account, account_not_usable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        default:
          $ref: '#/components/responses/Error'
  /copy/followers/preview:
