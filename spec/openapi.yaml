        copy.copied:
          $ref: '#/components/schemas/CopyCopied'
        copy.refused:
          $ref: '#/components/schemas/CopyRefused'
        copy.stopout:
          $ref: '#/components/schemas/CopyStopoutEvent'
        copy.drift:
          $ref: '#/components/schemas/CopyDrift'
        copy.state_changed:
          $ref: '#/components/schemas/CopyStateChanged'
      responses:
        '101':
          description: switching protocols
        '429':
          description: 'Over the tenant''s connection ceiling or the key''s cap (`ws_conns`, `details.scope`).
            Not sent as an HTTP status: the upgrade succeeds, one `error` op with `rate_limited` follows,
            and the connection closes with 4029.'
          headers:
            Retry-After:
              $ref: '#/components/headers/RetryAfter'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        default:
          $ref: '#/components/responses/Error'
