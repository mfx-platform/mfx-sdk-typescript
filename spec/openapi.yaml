      description: Tri-state on purpose. `unknown` is what an unreachable agent produces, and collapsing
        it into `failed` invents an outage while collapsing it into `ok` hides one.
      enum:
      - ok
      - failed
      - unknown
    TerminalRestart:
      type: object
      additionalProperties: false
      required:
      - reason
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 500
          description: Why; written to the audit log and sent to the cell
        queue:
          type: boolean
          default: false
          description: 'When the ask is valid and refused only because the platform is busy (rule 2 cooldown,
            4 tenant rate, 5 tenant concurrency, 6 farm capacity), hold it and start it when it can, instead
            of answering 429. The answer is then 202 with `state: QUEUED` and where it waits. Without
            it the 429 stays, as before. A hold that could not end before the queue''s deadline is refused
            at once either way'
        confirm_open_positions:
          type: boolean
          default: false
          description: 'Rule 3: required true when the terminal has open positions, or while the platform
            cannot yet tell (until the account''s first snapshot has arrived), and only while the platform''s
            open-position confirmation setting is on (it is off unless an operator turns it on). Off,
            it is not needed'
    TerminalDrain:
      type: object
      additionalProperties: false
      description: A drain. The body is optional; omitted, the reason is recorded as not given
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 500
          description: Why; written to the audit log and the terminal's history
        confirm_open_positions:
          type: boolean
          default: false
          description: 'Rule 3, as on TerminalRestart: required true when the terminal has open positions,
            or while the platform cannot tell, and only while the platform''s open-position confirmation
            setting is on. Positions stay open at the broker while the terminal is drained'
    OperationAccepted:
      type: object
      required:
      - operation_id
      - state
      properties:
        operation_id:
          type: string
          format: uuid
        state:
          type: string
          enum:
          - QUEUED
          - ACCEPTED
          - CLOSING
          - FORCED_STOP
          - RELAUNCHING
          - SUCCEEDED
          - FAILED
          - NOT_STARTED
          - EXPIRED
          - CANCELLED
          - SUPERSEDED
          description: 'QUEUED when the ask was valid and only busy: held, and started by the platform
            when it can. An operator''s asks always queue; a tenant''s only with `queue: true`'
        queue:
          oneOf:
          - $ref: '#/components/schemas/OperationQueue'
          - type: 'null'
          description: Where it waits, while QUEUED; null otherwise
        duplicate:
          type: boolean
          description: True when this Idempotency-Key was seen before, or when the terminal already had
            the same kind of operation waiting (a stronger kind replaces a waiting one, as described on
            restartTerminal); the original operation is returned
    TerminalOperation:
      type: object
      description: A governed lifecycle operation; done only when the terminal produces ticks again
      required:
      - operation_id
      - kind
      - terminal_id
      - state
      - requested_by
      - reason
      - forced_stop
      - step
      - timeline
      - cooldown_until
      - created_at
      - finished_at
      properties:
        operation_id:
          type: string
          format: uuid
        kind:
          type: string
          enum:
          - restart
          - rebuild
          - move
          - retire
          - retry_login
          - attach
          - detach
          - drain
        terminal_id:
          type: string
          format: uuid
        state:
          type: string
          enum:
          - QUEUED
          - ACCEPTED
          - CLOSING
          - FORCED_STOP
          - RELAUNCHING
          - SUCCEEDED
          - FAILED
          - NOT_STARTED
          - EXPIRED
          - CANCELLED
          - SUPERSEDED
          description: 'QUEUED is a state of the operation, never of the terminal: the terminal''s own
            state and its lifecycle record are untouched while the operation waits. A queued operation
            ends by starting (ACCEPTED, then as before) or in one of four ways in which nothing ran: NOT_STARTED
            (its turn came and the guard, run again on the terminal as it was then, refused it; `step`
            carries the refusal''s code), EXPIRED (still waiting at `queue.expires_at`; it is never run
            late), CANCELLED, or SUPERSEDED (a stronger ask took its place; `superseded_by`).'
        queue:
          oneOf:
          - $ref: '#/components/schemas/OperationQueue'
          - type: 'null'
          description: Where it waits, while QUEUED. Kept as it last stood, with a null `position`, once
            it has left the line; null for an operation that never waited
        superseded_by:
          type:
          - string
          - 'null'
          format: uuid
          description: The operation that replaced this one; set only on SUPERSEDED
        requested_by:
          type: string
          description: key:<key id>, admin.<email> for an operator, or system.healing for an automatic
            recovery step
        reason:
          type: string
        forced_stop:
          type:
          - boolean
          - 'null'
          description: True when the terminal would not close and its job was stopped; null until the
            cell says
        step:
          type:
          - string
          - 'null'
          description: The last step the cell reached; on FAILED, what failed (e.g. shutdown_timeout,
            deadline, cooldown)
        timeline:
          type: array
          items:
            type: object
            required:
            - at
            - state
            properties:
              at:
                type: string
                format: date-time
              state:
                type: string
        cooldown_until:
          type:
          - string
          - 'null'
          format: date-time
          description: When the next restart of this terminal is allowed (rule 2)
        created_at:
          type: string
          format: date-time
        finished_at:
          type:
          - string
          - 'null'
          format: date-time
    OperationQueue:
      type: object
      description: Where a QUEUED operation waits. It waits in a line, behind other operations, or on
        a clock. Order in a line is class first (automatic recovery, then operator, then tenant), then
        who asked first.
      required:
      - held_by
      - class
      - position
      - starts_after
      - queued_at
      - expires_at
      properties:
        held_by:
          type: string
          enum:
          - farm_capacity
          - tenant_concurrency
          - cooldown
          - tenant_rate
          description: 'The rule that holds it. farm_capacity (rule 6) and tenant_concurrency (rule 5)
            are lines: it starts when one of the farm''s, or the tenant''s, operations settles. cooldown
            (rule 2) and tenant_rate (rule 4) are clocks: it starts at `starts_after`'
        class:
          type: string
          enum:
          - healing
          - operator
          - tenant
          description: Whose ask it is; it sets the order in a line
        position:
          type:
          - integer
          - 'null'
          minimum: 1
          description: 'Its place in line: 1 is next, 2 has one ahead of it. It is a place, not how many
            wait. Null when held by a clock, and once it has left the line'
        starts_after:
          type:
          - string
          - 'null'
          format: date-time
          description: When a clock hold ends. Null for a line
        queued_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
          description: Not started by then, it settles EXPIRED and is never run late. queued_at plus the
            longest wait, 900 s unless an operator has changed it
    TerminalCreate:
      type: object
      additionalProperties: false
      required:
      - broker_id
      - server_id
      properties:
        farm_id:
          type: string
          format: uuid
          description: 'Optional. Omitted, the platform chooses: your own ACTIVE farms first, then shared
            ones (GET /farms lists both), offering the usages this terminal needs, in the server''s region,
            with room; the oldest wins a tie. The choice is on the answer as `farm`. None fits is 409
            no_farm'
        broker_id:
          type: string
          format: uuid
        server_id:
          type: string
          format: uuid
          description: Must belong to broker_id; an unsupported server is 422
        streaming:
          type: boolean
          default: false
          description: Publishes quotes (usage quote_streaming)
        execution:
          type: boolean
          default: false
          description: Accepts orders; needs a master credential
        instruments:
          type: array
          items:
            type: string
          maxItems: 100
          description: Symbols to watch, in the broker's own names (e.g. EURUSD.sd). The farm's OS caps
            the count.
        labels:
          type: object
          additionalProperties:
            type: string
          description: Free-form, the tenant's own
        redundancy:
          type: string
          enum:
          - none
          - active_passive
          - active_active
          default: none
        refresh_ms:
          type: integer
          enum:
          - 5000
          - 4000
          - 3000
          - 2000
          - 1000
          - 500
          - 250
          - 200
          description: 'The terminal''s refresh rate in milliseconds: how often it sweeps prices and,
            while positions are open, reads the account. Omitted, the farm''s rate applies. Faster than
            the farm''s rate is 422 with details.allowed. With no farm named, only farms that allow the
            rate are considered, and none with room is 409 no_farm (why no_room). A flat account is read
            every 60 s whatever this says'
    TerminalUpdate:
      type: object
      additionalProperties: false
      description: What a tenant may change on a running terminal. Send only the fields to change
      minProperties: 1
      properties:
        refresh_ms:
          type: integer
          enum:
          - 5000
          - 4000
          - 3000
          - 2000
          - 1000
          - 500
          - 250
          - 200
          description: As on TerminalCreate. Applied by the cell within a minute, without a restart
    TerminalInstruments:
      type: object
      additionalProperties: false
      description: 'The whole list, replacing the one the terminal has. Not a patch: send every instrument
        the terminal should watch. An empty list is allowed (an execution-only terminal watches nothing).'
      required:
      - instruments
      properties:
        instruments:
          type: array
          items:
            type: string
            minLength: 1
          maxItems: 100
          uniqueItems: true
          description: In the broker's own names (e.g. EURUSD.sd). The farm's OS caps the count.
        depth_instruments:
          type: array
          items:
            type: string
            minLength: 1
          maxItems: 20
          uniqueItems: true
          description: 'The symbols of `instruments` whose market depth (order book) this terminal reads
            and streams on `book:{server_id}:{symbol}`. The whole list, like `instruments`; `[]` stops
            depth. Omitted, the terminal keeps the depth symbols it has that are still in `instruments`,
            so an instrument removed is also no longer read for depth. At most the lesser of the farm''s
            `depth_max` and the platform''s per-terminal cap (422 `unprocessable`, details `{depth_instruments,
            max}`); a farm whose `depth_max` is 0 refuses any (422 `depth_not_offered`); a symbol that
            is not in `instruments` is 422 `unprocessable` (details `{not_instruments}`). Many brokers
            publish no depth for most FX symbols: asking for it costs nothing then, and the channel carries
            nothing.'
    TenantTerminal:
      type: object
      required:
      - id
      - farm
      - broker
      - server
      - streaming
      - execution
      - state
      - instruments
      - created_at
      properties:
        id:
          type: string
          format: uuid
        same_login_terminals:
          type:
          - integer
          - 'null'
          description: 'How many of YOUR live terminals use this terminal''s broker login, this one included.
            They share the account at the broker: each sees the same balance, positions and history. Another
            tenant''s use of the same login is never counted or shown here. Null until the terminal has
            a credential.'
        farm:
          $ref: '#/components/schemas/Ref'
        broker:
          $ref: '#/components/schemas/Ref'
        server:
          $ref: '#/components/schemas/Ref'
        login_masked:
          type:
          - string
          - 'null'
          description: e.g. ****3456; null until a credential is submitted
        streaming:
          type: boolean
        execution:
          type: boolean
        state:
          type: string
          enum:
          - REQUESTED
          - PROVISIONING
          - LOGGING_IN
          - ACTIVE
          - OFFLINE
          - PARKED
          - DRAINING
          - DRAINED
          - RETIRED
          - FAILED
          description: 'As `Terminal.state`. OFFLINE: its cell cannot run it (`offline_reason` says why);
            it comes back by itself, or is moved after 15 minutes. DRAINED: you drained it; stopped and
            not billed, keeping its id, account and settings until you resume or retire it. PARKED: your
            account is suspended and its grace period ended; the terminal is stopped and keeps its settings,
            its place and its login. It returns to LOGGING_IN by itself when your account is reinstated,
            or goes to DRAINING when it is retired.'
        offline_reason:
          type:
          - string
          - 'null'
          enum:
          - power_off
          - vm_missing
          - no_heartbeat
          - null
          description: Why an OFFLINE terminal is offline; null in every other state
        state_since:
          type:
          - string
          - 'null'
          format: date-time
          description: When it entered this state (its creation when it has not moved)
        state_expected_s:
          type:
          - integer
          - 'null'
          description: How long this state usually takes; null for a settled state
        conditions:
          type: object
          description: ProcessRunning, BrokerConnected, TicksFresh, TradeAllowed, CredentialLeased — each
            {status, reason, since, attributed_to}; absent means not yet observed
          additionalProperties:
            type: object
            properties:
              status:
                type: string
                enum:
                - ok
                - failed
                - unknown
              reason:
                type:
                - string
                - 'null'
                description: Why, when it is not ok. TicksFresh failed with slow_feed or broker_quiet
                  is your broker's feed, timed against its own usual pace
              since:
                type:
                - string
                - 'null'
                format: date-time
              attributed_to:
                type:
                - string
                - 'null'
                enum:
                - broker
                - null
                description: '`broker` when the terminal is running, logged in and answering and what
                  is wrong is the broker''s own feed (TicksFresh failed with slow_feed or broker_quiet):
                  the broker''s, not MFX Hub''s. Null otherwise (not attributed). `terminal.condition_changed`
                  carries the same field, and is sent again when a slow feed becomes a quiet broker or
                  the reverse.'
        instruments:
          type: array
          items:
            type: string
        depth_instruments:
          type: array
          items:
            type: string
          description: The symbols whose market depth this terminal reads; empty when none. Set with PUT
            /terminals/{id}/instruments
        labels:
          type: object
          additionalProperties:
            type: string
        redundancy:
          type: string
          enum:
          - none
          - active_passive
          - active_active
        replica_role:
          type:
          - string
          - 'null'
          enum:
          - writer
          - standby
          - null
        terminal_build:
          type:
          - integer
          - 'null'
        last_tick_at:
          type:
          - string
          - 'null'
          format: date-time
        refresh_ms:
          type: integer
          enum:
          - 5000
          - 4000
          - 3000
          - 2000
          - 1000
          - 500
          - 250
          - 200
          description: The refresh rate this terminal runs at
        created_at:
          type: string
          format: date-time
    TenantTerminalPage:
      type: object
      required:
      - items
      - next_cursor
      properties:
        next_cursor:
          type:
          - string
          - 'null'
          description: Opaque (created_at, id) cursor for the following page; null on the last page
        returned:
          type: integer
          description: How many items are in THIS page; never a total
        items:
          type: array
          items:
            $ref: '#/components/schemas/TenantTerminal'
    CommandAccepted:
      type: object
      description: 'The answer to an accepted command: `{command_id, state, duplicate}`'
      required:
      - command_id
      - state
      - duplicate
      properties:
        command_id:
          type: string
          format: uuid
        state:
          $ref: '#/components/schemas/CommandState'
        duplicate:
          type: boolean
          description: True when this Idempotency-Key was seen before; the original command is returned,
            never re-executed
        expires_at:
          type: string
          format: date-time
          description: 'After this the command is EXPIRED and never executes: a cell refuses an envelope
            past it, and a command still on the platform is swept EXPIRED. It is the command''s deadline
            to reach the broker, not a pending order''s own `expires_at`. Set from the moment the command
            is accepted, by kind: 10 s for every execution kind (order_place, order_cancel, order_modify,
            position_modify, position_close, position_close_partial, position_close_by, trailing_stop_set,
            trailing_stop_clear); an order_place may ask for 1 s to 60 s instead with `expires_in_ms`'
    OrderPlace:
      type: object
      description: 'Place an order. Refused before it reaches the broker — never rounded or trimmed: a
        volume off the symbol''s step, a comment MT5 would truncate, a pending order with no price. Every
        decimal here is a **string**, exactly as every decimal the API returns already is, because a float
        price is a wrong price in either direction: a computed size is the ordinary path for a strategy,
        and `0.07 * 3` is `0.21000000000000002` as a JSON number. Send what `Decimal` gives you. The one
        thing the platform changes is binary float noise that arrives anyway — a decimal within 1e-6 of
        a multiple of the symbol''s own increment, its `volume_step` for a volume or its tick size for
        a price, is put exactly onto that multiple. A value further off than that is what you asked for
        and is sent unchanged: the platform never moves a price you chose. **When the command is SUCCEEDED.**
        The outcome is the broker''s answer to the one `order_send`, never a later event. A market order
        is SUCCEEDED when the broker reports the deal: `mt5_retcode` 10009 (TRADE_RETCODE_DONE) or 10010
        (DONE_PARTIAL); `tickets.order`, `tickets.deal` and `tickets.position` are set and `exec_price`
        and `exec_volume` are the fill (a broker on exchange execution that answers a market order 10008
        instead gives the same SUCCEEDED with `tickets.deal` null). A pending order (limit, stop, stop_limit)
        is SUCCEEDED when the broker accepts it onto its book: `mt5_retcode` 10008 (TRADE_RETCODE_PLACED),
        `retcode_text` placed. Then `tickets.order` is the pending order''s ticket - the one to cancel
        or amend it by - and `tickets.deal` and `tickets.position` are null, because nothing has filled;
        `exec_price` is null, and `exec_volume`, when present, is the order''s volume as the broker echoed
        it, not a fill. A placement interrupted and then reconciled from the terminal''s order history
        reads the same (10008, `tickets.order` set). **The fill of a pending order is not a command outcome**:
        no second `command.completed` is sent. When the order triggers and fills, it leaves the pending
        orders (`GET /terminals/{id}/orders/pending` and the `pending` of `account.snapshot`), a deal
        whose `order` is that ticket appears in `GET /terminals/{id}/history/deals`, and the position
        arrives as `position.opened` on `events` (`position.modified` when a netting account adds it to
        a position already open). Match a fill to its order by the deal''s `order`: MT5 usually gives
        the position the order''s ticket, but not always. An order that lapses at its `expires_at` or
        is cancelled leaves the pending orders with no deal.'
      additionalProperties: false
      required:
      - symbol
      - side
      - volume
      properties:
        symbol:
          type: string
          description: The broker's own name, e.g. EURUSD.sd
        side:
          type: string
          enum:
          - buy
          - sell
        order_type:
          type: string
          enum:
          - market
          - limit
          - stop
          - stop_limit
          default: market
          description: A `stop_limit` order waits for the market to reach `price` and then places a limit
            order at `stop_limit_price`
        volume:
          type: string
          pattern: ^(0|[1-9][0-9]*)(\.[0-9]+)?$
          description: 'Lots, as a decimal string: above zero, inside the symbol''s volume_min..volume_max
            and on its volume_step. A string because a computed size is the ordinary path and 0.07 * 3
            is 0.21000000000000002 as a JSON number. Float noise that does arrive is snapped onto the
            step; a volume genuinely off it is refused'
        price:
          type: string
          pattern: ^(0|[1-9][0-9]*)(\.[0-9]+)?$
          description: 'Decimal string above zero. Required for limit, stop and stop_limit (where it is
            the stop price: where the order wakes up); ignored for market (the current bid/ask is used).
            Float noise is snapped onto the symbol''s tick; a price deliberately finer than the tick is
            sent as given, for the broker to accept or refuse'
        stop_limit_price:
          type: string
          pattern: ^(0|[1-9][0-9]*)(\.[0-9]+)?$
          description: 'stop_limit only, and required with it: the price of the limit order placed when
            the market reaches `price`. A decimal string above zero. Refused with any other order_type'
        sl:
          type: string
          pattern: ^(0|[1-9][0-9]*)(\.[0-9]+)?$
          description: Stop loss price as a decimal string; "0" or absent means none
        tp:
          type: string
          pattern: ^(0|[1-9][0-9]*)(\.[0-9]+)?$
          description: Take profit price as a decimal string; "0" or absent means none
        deviation_points:
          type: integer
          minimum: 0
          default: 20
          description: Slippage allowed on a market order
        expires_at:
          type: string
          format: date-time
          description: 'Pending orders only: when the order lapses at the broker if it has not filled;
            absent means good till cancelled. Not the command''s own deadline, which is `expires_in_ms`'
        expires_in_ms:
          type: integer
          minimum: 1000
          maximum: 60000
          description: 'How long the command may take to reach the broker, from the moment it is accepted:
            the response''s `expires_at` is then that much later. Absent is 10 s, as for every execution
            command. Past it the command is EXPIRED and the order is never sent; it is not how long a
            pending order stays on the book (that is `expires_at`). Outside 1000 to 60000 is refused with
            400 validation_error, `details` naming the bounds. A replay under the same Idempotency-Key
            must send the same value (a different one is 409 conflict)'
        magic:
          type: integer
          minimum: 0
          default: 0
        comment:
          type: string
          maxLength: 31
          description: MT5 cuts anything longer without saying so, so longer is refused
    OrderModify:
      type: object
      description: 'Amend an order that is still pending: a limit or a stop the broker has not filled.
        Send only what changes; a field that is absent keeps the order''s present value, so amending the
        price does not touch its stops. The ticket in the path is the order''s. An order that is no longer
        pending - filled, cancelled, expired, or never on this account - is refused before the broker
        with `invalid_request`; a filled order is a position, and its stops are amended with modifyPosition.
        Every decimal is a string and is treated as on OrderPlace: float noise is snapped onto the symbol''s
        tick, and a price deliberately finer than the tick is sent as given, for the broker to accept
        or refuse. The order''s volume, side, type and symbol cannot be amended: cancel the order and
        place another.'
      additionalProperties: false
      minProperties: 1
      properties:
        price:
          type: string
          pattern: ^(0|[1-9][0-9]*)(\.[0-9]+)?$
          description: The order's new price, a decimal string above zero. On a stop-limit order it is
            the stop price
        stop_limit_price:
          type: string
          pattern: ^(0|[1-9][0-9]*)(\.[0-9]+)?$
          description: 'A stop-limit order''s second price: the limit order placed when the market reaches
            `price`. On an order that is not a stop-limit it is refused with `invalid_request`'
        sl:
          type: string
          pattern: ^(0|[1-9][0-9]*)(\.[0-9]+)?$
          description: Stop loss as a decimal string; "0" clears it
        tp:
          type: string
          pattern: ^(0|[1-9][0-9]*)(\.[0-9]+)?$
          description: Take profit as a decimal string; "0" clears it
        expires_at:
          type:
          - string
          - 'null'
          format: date-time
          description: When the order lapses if it has not filled. A time sets it; null makes the order
            good till cancelled; absent leaves it as it is. Read on the broker's clock by the terminal,
            as on OrderPlace
    PositionModify:
      type: object
      additionalProperties: false
      minProperties: 1
      description: At least one of sl and tp
      properties:
        sl:
          type: string
          pattern: ^(0|[1-9][0-9]*)(\.[0-9]+)?$
          description: Decimal string; "0" clears it
        tp:
          type: string
          pattern: ^(0|[1-9][0-9]*)(\.[0-9]+)?$
          description: Decimal string; "0" clears it
    PositionClose:
      type: object
      additionalProperties: false
      properties:
        deviation_points:
          type: integer
          minimum: 0
          default: 20
        comment:
          type: string
          maxLength: 31
          description: 'Written on the closing deal (Deal.comment), so a client can tell its own closes
            apart: every close the platform sends is MT5''s close_reason expert, whoever asked for it.
            Absent, the closing deal takes the position''s own comment. MT5 cuts anything longer without
            saying so, so longer is refused'
    PositionCloseBy:
      type: object
      description: 'Close the position in the path against an opposite position in the same symbol. Hedging
        accounts only: the smaller position disappears and the larger is reduced by its volume. Refused
        with `invalid_request`, before the broker, when either ticket is not an open position of this
        account, when the two are in different symbols or on the same side, or when they are the same
        ticket.'
      additionalProperties: false
      required:
      - by_ticket
      properties:
        by_ticket:
          type: integer
          format: int64
          minimum: 1
          description: The opposite position's ticket
    TrailingStopSet:
      type: object
      description: Keep this position's stop loss `distance` behind the best price it reaches. The platform
        moves the broker's stop, only ever tighter, at most once a second and by at least a tenth of the
        distance. Setting again replaces the distance and keeps what the stop has reached. Refused with
        `invalid_request` when the ticket is not an open position of this account, and `invalid_stops`
        when the distance is inside the symbol's stops level.
      additionalProperties: false
      required:
      - distance
      properties:
        distance:
          type: string
          pattern: ^(0|[1-9][0-9]*)(\.[0-9]+)?$
          description: A price difference, a decimal string above zero, never a float
    TrailingStop:
      type: object
      description: 'A position''s trailing stop as the platform holds it. `active`: the platform is trailing
        it; `paused`: the record stands and nothing trails it now (the terminal is not ACTIVE, or the
        broker refused the last five moves); `ended`: it stopped, `reason` says why. While nothing trails
        it the stop stays where it last was, at the broker: never no stop.'
      required:
      - distance
      - state
      - since
      - reason
      properties:
        distance:
          type: string
        state:
          type: string
          enum:
          - active
          - paused
          - ended
        since:
          type: string
          format: date-time
          description: When it took this state
        reason:
          type:
          - string
          - 'null'
          description: 'Why it is paused or ended: stop_changed (a stop set by anyone else), position_closed,
            cleared, terminal_retired, terminal_not_active, or the broker''s words for a refused move;
            null while active'
    PositionTrailingStopChanged:
      type: object
      description: '`data` of a `position.trailing_stop_changed` message on the `events` channel: sent
        once each time a position''s trailing stop becomes active, paused or ended. Each move of the stop
        is a `position.modified`, as for any change of a stop.'
      required:
      - schema_version
      - terminal_id
      - ticket
      - distance
      - state
      - reason
      - at
      properties:
        schema_version:
          type: string
        terminal_id:
          type: string
          format: uuid
        ticket:
          type: string
          pattern: ^[0-9]+$
          description: The position's MT5 ticket, an integer as text, as on `position.opened`
        distance:
          type: string
        state:
          type: string
          enum:
          - active
          - paused
          - ended
        reason:
          type:
          - string
          - 'null'
          description: As `TrailingStop.reason`; on the stream empty while active
        at:
          type: string
          format: date-time
    PositionClosed:
      type: object
      description: '`data` of a `position.closed` message on the `events` channel: sent once when a position
        closes, at the broker or by anyone. `close_reason` says why in MT5''s own `DEAL_REASON` words,
        the same as `Deal.close_reason`, read from the closing deal''s code (`deal_reason_raw`); the platform
        never infers it from a comment. `unknown` when the terminal did not find the closing deal, or
        MT5 gave a code outside its list; the code is then in `deal_reason_raw` where there was one. On
        the stream every value is text, as on every event, and a field with no value is left out.'
      required:
      - schema_version
      - terminal_id
      - event_id
      - ticket
      - symbol
      - side
      - volume
      - open_price
      - open_time
      - magic
      - comment
      - ts
      - close_reason
      properties:
        schema_version:
          type: string
        terminal_id:
          type: string
          format: uuid
          description: 'The join key: the terminal whose position closed'
        event_id:
          type: string
          description: 'Deterministic per close: a replay after a cell restart carries the same one and
            is sent once'
        ticket:
          type: string
          pattern: ^[0-9]+$
          description: The position's MT5 ticket, an integer as text, as on `position.opened`
        symbol:
          type: string
        side:
          type: string
          enum:
          - buy
          - sell
        volume:
          type: string
          description: Lots
        open_price:
          type: string
        open_time:
          type: string
          format: date-time
        sl:
          type:
          - string
          - 'null'
          description: The stop loss it closed with; absent when none
        tp:
          type:
          - string
          - 'null'
          description: The take profit it closed with; absent when none
        price_current:
          type:
          - string
          - 'null'
          description: The last price the cell held for it; absent when not known
        swap:
          type:
          - string
          - 'null'
          description: Absent when not known
        magic:
          type: string
          pattern: ^-?[0-9]+$
          description: The MT5 magic number, an integer as text; 0 when none
        comment:
          type: string
          description: The MT5 comment; empty when none
        close_price:
          type:
          - string
          - 'null'
          description: The closing deal's price; absent when the closing deal was not found
        profit:
          type:
          - string
          - 'null'
          description: The closing deal's profit in the account currency; absent when the closing deal
            was not found
        close_reason:
          type: string
          enum:
          - client
          - mobile
          - web
          - expert
          - sl
          - tp
          - stop_out
          - rollover
          - vmargin
          - split
          - unknown
          description: 'MT5 DEAL_REASON of the closing deal: client (desktop), mobile, web, expert (a
            program, MFX included), sl, tp, stop_out, rollover, vmargin, split; unknown when it could
            not be read'
        deal_reason_raw:
          type: string
          pattern: ^-?[0-9]+$
          description: MT5's own DEAL_REASON code of the closing deal, an integer as text; absent when
            the closing deal was not found
        ts:
          type: string
          format: date-time
          description: 'When it closed, UTC: the closing deal''s time, or when the cell saw it gone'
        idempotency_key:
          type:
          - string
          - 'null'
          description: 'The Idempotency-Key of the platform command that closed it (closePosition or closePositionBy):
            the newest such command on this terminal whose outcome is recorded SUCCEEDED, names this position
            and was recorded within the last 30 s. Absent for a close nobody asked the platform for (sl,
            tp, stop-out, a person at the terminal), and when the command''s outcome was not yet recorded
            when the close was told; `magic` and `comment` here are the position''s own'
    PositionOpened:
      type: object
      description: '`data` of a `position.opened` message on the `events` channel: sent once when a position
        opens on the terminal''s account, by anyone (MFX Hub, an expert advisor, the broker''s own apps).
        The terminal reads its positions and tells what changed since it last read them, so a position
        that opened and closed between two reads is told as `position.opened` then `position.closed`.
        On the stream every value is text, as on every event, and a field with no value is left out.'
      required:
      - schema_version
      - terminal_id
      - event_id
      - ticket
      - symbol
      - side
      - volume
      - open_price
      - open_time
      - magic
      - comment
      - ts
      properties:
        schema_version:
          type: string
          description: The payload's version; 1
        terminal_id:
          type: string
          format: uuid
          description: 'The join key: the terminal whose account holds the position'
        event_id:
          type: string
          description: 'Deterministic per position: a replay after a cell restart carries the same one
            and is sent once'
        ticket:
          type: string
          pattern: ^[0-9]+$
          description: 'The position''s MT5 ticket, an integer as text: the key `position.modified` and
            `position.closed` carry for it'
        symbol:
          type: string
        side:
          type: string
          enum:
          - buy
          - sell
        volume:
          type: string
          description: Lots, a decimal as text
        open_price:
          type: string
          description: A decimal as text
        price_current:
          type: string
          description: The last price the terminal read for it; absent when not known
        sl:
          type: string
          description: The stop loss; absent when none
        tp:
          type: string
          description: The take profit; absent when none
        profit:
          type: string
          description: The floating profit in the account currency when it was read; absent when not known
        swap:
          type: string
          description: Absent when not known
        open_time:
          type: string
          format: date-time
          description: When it opened, UTC
        magic:
          type: string
          pattern: ^-?[0-9]+$
          description: The MT5 magic number, an integer as text; 0 when none
        comment:
          type: string
          description: The MT5 comment; empty when none
        ts:
          type: string
          format: date-time
          description: 'When it opened, UTC: the same instant as `open_time`'
        idempotency_key:
          type: string
          description: 'The Idempotency-Key of the platform command that opened it (placeOrder): the newest
            such command on this terminal recorded SUCCEEDED naming this position within the last 30 s.
            Absent for a position the platform did not open (an expert advisor, the broker''s apps) or
            whose command outcome was not yet recorded'
    PositionModified:
      type: object
      description: '`data` of a `position.modified` message on the `events` channel: sent once each time
        the terminal reads an open position with a different stop loss, take profit or volume than it
        last read - set by anyone, a partial close and each move of a trailing stop included. Each message
        is the position as it now stands, not the difference. On the stream every value is text, as on
        every event, and a field with no value is left out: a stop loss or take profit that was removed
        is absent.'
      required:
      - schema_version
      - terminal_id
      - event_id
      - ticket
      - symbol
      - side
      - volume
      - open_price
      - open_time
      - magic
      - comment
      - ts
      properties:
        schema_version:
          type: string
          description: The payload's version; 1
        terminal_id:
          type: string
          format: uuid
          description: 'The join key: the terminal whose account holds the position'
        event_id:
          type: string
          description: 'Deterministic per change (the ticket with its new stop loss, take profit and volume):
            a replay after a cell restart carries the same one and is sent once'
        ticket:
          type: string
          pattern: ^[0-9]+$
          description: The position's MT5 ticket, an integer as text
        symbol:
          type: string
        side:
          type: string
          enum:
          - buy
          - sell
        volume:
          type: string
          description: Lots now, a decimal as text
        open_price:
          type: string
          description: A decimal as text
        price_current:
          type: string
          description: The last price the terminal read for it; absent when not known
        sl:
          type: string
          description: The stop loss now; absent when none
        tp:
          type: string
          description: The take profit now; absent when none
        profit:
          type: string
          description: The floating profit in the account currency when it was read; absent when not known
        swap:
          type: string
          description: Absent when not known
        open_time:
          type: string
          format: date-time
          description: When it opened, UTC
        magic:
          type: string
          pattern: ^-?[0-9]+$
          description: The MT5 magic number, an integer as text; 0 when none
        comment:
          type: string
          description: The MT5 comment; empty when none
        ts:
          type: string
          format: date-time
          description: When the terminal saw the change, UTC
        idempotency_key:
          type: string
          description: 'The Idempotency-Key of the platform command that changed it (modifyPosition, closePositionPartial,
            a trailing stop): the newest such command on this terminal recorded SUCCEEDED naming this
            position within the last 30 s. Absent for a change the platform did not make'
    TerminalStateChanged:
      type: object
      description: '`data` of a `terminal.state_changed` message on the `events` channel: sent once for
        each move of a terminal''s lifecycle state, after the move is recorded, whoever made it (you,
        an operator or the platform). `transition_id` names the move in the terminal''s history. On the
        stream every value is text, as on every event.'
      required:
      - schema_version
      - terminal_id
      - from
      - to
      - reason
      - transition_id
      - ts
      properties:
        schema_version:
          type: string
          description: The payload's version; 1
        terminal_id:
          type: string
          format: uuid
        from:
          type: string
          enum:
          - REQUESTED
          - PROVISIONING
          - LOGGING_IN
          - ACTIVE
          - OFFLINE
          - PARKED
          - DRAINING
          - DRAINED
          - RETIRED
          - FAILED
          description: The state it left (`Terminal.state` explains each)
        to:
          type: string
          enum:
          - REQUESTED
          - PROVISIONING
          - LOGGING_IN
          - ACTIVE
          - OFFLINE
          - PARKED
          - DRAINING
          - DRAINED
          - RETIRED
          - FAILED
          description: The state it is now in
        reason:
          type: string
          description: Why it moved, in words (for example `account verified, broker connected`, `its
            tenant's suspension grace ended`)
        transition_id:
          type: string
          format: uuid
          description: The move's id in the terminal's state history
        ts:
          type: string
          format: date-time
          description: When it moved, UTC
    TerminalConditionChanged:
      type: object
      description: '`data` of a `terminal.condition_changed` message on the `events` channel: sent once
        when one of a terminal''s observed conditions changes status, and when `TicksFresh` moves between
        its two named `failed` reasons, `slow_feed` and `broker_quiet`. A reason reworded under a status
        that stands sends nothing. The fields are those of `Condition`. On the stream every value is text,
        as on every event, and a value that does not exist is empty.'
      required:
      - schema_version
      - terminal_id
      - condition
      - status
      - reason
      - since
      - attributed_to
      properties:
        schema_version:
          type: string
          description: The payload's version; 1
        terminal_id:
          type: string
          format: uuid
        condition:
          type: string
          enum:
          - ProcessRunning
          - BrokerConnected
          - TicksFresh
          - TradeAllowed
          - CredentialLeased
        status:
          $ref: '#/components/schemas/ConditionStatus'
        reason:
          type: string
          description: Why, as in `Condition.reason`; empty when `ok` with nothing to say
        since:
          type: string
          format: date-time
          description: When it took this status, UTC
        attributed_to:
          type: string
          enum:
          - broker
          - ''
          description: 'As `Condition.attributed_to`: `broker` for a broker''s feed fault, empty when
            not attributed'
    TerminalOperationChanged:
      type: object
      description: '`data` of a `terminal.operation_changed` message on the `events` channel: sent when
        a governed operation on a terminal (`TerminalOperation`: a restart, a rebuild, a move, a retire,
        a retried login, an attach or detach, a drain) is queued, when it starts, and when it ends: settled
        (SUCCEEDED or FAILED) or ended without running (NOT_STARTED, EXPIRED, CANCELLED, SUPERSEDED).
        The steps in between are not sent; read `GET /terminals/{id}/operations/{operation_id}` for its
        timeline. On the stream every value is text, as on every event, and a value that does not exist
        is empty.'
      required:
      - schema_version
      - operation_id
      - terminal_id
      - kind
      - state
      - step
      - forced_stop
      - cooldown_until
      - finished_at
      properties:
        schema_version:
          type: string
          description: The payload's version; 1
        operation_id:
          type: string
          format: uuid
        terminal_id:
          type: string
          format: uuid
        kind:
          type: string
          enum:
          - restart
          - rebuild
          - move
          - retire
          - retry_login
          - attach
          - detach
          - drain
        state:
          type: string
          enum:
          - QUEUED
          - ACCEPTED
          - CLOSING
          - FORCED_STOP
          - RELAUNCHING
          - SUCCEEDED
          - FAILED
          - NOT_STARTED
          - EXPIRED
          - CANCELLED
          - SUPERSEDED
          description: As `TerminalOperation.state`
        step:
          type: string
          description: 'As `TerminalOperation.step`: the last step the cell reached, or on FAILED and
            NOT_STARTED what failed or refused; empty when none'
        forced_stop:
          type: string
          enum:
          - 'true'
          - 'false'
          - ''
          description: As `TerminalOperation.forced_stop`; empty until the cell says
        cooldown_until:
          type: string
          description: UTC date-time when the next restart of the terminal is allowed; empty when none
        finished_at:
          type: string
          description: UTC date-time when it ended; empty while it runs
    AccountProfileChanged:
      type: object
      description: '`data` of an `account.profile_changed` message on the `events` channel: the terminal
        reads its account''s slow facts (`AccountProfile`) every 60 seconds and sends this when any of
        them differs from what it last read, and when it has no earlier reading to compare with. Every
        fact is sent as it now stands; `changed` names the ones that moved. A fact the terminal could
        not read is left out. On the stream every value is text, as on every event.'
      required:
      - schema_version
      - terminal_id
      - trade_allowed
      - expert_allowed
      - changed
      - observed_at
      properties:
        schema_version:
          type: string
          description: The payload's version; 1
        terminal_id:
          type: string
          format: uuid
        currency:
          type: string
          description: The account currency; absent when not read
        leverage:
          type: string
          pattern: ^[0-9]+$
          description: The account leverage, an integer as text (500 is 1:500); absent when not read
        company:
          type: string
          description: The broker's company name as MT5 gives it; absent when not read
        account_type:
          type: string
          enum:
          - demo
          - live
          - contest
          description: Absent when not read
        margin_mode:
          type: string
          enum:
          - netting
          - exchange
          - hedging
          description: Absent when not read
        trade_allowed:
          type: string
          enum:
          - 'true'
          - 'false'
          description: Whether the broker allows trading on the account
        expert_allowed:
          type: string
          enum:
          - 'true'
          - 'false'
          description: Whether the broker allows expert advisors to trade on the account
        changed:
          type: string
          description: 'A JSON array as text of the facts that moved since the last read: currency, leverage,
            company, account_type, margin_mode, trade_allowed, expert_allowed. All of them when there
            was no earlier reading'
        observed_at:
          type: string
          format: date-time
          description: When the terminal read them, UTC
    PositionClosePartial:
      type: object
      additionalProperties: false
      required:
      - volume
      properties:
        volume:
          type: string
          pattern: ^(0|[1-9][0-9]*)(\.[0-9]+)?$
          description: Lots to close, as a decimal string above zero; less than the position and on the
            symbol's step. Snapped onto the step first, then compared against the position, so the volume
            judged is the volume sent
        deviation_points:
          type: integer
          minimum: 0
          default: 20
        comment:
          type: string
          maxLength: 31
          description: Written on the closing deal, as on PositionClose; absent, the deal takes the position's
            own comment. The position keeps its own comment. Longer than 31 characters is refused
    CommandState:
      type: string
      description: 'Final states are SUCCEEDED, FAILED, EXPIRED and REJECTED. UNKNOWN is visible and NOT
        final: the order may have reached the broker and its outcome could not be read (a timeout after
        send, a lost connection). Reconciliation against the terminal''s deal history resolves it to SUCCEEDED
        or FAILED on its own. A client must not re-send an order whose command is UNKNOWN, because that
        is how one fill becomes two. A NOT_EXECUTED answer from the terminal reads REJECTED with its reason.
        SUCCEEDED means the broker did what the command asked: for a market order, filled; for a pending
        order (limit, stop, stop_limit), accepted onto the broker''s book with its ticket in `tickets.order`
        - not filled (OrderPlace).'
      enum:
      - ACCEPTED
      - ENQUEUED
      - DELIVERED
      - EXECUTING
      - SUCCEEDED
      - FAILED
      - EXPIRED
      - REJECTED
      - UNKNOWN
    CommandTickets:
      type: object
      description: 'MT5 relates exactly one order, one deal and one position per fill; a field is null
        where MT5 has none yet. A SUCCEEDED market order_place carries all three; a SUCCEEDED pending
        order_place (limit, stop, stop_limit) carries `order` only, the pending order''s ticket, with
        `deal` and `position` null: the fill comes later and is seen in deals and positions, not here
        (OrderPlace)'
      required:
      - order
      - deal
      - position
      properties:
        order:
          type:
          - integer
          - 'null'
          format: int64
        deal:
          type:
          - integer
          - 'null'
          format: int64
        position:
          type:
          - integer
          - 'null'
          format: int64
    CommandResult:
      type: object
      description: 'What happened at the broker, once the command has an outcome. `retryable` is set on
        every reason, so an SDK decides from the result and not from a table that can drift. It is written
        once, from the broker''s answer to the command: for a pending order_place that is the placement
        (`mt5_retcode` 10008, `tickets.order` set, no deal, no `exec_price`), and the later fill never
        rewrites it (OrderPlace says where the fill is seen).'
      required:
      - ok
      - reason
      - retryable
      - tickets
      - attempts
      properties:
        ok:
          type: boolean
        reason:
          type:
          - string
          - 'null'
          description: Granular reason; null when ok
        retryable:
          type: boolean
          description: Whether sending the same order again, under a NEW Idempotency-Key, can succeed.
            Always false while the state is UNKNOWN
        mt5_retcode:
          type:
          - integer
          - 'null'
          description: MT5 TRADE_RETCODE_*; null when the command never reached the terminal
        retcode_text:
          type:
          - string
          - 'null'
        comment_raw:
          type:
          - string
          - 'null'
          description: The broker's own comment, verbatim
        terminal_state:
          type:
          - string
          - 'null'
          description: 'The terminal''s lifecycle state when the outcome was recorded: when the cell''s
            result arrived, or when the platform expired the command; null only when the terminal no longer
            exists'
        tickets:
          $ref: '#/components/schemas/CommandTickets'
        exec_price:
          type:
          - string
          - 'null'
          description: 'Decimal as a string: the fill price of a market order or close; on an amended
            pending order, its new price; null for a pending order''s placement'
        exec_volume:
          type:
          - string
          - 'null'
          description: 'Lots, decimal as a string: the filled volume of a market order or close; on a
            pending order''s placement, the order''s volume as the broker echoed it, or null - never a
            fill'
        broker_latency_ms:
          type:
          - integer
          - 'null'
        agent_latency_ms:
          type:
          - integer
          - 'null'
        attempts:
          type: integer
          minimum: 0
        rerouted_from:
          type:
          - string
          - 'null'
          format: uuid
          description: The terminal the command was first sent to, when a failover moved it
        idempotency_key:
          type: string
          description: The Idempotency-Key the command was sent with, so an outcome is joined to its intent
            without a lookup. Always served
        magic:
          type:
          - integer
          - 'null'
          description: 'The magic number the command sent to the broker: the one asked for on OrderPlace,
            0 when none was. Null for a command that carries none (a close keeps the position''s own magic,
            which the platform does not hold), and for a command that is not an order. Always served'
        comment:
          type:
          - string
          - 'null'
          description: 'The comment the command sent to the broker: the one asked for on OrderPlace, PositionClose
            or PositionClosePartial, empty for an order placed without one. Null when the command carried
            none (a close without a comment, on which the closing deal takes the position''s own). Always
            served'
    Command:
      type: object
      required:
      - command_id
      - terminal_id
      - kind
      - state
      - final
      - created_at
      - updated_at
      - result
      properties:
        command_id:
          type: string
          format: uuid
        terminal_id:
          type: string
          format: uuid
        kind:
          type: string
          enum:
          - order_place
          - order_cancel
          - order_modify
          - position_modify
          - position_close
          - position_close_partial
          - position_close_by
          - trailing_stop_set
          - trailing_stop_clear
        state:
          $ref: '#/components/schemas/CommandState'
        final:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        expires_at:
          type:
          - string
          - 'null'
          format: date-time
          description: 'After this the command is EXPIRED and never executes: a cell refuses an envelope
            past it, and a command still on the platform is swept EXPIRED. It is the command''s deadline
            to reach the broker, not a pending order''s own `expires_at`. Set from the moment the command
            is accepted, by kind: 10 s for every execution kind (order_place, order_cancel, order_modify,
            position_modify, position_close, position_close_partial, position_close_by, trailing_stop_set,
            trailing_stop_clear); an order_place may ask for 1 s to 60 s instead with `expires_in_ms`'
        result:
          oneOf:
          - $ref: '#/components/schemas/CommandResult'
          - type: 'null'
          description: Null until the command has an outcome
    CommandOutcome:
      type: object
      description: '`data` of a `command.completed` or `command.failed` message on the `events` channel
        and on `results:{terminal_id}`: sent once when a command reaches an outcome, `command.completed`
        for SUCCEEDED and `command.failed` for every other end (FAILED, EXPIRED, REJECTED). It carries
        what `GET /commands/{id}` serves as `result`. On the stream every value is text, `tickets` and
        `latencies` are JSON objects as text, and a value that does not exist is empty.'
      required:
      - schema_version
      - command_id
      - idempotency_key
      - terminal_id
      - state
      - retcode
      - reason
      - tickets
      - exec_price
      - exec_volume
      - latencies
      - terminal_state
      properties:
        schema_version:
          type: string
        command_id:
          type: string
          format: uuid
        idempotency_key:
          type: string
        terminal_id:
          type: string
          format: uuid
          description: 'The join key: the terminal the command ran on'
        state:
          $ref: '#/components/schemas/CommandState'
        retcode:
          type: string
          description: MT5 TRADE_RETCODE_*; empty when the command never reached the terminal
        reason:
          type: string
          description: Granular reason, never a bucket
        tickets:
          type: string
          description: CommandTickets as JSON text
        exec_price:
          type: string
          description: Decimal as a string; empty when nothing filled
        exec_volume:
          type: string
          description: Lots, decimal as a string; empty when nothing filled
        latencies:
          type: string
          description: 'JSON text: {"broker_ms": integer or null, "agent_ms": integer or null}'
        terminal_state:
          type: string
          description: 'The terminal''s lifecycle state when the outcome was recorded: when the cell''s
            result arrived, or when the platform expired the command. Empty only when the terminal no
            longer exists'
        magic:
          type: string
          description: 'CommandResult.magic as text: the magic number the command sent, as an integer
            in text; empty where CommandResult.magic is null. Always sent'
        comment:
          type: string
          description: 'CommandResult.comment: the comment the command sent; empty where it is null or
            the order was placed without one. Always sent'
    Position:
      type: object
      required:
      - ticket
      - symbol
      - side
      - volume
      - open_price
      - sl
      - tp
      - profit
      - swap
      - open_time
      - magic
      - comment
      properties:
        ticket:
          type: integer
          format: int64
        symbol:
          type: string
        side:
          type: string
          enum:
          - buy
          - sell
        volume:
          type: string
          description: Lots
        open_price:
          type: string
        sl:
          type:
          - string
          - 'null'
          description: Null when none
        tp:
          type:
          - string
          - 'null'
        price_current:
          type:
          - string
          - 'null'
          description: The price the floating profit is computed at; null when only position events are
            known
        profit:
          type:
          - string
          - 'null'
          description: Floating, in the account currency; null when only position events are known
        swap:
          type:
          - string
          - 'null'
        commission:
          type:
          - string
          - 'null'
          description: 'In the account currency: the commission the broker charged on the deals of this
            position so far, entry and any partial close (MT5 keeps it on the deals, not the position).
            Null when the broker reports none or the cell has not read the deals yet'
        margin:
          type:
          - string
          - 'null'
          description: 'In the account currency: the margin this position holds, as the terminal computes
            it for its volume at its open price (order_calc_margin). Null when the terminal cannot compute
            it; the account''s `margin` is the total the broker applies, which hedging rules may make
            less than the sum'
        open_time:
          type: string
          format: date-time
        magic:
          type: integer
        comment:
          type: string
        trailing_stop:
          description: The position's trailing stop, or null when it has none. The moving stop itself
            is `sl`
          oneOf:
          - $ref: '#/components/schemas/TrailingStop'
          - type: 'null'
    PositionList:
      type: object
      required:
      - as_of
      - items
      - stale
      properties:
        as_of:
          type: string
          format: date-time
          description: When the snapshot was taken on the terminal
        stale:
          type: boolean
          description: As Account.stale
        items:
          type: array
          items:
            $ref: '#/components/schemas/Position'
    PendingOrder:
      type: object
      required:
      - ticket
      - symbol
      - side
      - order_type
      - volume
      - price
      - sl
      - tp
      - placed_time
      - expires_at
      - magic
      - comment
      properties:
        ticket:
          type: integer
          format: int64
        symbol:
          type: string
        side:
          type: string
          enum:
          - buy
          - sell
        order_type:
          type: string
          enum:
          - limit
          - stop
          - stop_limit
        volume:
          type: string
        price:
          type: string
          description: On a stop-limit order, the stop price
        stop_limit_price:
          type:
          - string
          - 'null'
          description: A stop-limit order's second price, the limit order placed when the market reaches
            `price`; null on every other order
        sl:
          type:
          - string
          - 'null'
        tp:
          type:
          - string
          - 'null'
        placed_time:
          type: string
          format: date-time
        expires_at:
          type:
          - string
          - 'null'
          format: date-time
          description: Null means good till cancelled
        magic:
          type: integer
        comment:
          type: string
    PendingOrderList:
      type: object
      required:
      - as_of
      - items
      - stale
      properties:
        as_of:
          type: string
          format: date-time
          description: 'When the cell last read the pending orders: on a position change, or every 5 s'
        stale:
          type: boolean
          description: As Account.stale
        items:
          type: array
          items:
            $ref: '#/components/schemas/PendingOrder'
    Deal:
      type: object
      required:
      - deal
      - order
      - position
      - symbol
      - side
      - entry
      - volume
      - price
      - profit
      - commission
      - swap
      - time
      - magic
      - comment
      - close_reason
      properties:
        deal:
          type: integer
          format: int64
        order:
          type:
          - integer
          - 'null'
          format: int64
        position:
          type:
          - integer
          - 'null'
          format: int64
        symbol:
          type: string
        side:
          type: string
          enum:
          - buy
          - sell
        entry:
          type: string
          enum:
          - in
          - out
          - inout
        volume:
          type: string
        price:
          type: string
        profit:
          type: string
        commission:
          type: string
        swap:
          type: string
        fee:
          type:
          - string
          - 'null'
          description: The broker's fee on this deal (MT5 DEAL_FEE), in the account currency; null from
            a cell that does not send it
        balance:
          type:
          - string
          - 'null'
          description: 'The account balance just after this deal, in the account currency: the balance
            when the history was read, less every deal after this one (profit, commission, swap and fee,
            balance deals included). Null when the cell could not read the later deals consistently'
        sl:
          type:
          - string
          - 'null'
          description: 'On a closing deal (`entry` out or inout), the stop loss the position had when
            it closed: the last one the platform recorded for it (position events and account snapshots).
            MT5 keeps no stop on a deal or on its closing order, so null on an entry deal, when the position
            had none, or when the platform never saw it open'
        tp:
          type:
          - string
          - 'null'
          description: As `sl`, for the take profit
        time:
          type: string
          format: date-time
        magic:
          type: integer
        comment:
          type: string
        close_reason:
          type:
          - string
          - 'null'
          enum:
          - client
          - expert
          - sl
          - tp
          - stop_out
          - rollover
          - vmargin
          - split
          - mobile
          - web
          - null
          description: MT5 DEAL_REASON; null on an entry deal
    DealPage:
      type: object
      required:
      - items
      - next_cursor
      description: Newest first by (time, deal), inside the requested from/to
      properties:
        next_cursor:
          type:
          - string
          - 'null'
          description: Opaque (created_at, id) cursor for the following page; null on the last page
        returned:
          type: integer
          description: How many items are in THIS page; never a total
        items:
          type: array
          items:
            $ref: '#/components/schemas/Deal'
    Candle:
      type: object
      required:
      - ts
      - o
      - h
      - l
      - c
      - v
      properties:
        ts:
          type: string
          format: date-time
          description: Bar open time, UTC
        o:
          type: string
        h:
          type: string
        l:
          type: string
        c:
          type: string
        v:
          type: integer
          description: Tick volume
    CandleList:
      type: object
      required:
      - items
      properties:
        items:
          type: array
          maxItems: 1000
          items:
            $ref: '#/components/schemas/Candle'
          description: Oldest first by bar time; at most 1000 bars per call
    Tick:
      type: object
      required:
      - ts
      - bid
      - ask
      - last
      - volume
      properties:
        ts:
          type: string
          format: date-time
          description: The tick's time, UTC, to the millisecond
        bid:
          type: string
        ask:
          type: string
        last:
          type:
          - string
          - 'null'
          description: The last deal's price where the broker sends one; null otherwise (most FX)
        volume:
          type:
          - string
          - 'null'
          description: The last deal's volume where the broker sends one
    TickList:
      type: object
      required:
      - items
      - more
      properties:
        items:
          type: array
          maxItems: 1000
          items:
            $ref: '#/components/schemas/Tick'
          description: Oldest first; the first ticks at or after `from`
        more:
          type: boolean
          description: True when the window holds ticks beyond these. Ask again with `from` set to the
            last tick's `ts` and drop the ticks of that millisecond you already hold
    BookMessage:
      type: object
      description: '`data` of an `md.book` message on `book:{server_id}:{symbol}`: the symbol''s whole
        order book as one of the tenant''s terminals read it, best price first on each side. Replace your
        book with every message. The terminal reads at its refresh rate and sends a book only when it
        differs from the last it sent, so two changes inside one read are one book. `seq` increases as
        on `md:`; a gap is a book that was superseded before it reached you. Not a reconstruction: MFX
        Hub builds no book from ticks or from several terminals.'
      required:
      - schema_version
      - bids
      - asks
      - broker_ts
      - levels
      properties:
        schema_version:
          type: string
          description: The payload's version; 1
        bids:
          type: array
          maxItems: 64
          description: 'Buy orders, highest price first, at most `levels`: `[price, volume]`, decimals
            as strings'
          items:
            type: array
            minItems: 2
            maxItems: 2
            items:
              type: string
        asks:
          type: array
          maxItems: 64
          description: 'Sell orders, lowest price first, at most `levels`: `[price, volume]`, decimals
            as strings'
          items:
            type: array
            minItems: 2
            maxItems: 2
            items:
              type: string
        broker_ts:
          type: string
          description: When the terminal read the book, on the broker's clock, to the millisecond (as
            a tick's `broker_ts`)
        levels:
          type: integer
          minimum: 1
          description: 'The most levels a side the platform reads: a side shorter than this is the whole
            of that side of the broker''s book'
    MdStatusMessage:
      type: object
      description: '`data` of an `md.status` message on an `md:`, `candles:` or `book:` channel: whether
        the tenant''s market data is held by a planned maintenance window. A window in progress that suspends
        `market_data` for the tenant sends `maintenance` on each of its open market data channels, and
        on each one subscribed or resumed while it holds (after the `ack`); no tick, candle or book is
        sent on them until it ends, and none of what arrived meanwhile is replayed. When the window ends,
        or the platform can no longer tell that it holds (maintenance fails open), `live` is sent and
        data flows again; a `book:` channel then sends the newest book first. A change of the window''s
        end while it holds sends `maintenance` again with the new `ends_at`. The channel stays subscribed
        throughout; nothing is sent while the data is not held, so a channel that never sees one is live.
        `events`, `results:`, `account:` and `ea:` are not held by `market_data`.'
      required:
      - schema_version
      - status
      - window_id
      - window
      - ends_at
      properties:
        schema_version:
          type: string
          description: The payload's version; 1
        status:
          type: string
          enum:
          - maintenance
          - live
          description: '`maintenance` while a window holds the channel''s data; `live` once it no longer
            does'
        window_id:
          type:
          - string
          - 'null'
          format: uuid
          description: The window that holds it (where two do, the one ending last); null when `live`
        window:
          type:
          - string
          - 'null'
          description: Its label, as the maintenance reads name it (`MW-0031`); null when `live`
        ends_at:
          type:
          - string
          - 'null'
          format: date-time
          description: 'The window''s current end: its ETA while it runs, else its announced end; null
            when `live`'
    ExpertAdvisorStateChanged:
      type: object
      description: '`data` of an `expert_advisor.state_changed` message on the `events` channel: sent
        once when a version of the tenant''s EA takes a new state the platform gave it: its verdict (`approved`,
        `held` or `rejected`), and `revoked` when an operator takes it off every terminal. The report
        is read with `GET /expert-advisors/{id}/report` and an operator''s reason on the version (`decision`);
        the event carries no finding and no source.'
      required:
      - schema_version
      - expert_advisor_id
      - name
      - version
      - state
      - changed_at
      properties:
        schema_version:
          type: string
        expert_advisor_id:
          type: string
          format: uuid
        name:
          type: string
        version:
          type: integer
          description: Counts the uploads under this name, from 1
        state:
          type: string
          enum:
          - uploaded
          - analysing
          - judged
          - held
          - approved
          - rejected
          - withdrawn
          - revoked
        verdict:
          $ref: '#/components/schemas/EaColour'
        changed_at:
          type: string
          format: date-time
        uploaded_by_operator:
          type: string
          enum:
          - 'true'
          description: Present, and true, on the uploaded message of a version the platform operator uploaded
            for you. Absent otherwise
    ExpertAdvisorAttachmentChanged:
      type: object
      description: '`data` of an `expert_advisor.attachment_changed` message on the `events` channel:
        sent once each time an EA on one of the tenant''s terminals takes a new state: its trial started
        (`trial`), ended green on a real-money account and waits for the representative (`awaiting_confirmation`),
        went live (`running`), or ended (`detached`). `reason` says why when the platform ended it; it
        is null for the tenant''s own detach. The trial''s figures and verdict are read on the version
        (`TenantExpertAdvisor.terminals[].trial`).'
      required:
      - schema_version
      - terminal_id
      - expert_advisor_id
      - attachment_id
      - state
      - was
      - changed_at
      properties:
        schema_version:
          type: string
        terminal_id:
          type: string
          format: uuid
        expert_advisor_id:
          type: string
          format: uuid
        attachment_id:
          type: string
          format: uuid
          description: One attach of a version to a terminal; a new attach is a new id
        state:
          type: string
          enum:
          - deploying
          - trial
          - awaiting_confirmation
          - running
          - detached
        was:
          type:
          - string
          - 'null'
          enum:
          - deploying
          - trial
          - awaiting_confirmation
          - running
          - null
          description: The state before; null when the attachment was made
        reason:
          type:
          - string
          - 'null'
          enum:
          - trial_failed
          - confirmation_expired
          - revoked
          - terminal_retired
          - attach_failed
          - null
          description: Why the platform ended it; null for the tenant's own detach and for every state
            but detached
        changed_at:
          type: string
          format: date-time
    EaTelemetryMessage:
      type: object
      description: '`data` of an `expert_advisor.telemetry` message on an `ea:` channel: a batch of records
        the tenant''s EA wrote, in the order written. Delivery is at least once: after the cell restarts
        a file is sent again from its start, and `segment` with `line` is what a client drops a repeat
        on. `skipped` and `dropped` are counts since the message before, so nothing is left out in silence.'
      required:
      - schema_version
      - records
      - skipped
      - dropped
      properties:
        schema_version:
          type: string
          description: The payload's version; 1
        records:
          type: array
          maxItems: 100
          items:
            type: object
            required:
            - segment
            - line
            - record
            properties:
              segment:
                type: integer
                minimum: 0
                description: The number of the EA's telemetry file the record is from
              line:
                type: integer
                minimum: 0
                description: The record's line in that file
              record:
                type: object
                additionalProperties: true
                description: The JSON object the EA wrote, as it wrote it. The platform does not read
                  it for meaning, log it or store it
        skipped:
          type: integer
          minimum: 0
          description: 'Lines the cell could not read: too long, too deep or not JSON'
        dropped:
          type: integer
          minimum: 0
          description: 'Records the platform left out: over the largest record, deeper than eight levels,
            or over the terminal''s pace for the minute'
    EaTelemetryLostMessage:
      type: object
      description: '`data` of an `expert_advisor.telemetry_lost` message on an `ea:` channel, in sequence
        where the records would have been: the EA wrote faster than its records could be delivered, the
        cell''s allowance for the backlog was full, and the oldest waiting files were discarded. Trading
        is never held for telemetry.'
      required:
      - schema_version
      - segment_from
      - segment_to
      - records
      properties:
        schema_version:
          type: string
          description: The payload's version; 1
        segment_from:
          type: integer
          minimum: 0
        segment_to:
          type: integer
          minimum: 0
        records:
          type: integer
          minimum: 0
          description: How many records the discarded files held
    AccountSnapshotMessage:
      type: object
      description: '`data` of an `account.snapshot` on `account:{terminal_id}`: the whole account. Replace
        your view with every snapshot, whatever its `seq`: the channel''s `seq` starts again from 1 when
        the terminal has been quiet for 180 s. Sent on every `subscribe` and `resume` (the platform''s
        current copy), when the position set changes (a ticket opens or closes, SL, TP or volume changes)
        and every 60 s while positions are open. Decimals are strings, as everywhere in this API.'
      required:
      - terminal_id
      - schema_version
      - as_of
      - balance
      - equity
      - margin
      - margin_free
      - margin_level
      - open_positions_count
      - positions
      - pending
      - pending_as_of
      properties:
        terminal_id:
          type: string
          format: uuid
        schema_version:
          type: string
          description: The payload's version; 1
        as_of:
          type: string
          format: date-time
          description: The cell's instant of the reading
        balance:
          type: string
          description: Decimal as a string, in the account currency
        equity:
          type: string
        margin:
          type: string
        margin_free:
          type: string
        margin_level:
          type:
          - string
          - 'null'
          description: Null with no open positions
        open_positions_count:
          type: integer
        positions:
          type: array
          items:
            $ref: '#/components/schemas/Position'
          description: Every open position, by ticket
        pending:
          type: array
          items:
            $ref: '#/components/schemas/PendingOrder'
          description: Every pending order as of `pending_as_of`; empty when none was ever read
        pending_as_of:
          type:
          - string
          - 'null'
          format: date-time
          description: When the cell last read the pending orders (on a position change, or every 5 s);
            null when it never has
    AccountMarksMessage:
      type: object
      description: '`data` of an `account.marks` on `account:{terminal_id}`: between snapshots, at the
        terminal''s refresh rate while positions are open and only when something moved, the figures and
        one mark per position whose values changed since the last message. Every 5 s with nothing moved,
        a keep-alive: the figures and an empty `marks`. Apply it only to the snapshot its `base` names
        (`StreamServerMessage.base`): set each ticket''s `price_current`, `profit` and `swap`, and the
        figures. A ticket you do not hold means your view is behind: ignore the message and resume, or
        wait for the next snapshot.'
      required:
      - terminal_id
      - schema_version
      - as_of
      - balance
      - equity
      - margin
      - margin_free
      - margin_level
      - open_positions_count
      - marks
      properties:
        terminal_id:
          type: string
          format: uuid
        schema_version:
          type: string
          description: The payload's version; 1
        as_of:
          type: string
          format: date-time
        balance:
          type: string
        equity:
          type: string
        margin:
          type: string
        margin_free:
          type: string
        margin_level:
          type:
          - string
          - 'null'
        open_positions_count:
          type: integer
          description: 'The snapshot''s: a change in the position set is sent as a snapshot, never as
            marks'
        marks:
          type: array
          description: One `[ticket, price_current, profit, swap]` per moved position; empty on a keep-alive
          items:
            type: array
            minItems: 4
            maxItems: 4
            items:
              type:
              - integer
              - string
              description: 'A generator that does not read prefixItems sees this: the ticket is the integer,
                the rest are decimal strings'
            prefixItems:
            - type: integer
              format: int64
              description: ticket
            - type: string
              description: price_current, decimal as a string
            - type: string
              description: profit, floating, in the account currency
            - type: string
              description: swap
    TenantBroker:
      type: object
      required:
      - id
      - code
      - display_name
      - status
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
        display_name:
          type: string
        status:
          type: string
          enum:
          - pending
          - active
          - suspended
          - retired
        symbol_suffix:
          type: string
          description: The symbol variant this broker's accounts use by default; empty for plain names
    TenantBrokerPage:
      type: object
      required:
      - items
      - next_cursor
      properties:
        next_cursor:
          type:
          - string
          - 'null'
          description: Opaque (created_at, id) cursor for the following page; null on the last page
        returned:
          type: integer
          description: How many items are in THIS page; never a total
        items:
          type: array
          items:
            $ref: '#/components/schemas/TenantBroker'
    TenantBrokerServer:
      type: object
      required:
      - id
      - server_name
      - kind
      - enabled
      - disabled_reason
      properties:
        id:
          type: string
          format: uuid
        server_name:
          type: string
          description: The MT5 server string a credential is submitted for
        kind:
          type: string
          enum:
          - demo
          - live
        enabled:
          type: boolean
          description: 'False: MFX does not use this server now. A terminal or credential for it is refused
            409 broker_not_supported (refused_by server_disabled); try another server of the same broker.'
        disabled_reason:
          type:
          - string
          - 'null'
          description: The sentence the operator recorded; null while enabled. The same words the refusal
            carries
    TenantBrokerServerPage:
      type: object
      required:
      - items
      - next_cursor
      properties:
        next_cursor:
          type:
          - string
          - 'null'
          description: Opaque (created_at, id) cursor for the following page; null on the last page
        returned:
          type: integer
          description: How many items are in THIS page; never a total
        items:
          type: array
          items:
            $ref: '#/components/schemas/TenantBrokerServer'
    TenantFarm:
      type: object
      required:
      - id
      - name
      - os
      - region
      - usages
      - redundancy
      - refresh_ms
      - instruments_max
      - status
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        os:
          type: string
          enum:
          - windows
          - linux
        region:
          type: string
        ha_region:
          type:
          - string
          - 'null'
        usages:
          type: array
          items:
            type: string
            enum:
            - quote_streaming
            - account_read
            - order_execution
        redundancy:
          type: string
          enum:
          - none
          - n_plus_1
          - active_active
        refresh_ms:
          type: integer
          enum:
          - 5000
          - 4000
          - 3000
          - 2000
          - 1000
          - 500
          - 250
          - 200
          description: The default and fastest refresh rate for terminals on this farm
        instruments_max:
          type: integer
          description: 'Per terminal: 100 on Windows, 65 on Linux'
        depth_max:
          type: integer
          minimum: 0
          description: 'How many symbols a terminal on this farm may read the market depth of; 0 means
            the farm offers no depth. The platform''s own per-terminal cap may be lower: a refusal names
            the number that applied'
        customer_code:
          type: boolean
          description: 'Whether a terminal on this farm may run your own expert advisor. A terminal you
            create without naming a farm is never placed on such a farm: name it'
        status:
          type: string
          enum:
          - draft
          - provisioning
          - active
          - disabled
          - suspended
          - draining
          - retired
    TenantFarmPage:
      type: object
      required:
      - items
      - next_cursor
      properties:
        next_cursor:
          type:
          - string
          - 'null'
          description: Opaque (created_at, id) cursor for the following page; null on the last page
        returned:
          type: integer
          description: How many items are in THIS page; never a total
        items:
          type: array
          items:
            $ref: '#/components/schemas/TenantFarm'
    Account:
      type: object
      description: 'What the terminal''s account looks like now: the fast numerics and the slow facts.
        The cell reads the account every 250 ms while positions are open and sends it when it changes
        (every 60 s flat); this answers from the platform''s latest copy, never a round trip to the cell,
        and the same numbers are pushed on the stream''s `account:{terminal_id}` channel as an `account.snapshot`,
        then `account.marks` (not on `events`). Each half carries when it was observed; a half never observed
        is null, not zero.'
      required:
      - terminal_id
      - snapshot
      - profile
      - stale
      properties:
        terminal_id:
          type: string
          format: uuid
        stale:
          type: boolean
          description: True when nothing arrived from the cell for 15 s with positions open (three missed
            keep-alives) or 180 s flat; the numbers are then the last known, as of `snapshot.ts`
        snapshot:
          type:
          - object
          - 'null'
          properties:
            ts:
              type: string
              format: date-time
            balance:
              type: string
              description: Decimal as a string, in the account currency
            equity:
              type: string
            margin:
              type: string
            margin_free:
              type: string
            margin_level:
              type:
              - string
              - 'null'
              description: Null with no open positions
            credit:
              type:
              - string
              - 'null'
              description: The broker's credit on the account (MT5 ACCOUNT_CREDIT), in the account currency;
                part of equity, not of balance. Null from a cell that does not send it
            open_positions_count:
              type: integer
        profile:
          type:
          - object
          - 'null'
          properties:
            currency:
              type: string
            currency_digits:
              type:
              - integer
              - 'null'
              description: 'How many decimals the account currency has (MT5 ACCOUNT_CURRENCY_DIGITS):
                every money figure of this account carries exactly this many'
            leverage:
              type: integer
            company:
              type: string
            account_type:
              type: string
              enum:
              - demo
              - live
              - contest
            margin_mode:
              type: string
              enum:
              - netting
              - exchange
              - hedging
            trade_allowed:
              type: boolean
            expert_allowed:
              type: boolean
            max_sessions:
              type:
              - integer
              - 'null'
            observed_at:
              type: string
              format: date-time
    Spread:
      type: object
      description: 'One instrument''s spread as the tenant''s own terminal sees it. A shared feed cannot
        answer this: the spread a user trades against is the one their broker gives *their* account, so
        it is read from their terminal and carries `age_s` — a spread is never returned without saying
        how old it is, because a stale spread reads as a live one and is acted on.'
      required:
      - symbol
      - bid
      - ask
      - spread_points
      - digits
      - tick_time
      - age_s
      properties:
        symbol:
          type: string
        bid:
          type: string
          description: decimal as a string
        ask:
          type: string
        spread_points:
          type: integer
          description: ask − bid in points, as MT5 counts them
        spread_price:
          type: string
          description: ask − bid in the quote currency, decimal as a string
        digits:
          type: integer
        pip_value_per_lot:
          type:
          - string
          - 'null'
          description: from the terminal, never derived; null until the terminal has reported it
        tick_time:
          type: string
          format: date-time
          description: UTC
        age_s:
          type: number
          description: how old the tick is; a caller decides for itself what is too old
    SpreadList:
      type: object
      description: 'Every instrument this terminal streams, not a page: a terminal carries at most instruments_max
        (100 Windows, 65 Linux).'
      required:
      - terminal_id
      - items
      - as_of
      properties:
        terminal_id:
          type: string
          format: uuid
        items:
          type: array
          items:
            $ref: '#/components/schemas/Spread'
        as_of:
          type: string
          format: date-time
          description: when the platform last heard from the terminal
    UsageRow:
      type: object
      description: One metric's consumption in one period (recorded hourly). Quantities are decimals as
        strings.
      required:
      - metric
      - quantity
      - period_start
      - period_end
      properties:
        metric:
          type: string
          enum:
          - terminal_hours
          - md_msgs
          - commands
          - ws_minutes
        quantity:
          type: string
        period_start:
          type: string
          format: date-time
        period_end:
          type: string
          format: date-time
    Usage:
      type: object
      description: What this tenant has consumed and what the calling key may still spend. The limits
        are the key's own, not the tenant's, so one runaway integration cannot starve a tenant's production
        traffic; `budget_source` says whether `budget_remaining` is a measurement or the configured allowance,
        exactly as the `X-MFX-Budget-Source` header does.
      required:
      - items
      - limits
      - budget_remaining
      - budget_source
      - as_of
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/UsageRow'
        limits:
          type: object
          description: The calling key's ceilings.
          properties:
            commands_per_s:
              type:
              - integer
              - 'null'
            md_msgs_per_s:
              type:
              - integer
              - 'null'
            ws_conns:
              type:
              - integer
              - 'null'
        budget_remaining:
          type: integer
          minimum: 0
        budget_source:
          type: string
          enum:
          - counted
          - configured
          - unconfigured
        as_of:
          type: string
          format: date-time
    MdSubscriptionCreate:
      type: object
      additionalProperties: false
      required:
      - server_id
      - symbol
      properties:
        server_id:
          type: string
          format: uuid
          description: The broker is the server's own
        symbol:
          type: string
          description: In the broker's own name, as the tenant's catalogue lists it
        timeframes:
          type: array
          items:
            type: string
            enum:
            - M1
            - M5
            - M15
            - M30
            - H1
            - H4
            - D1
            - W1
            - MN1
          description: Candles to build; none means ticks only
        delivery:
          type: string
          enum:
          - ws
          - redis_push
          default: ws
        connector_id:
          type:
          - string
          - 'null'
          format: uuid
          description: Required for redis_push, which is not yet available
    MdSubscription:
      type: object
      required:
      - id
      - broker
      - server
      - symbol
      - timeframes
      - delivery
      - state
      - created_at
      properties:
        id:
          type: string
          format: uuid
        broker:
          $ref: '#/components/schemas/Ref'
        server:
          $ref: '#/components/schemas/Ref'
        symbol:
          type: string
        timeframes:
          type: array
          items:
            type: string
        delivery:
          type: string
          enum:
          - ws
          - redis_push
        state:
          type: string
          enum:
          - pending
          - streaming
          - degraded
          - stopped
          description: '`pending` until the first tick. `degraded` when the symbol cannot tick or should
            be ticking and is not (`degraded_reason`); its stream stays granted'
        degraded_reason:
          type:
          - string
          - 'null'
          enum:
          - symbol_removed
          - subscription_refused
          - terminal_disconnected
          - report_stale
          - no_ticks_in_session
          - null
          description: 'Why the subscription is `degraded`; null in every other state. `symbol_removed`:
            the broker no longer lists the symbol. `subscription_refused`: the broker refused it on every
            one of your ACTIVE terminals on the server that carries it. `terminal_disconnected`: you have
            no ACTIVE terminal on the server and no report of the symbol has arrived for the unknown window.
            `report_stale`: a terminal is ACTIVE and still none has arrived, for instance because none
            of them carries the symbol any more. `no_ticks_in_session`: the symbol''s own hours say it
            is trading and it has not ticked for the silence window (measured at the newest report); it
            recovers on two reports in a row that each bring a new tick inside the window, or when its
            session closes. Nothing is degraded for silence outside the symbol''s trading session.'
        degraded_since:
          type:
          - string
          - 'null'
          format: date-time
          description: When it became degraded; null in every other state
        degraded_cause:
          type:
          - string
          - 'null'
          enum:
          - broker
          - platform
          - null
          description: 'Whose cause the degradation is; null in every other state. `broker`: the broker
            removed or refused the symbol, or, for `no_ticks_in_session`, no terminal on the server has
            ticked it inside the silence window either. `platform`: your terminals are lost or not reporting,
            or the symbol is ticking for other terminals on the server and not for this subscription.
            Judged again on every pass; a change sends no event.'
        first_tick_at:
          type:
          - string
          - 'null'
          format: date-time
        created_at:
          type: string
          format: date-time
    WebhookEndpointCreate:
      type: object
      description: 'An address MFX Hub calls for the tenant''s events. `https` only, port 443 or 8443,
        a host name and not an address, no credentials in the URL; a name that resolves to a private,
        loopback, link-local, metadata or MFX Hub address is refused with 422. The number of endpoints
        a tenant may have is limited (409 `quota_exceeded`). Each delivery''s body is the event as the
        `events` channel carries its `data`: `type`, the fields of the schema `x-event-payloads` on `/stream`
        names for that type, and `id`, the event''s cursor (`MFX-Event-Id`).'
      additionalProperties: false
      required:
      - url
      - event_types
      properties:
        url:
          type: string
          format: uri
          maxLength: 2048
        event_types:
          type: array
          minItems: 1
          maxItems: 64
          description: Event types as the events channel names them (`position.closed`), a family (`terminal.*`),
            or `*` for all. Ticks and candles are not events and are never sent this way
          items:
            type: string
            maxLength: 64
        description:
          type:
          - string
          - 'null'
          maxLength: 200
    WebhookEndpointUpdate:
      type: object
      description: 'Fields left out keep their value. `status: active` resumes an endpoint paused by the
        tenant, an operator or the platform; `paused` pauses it'
      additionalProperties: false
      properties:
        url:
          type: string
          format: uri
          maxLength: 2048
        event_types:
          type: array
          minItems: 1
          maxItems: 64
          items:
            type: string
            maxLength: 64
        description:
          type:
          - string
          - 'null'
          maxLength: 200
        status:
          type: string
          enum:
          - active
          - paused
    WebhookEndpoint:
      type: object
      description: One endpoint and how it is doing. A delivery that worked is a count and a time, never
        a record; what did not arrive is read from its failures. Never the secret.
      required:
      - id
      - url
      - event_types
      - description
      - status
      - paused_reason
      - paused_by
      - delivered
      - last_delivered_at
      - last_failed_at
      - retrying
      - dead
      - cursor
      - previous_secret_until
      - created_at
      properties:
        id:
          type: string
          format: uuid
        url:
          type: string
        event_types:
          type: array
          items:
            type: string
        description:
          type:
          - string
          - 'null'
        status:
          type: string
          enum:
          - active
          - paused
        paused_reason:
          type:
          - string
          - 'null'
          description: Why it is paused, in words; null while active
        paused_by:
          type:
          - string
          - 'null'
          enum:
          - tenant
          - operator
          - platform
          - null
          description: 'platform: nothing was delivered for the platform''s pause period while events
            failed'
        delivered:
          type: integer
          minimum: 0
          description: Events delivered since the endpoint was made
        last_delivered_at:
          type:
          - string
          - 'null'
          format: date-time
        last_failed_at:
          type:
          - string
          - 'null'
          format: date-time
        retrying:
          type: integer
          minimum: 0
          description: Failed events still being tried
        dead:
          type: integer
          minimum: 0
          description: Events whose last try failed, kept for a limited number of days
        cursor:
          type:
          - string
          - 'null'
          description: 'The last event of the stream handed on: what a resume continues from'
        previous_secret_until:
          type:
          - string
          - 'null'
          format: date-time
          description: After a rotation, until when the previous secret also signs
        created_at:
          type: string
          format: date-time
    WebhookEndpointCreated:
      description: 'The endpoint, and its signing secret: shown in this answer and never again'
      allOf:
      - $ref: '#/components/schemas/WebhookEndpoint'
      - type: object
        required:
        - secret
        properties:
          secret:
            type: string
            description: 32 random bytes, base64url. Stored securely and shown only here; not in any GET,
              event, log or audit record
    WebhookEndpointList:
      type: object
      required:
      - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/WebhookEndpoint'
    WebhookSecretRotated:
      type: object
      description: The new secret, shown once. The previous one signs beside it until `previous_secret_until`,
        a day
      required:
      - secret
      - previous_secret_until
      properties:
        secret:
          type: string
        previous_secret_until:
          type: string
          format: date-time
    WebhookAttempt:
      type: object
      required:
      - at
      - outcome
      - status_code
      - ms
      properties:
        at:
          type: string
          format: date-time
        outcome:
          type: string
          enum:
          - status
          - timeout
          - connection
          - tls
          - refused_address
          description: 'status: the receiver answered, not 2xx. Never a text from the receiver''s side'
        status_code:
          type:
          - integer
          - 'null'
        ms:
          type:
          - integer
          - 'null'
    WebhookFailure:
      type: object
      description: One event that did not arrive at the first try, with every attempt made on it. Kept
        for a limited number of days
      required:
      - id
      - event_id
      - event_type
      - state
      - attempts
      - next_attempt_at
      - prune_at
      properties:
        id:
          type: string
          format: uuid
        event_id:
          type: string
          description: 'The event''s cursor in the tenant''s stream: MFX-Event-Id'
        event_type:
          type: string
        state:
          type: string
          enum:
          - retrying
          - delivered
          - dead
        attempts:
          type: array
          items:
            $ref: '#/components/schemas/WebhookAttempt'
        next_attempt_at:
          type:
          - string
          - 'null'
          format: date-time
        prune_at:
          type: string
          format: date-time
    WebhookFailurePage:
      type: object
      required:
      - items
      - next_cursor
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/WebhookFailure'
        next_cursor:
          type:
          - string
          - 'null'
    WebhookReplay:
      type: object
      description: 'Send again every event after `after` that the endpoint asks for, marked MFX-Delivery-Attempt:
        replay; or one dead letter by its id'
      additionalProperties: false
      properties:
        after:
          type: string
          description: A cursor of the tenant's stream. Refused 409 cursor_too_old, with details.oldest,
            when the stream no longer holds it
        failure_id:
          type: string
          format: uuid
    WebhookReplayAccepted:
      type: object
      required:
      - events
      properties:
        events:
          type: integer
          minimum: 0
          description: How many events are queued to be sent again
    WebhookTestAccepted:
      type: object
      required:
      - event_id
      properties:
        event_id:
          type: string
          description: The cursor of the `webhook.test` event sent
    WebhookEndpointPaused:
      type: object
      description: '`data` of a `webhook.endpoint_paused` message on the `events` channel'
      required:
      - schema_version
      - endpoint_id
      - by
      - reason
      - at
      properties:
        schema_version:
          type: string
        endpoint_id:
          type: string
          format: uuid
        by:
          type: string
          enum:
          - tenant
          - operator
          - platform
        reason:
          type: string
        at:
          type: string
          format: date-time
    WebhookEndpointResumed:
      type: object
      description: '`data` of a `webhook.endpoint_resumed` message on the `events` channel'
      required:
      - schema_version
      - endpoint_id
      - by
      - at
      properties:
        schema_version:
          type: string
        endpoint_id:
          type: string
          format: uuid
        by:
          type: string
          enum:
          - tenant
          - operator
        at:
          type: string
          format: date-time
    WebhookTest:
      type: object
      description: '`data` of a `webhook.test` message: sent only by the test route, to that endpoint
        alone'
      required:
      - schema_version
      - endpoint_id
      - at
      properties:
        schema_version:
          type: string
        endpoint_id:
          type: string
          format: uuid
        at:
          type: string
          format: date-time
    MdSubscriptionDegraded:
      type: object
      description: '`data` of an `md.subscription_degraded` message on the `events` channel: sent once
        when a subscription becomes degraded, whatever the cause. A reason or a cause that gives way to
        another while it stays degraded sends nothing; read the subscription for the reason and the cause
        that hold now.'
      required:
      - schema_version
      - subscription_id
      - broker_id
      - server_id
      - symbol
      - reason
      - cause
      - since
      properties:
        schema_version:
          type: string
        subscription_id:
          type: string
          format: uuid
        broker_id:
          type: string
          format: uuid
        server_id:
          type: string
          format: uuid
        symbol:
          type: string
        reason:
          type: string
          enum:
          - symbol_removed
          - subscription_refused
          - terminal_disconnected
          - report_stale
          - no_ticks_in_session
        cause:
          type: string
          enum:
          - broker
          - platform
          description: Whose cause it is, as the subscription's `degraded_cause`; on a recovery, the cause
            it recovered from. Sent whatever the cause
        since:
          type: string
          format: date-time
        last_tick_at:
          type: string
          format: date-time
          description: The symbol's last tick; absent when it has not ticked
    MdSubscriptionRecovered:
      type: object
      description: '`data` of an `md.subscription_recovered` message on the `events` channel: sent once
        when a degraded subscription is delivering again. `reason` is what it recovered from and `since`
        when it had become degraded.'
      required:
      - schema_version
      - subscription_id
      - broker_id
      - server_id
      - symbol
      - reason
      - cause
      - since
      - recovered_at
      properties:
        schema_version:
          type: string
        subscription_id:
          type: string
          format: uuid
        broker_id:
          type: string
          format: uuid
        server_id:
          type: string
          format: uuid
        symbol:
          type: string
        reason:
          type: string
          enum:
          - symbol_removed
          - subscription_refused
          - terminal_disconnected
          - report_stale
          - no_ticks_in_session
        cause:
          type: string
          enum:
          - broker
          - platform
          description: Whose cause it is, as the subscription's `degraded_cause`; on a recovery, the cause
            it recovered from. Sent whatever the cause
        since:
          type: string
          format: date-time
        recovered_at:
          type: string
          format: date-time
        last_tick_at:
          type: string
          format: date-time
          description: Absent when the symbol has not ticked
    SymbolSpecChanged:
      type: object
      description: '`data` of a `symbol.spec_changed` message on the `events` channel: sent once for each
        change a tenant''s terminal reported to a symbol on its own catalogue (one server and account
        type) - the specification a program sizes a trade by, what trading the broker allows, the trade
        sessions, or the symbol''s removal. A pip value that moves with the exchange rate is not a change
        and sends nothing; read it on the catalogue. On the stream every value is text, and `before` and
        `after` are JSON objects as text.'
      required:
      - schema_version
      - terminal_id
      - broker_id
      - server_id
      - account_type
      - symbol
      - change
      - before
      - after
      - observed_at
      properties:
        schema_version:
          type: string
        terminal_id:
          type: string
          format: uuid
          description: 'The join key: the terminal whose report showed the change. Every terminal of the
            tenant on that server and account type reads the same catalogue'
        broker_id:
          type: string
          format: uuid
        server_id:
          type: string
          format: uuid
        account_type:
          type: string
        symbol:
          type: string
        change:
          type: string
          enum:
          - spec
          - trading
          - sessions
          - removed
        before:
          type:
          - object
          - 'null'
          description: The spec before (digits, contract_size, volume_min, volume_step, volume_max, trade_mode,
            margin_currency, pip_value_per_lot, trade_sessions, description), decimals as strings
        after:
          type:
          - object
          - 'null'
          description: The spec after, same shape; null for a removal
        observed_at:
          type: string
          format: date-time
          description: When the terminal read its list
    MdSubscriptionPage:
      type: object
      required:
      - items
      - next_cursor
      properties:
        next_cursor:
          type:
          - string
          - 'null'
          description: Opaque (created_at, id) cursor for the following page; null on the last page
        returned:
          type: integer
          description: How many items are in THIS page; never a total
        items:
          type: array
          items:
            $ref: '#/components/schemas/MdSubscription'
    CredentialSubmission:
      type: object
      description: 'What a tenant sends to put its own broker login on a terminal. The only request body
        in MFX Hub that carries a secret: it is read once, wrapped, written to the platform''s secret
        store and never kept anywhere else, logged or echoed. Unknown properties are refused rather than
        ignored, so a misspelled password is an error and not a credential with no password.'
      required:
      - login
      - password
      - server
      additionalProperties: false
      properties:
        login:
          type: integer
          minimum: 1
          description: The MT5 account number
        password:
          type: string
          minLength: 1
          maxLength: 256
          format: password
          writeOnly: true
        server:
          type: string
          minLength: 1
          maxLength: 128
          description: Must be the terminal's own broker server; a mismatch is a 400
        cred_type:
          type: string
          enum:
          - master
          - investor
          default: master
          description: An investor credential turns execution off
    CredentialAccepted:
      type: object
      description: The reference, and nothing else. There is no property here a secret could live in,
        and nothing a client could do with the reference that resubmitting would not do better.
      required:
      - credential_ref_id
      - terminal_id
      - cred_type
      - execution_disabled
      - rotated
      - takes_effect
      - operation_id
      properties:
        rotated:
          type: boolean
          description: True when this replaced the credential the terminal already had
        takes_effect:
          type: string
          enum:
          - first_login
          - restart
          - retry_login
          - next_login
          description: 'When the terminal logs in with what was submitted. `first_login` for a first credential.
            For a rotation: `restart` (it was ACTIVE and is being restarted now), `retry_login` (it was
            FAILED and rejoins the login queue now), or `next_login` (nothing was started, or the operation
            was refused; its next login uses it).'
        operation_id:
          type:
          - string
          - 'null'
          format: uuid
          description: The restart or retry-login a rotation opened, to follow on the operations routes;
            null when none
        not_applied_reason:
          type:
          - string
          - 'null'
          description: 'Why a rotation of a running terminal was not applied now (`takes_effect` is `next_login`
            because the restart or retry-login was refused): the refusal''s own `error.code`, such as
            `operation_in_progress`, `cooldown`, `tenant_rate` or `positions_open`. Null in every other
            answer. The credential is stored either way.'
        same_login_terminals_stale:
          type: integer
          description: 'On a password change (`rotated: true`): how many of your OTHER live terminals
            use the same login and were last given their password before this submission. Each terminal
            holds its own credential, so after changing the password at the broker, submit it to each
            of them. 0 in every other answer.'
        credential_ref_id:
          type: string
          format: uuid
        terminal_id:
          type: string
          format: uuid
        cred_type:
          type: string
          enum:
          - master
          - investor
        execution_disabled:
          type: boolean
          description: True when this submission turned execution off, so the caller learns it here rather
            than from an order being refused later.
    SymbolState:
      type: string
      description: 'Checked in this order, first match wins: unknown (no terminal of the tenant on this
        server is connected, or the newest symbol report from one is older than 180 s by default — could-not-read
        is never reported as closed) → trade_disabled → closed_session (broker time outside this weekday''s
        trade sessions) → paused (inside trade sessions, a watched symbol with no tick for 300 s by default)
        → close_only → long_only / short_only → open.'
      enum:
      - open
      - closed_session
      - paused
      - trade_disabled
      - close_only
      - long_only
      - short_only
      - unknown
    SymbolStatus:
      type: object
      required:
      - state
      - reason
      - since
      - next_open
      - last_tick_age_s
      - quote_watched
      - as_of
      properties:
        state:
          $ref: '#/components/schemas/SymbolState'
        reason:
          type:
          - string
          - 'null'
          enum:
          - terminal_disconnected
          - report_stale
          - trade_mode_disabled
          - outside_trade_session
          - no_ticks_in_session
          - trade_mode_close_only
          - trade_mode_long_only
          - trade_mode_short_only
          - null
          description: null when open.
        since:
          type:
          - string
          - 'null'
          format: date-time
          description: when the current state began, where known
        next_open:
          type:
          - string
          - 'null'
          format: date-time
          description: closed_session only — the next trade-session start, UTC
        last_tick_age_s:
          type:
          - number
          - 'null'
          description: null when the symbol is not watched
        quote_watched:
          type: boolean
          description: True when a terminal of the tenant has this symbol in its instruments, so tick
            age is known and `paused` can be detected. An unwatched symbol is never reported paused.
        as_of:
          type: string
          format: date-time
          description: when this status was worked out
    TradeSession:
      type: object
      required:
      - day
      - from
      - to
      description: One trade session in BROKER time, as MT5 reports it.
      properties:
        day:
          type: string
          enum:
          - mon
          - tue
          - wed
          - thu
          - fri
          - sat
          - sun
        from:
          type: string
          pattern: ^[0-2][0-9]:[0-5][0-9]$
        to:
          type: string
          pattern: ^[0-2][0-9]:[0-5][0-9]$
          description: 24:00 means end of day
    Symbol:
      type: object
      required:
      - symbol
      - description
      - server_id
      - account_type
      - digits
      - contract_size
      - volume_min
      - volume_max
      - volume_step
      - trade_mode
      - margin_currency
      - pip_value_per_lot
      - spec_hash
      - trade_sessions
      - refreshed_at
      - status
      properties:
        symbol:
          type: string
        description:
          type: string
        server_id:
          type: string
          format: uuid
        account_type:
          type: string
        digits:
          type: integer
        contract_size:
          type: string
          description: decimal as a string
        volume_min:
          type: string
        volume_max:
          type: string
        volume_step:
          type: string
        trade_mode:
          type: string
          enum:
          - disabled
          - longonly
          - shortonly
          - closeonly
          - full
        margin_currency:
          type: string
        profit_currency:
          type:
          - string
          - 'null'
          description: The currency the profit is computed in (SYMBOL_CURRENCY_PROFIT).
        point:
          type:
          - string
          - 'null'
          description: 'One point, the smallest price step the symbol is quoted in (SYMBOL_POINT): 0.00001
            on a five-digit FX pair.'
        tick_size:
          type:
          - string
          - 'null'
          description: The smallest price change a price may make (SYMBOL_TRADE_TICK_SIZE); a price off
            it is put on it by the snap rule.
        tick_value:
          type:
          - string
          - 'null'
          description: 'What one tick is worth on one lot, in the account currency (SYMBOL_TRADE_TICK_VALUE).
            A quote figure like pip_value_per_lot: it moves with the exchange rate where the profit currency
            is not the account''s, and it is not in spec_hash.'
        stops_level:
          type:
          - integer
          - 'null'
          description: How close to the current price, in points, a stop loss, a take profit or a pending
            price may be set (SYMBOL_TRADE_STOPS_LEVEL); 0 means the broker sets no minimum.
        freeze_level:
          type:
          - integer
          - 'null'
          description: How close to the current price, in points, a pending order or a position's stops
            can no longer be changed (SYMBOL_TRADE_FREEZE_LEVEL); 0 means none.
        swap_long:
          type:
          - string
          - 'null'
          description: The swap a buy position pays or earns a night, in the unit swap_type names (SYMBOL_SWAP_LONG).
        swap_short:
          type:
          - string
          - 'null'
          description: As swap_long, for a sell position (SYMBOL_SWAP_SHORT)
        swap_type:
          type:
          - string
          - 'null'
          enum:
          - disabled
          - points
          - currency_symbol
          - currency_margin
          - currency_deposit
          - interest_current
          - interest_open
          - reopen_current
          - reopen_bid
          - null
          description: The unit of swap_long and swap_short (MT5 SYMBOL_SWAP_MODE 0-8, lower-cased).
        margin_initial:
          type:
          - string
          - 'null'
          description: The broker's initial margin setting for one lot (SYMBOL_MARGIN_INITIAL), in the
            unit the symbol's margin calculation mode uses; 0 when the broker leaves it to the calculation
            mode. To pre-check margin read margin_per_lot.
        margin_maintenance:
          type:
          - string
          - 'null'
          description: As margin_initial, the maintenance margin (SYMBOL_MARGIN_MAINTENANCE)
        margin_per_lot:
          type:
          - string
          - 'null'
          description: 'The margin one lot bought at the current ask holds, in the account currency, as
            the terminal computes it (order_calc_margin) with this account''s leverage. A quote figure
            like pip_value_per_lot: it moves with price and is not in spec_hash.'
        filling_modes:
          type:
          - array
          - 'null'
          items:
            type: string
            enum:
            - fok
            - ioc
            - boc
          description: 'The fill policies the broker allows besides return (SYMBOL_FILLING_MODE flags:
            fill or kill, immediate or cancel, book or cancel).'
        pip_value_per_lot:
          type:
          - string
          - 'null'
          description: 'from the terminal, never derived. A quote figure, not part of the specification:
            it moves with the exchange rate, is kept within the platform''s tolerance of the terminal''s
            own value for a watched symbol, and neither moves spec_hash nor raises symbol.spec_changed'
        spec_hash:
          type: string
          description: changes drive symbol.spec_changed. Taken over digits, contract_size, volume_min,
            volume_max, volume_step, trade_mode, margin_currency, profit_currency, point, tick_size, stops_level,
            freeze_level, swap_long, swap_short, swap_type, margin_initial, margin_maintenance and filling_modes;
            not over the quote figures pip_value_per_lot, tick_value and margin_per_lot
        trade_sessions:
          type:
          - array
          - 'null'
