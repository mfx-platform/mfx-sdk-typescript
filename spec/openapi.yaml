        The body is compared as its canonical JSON, and the SDK does this for the caller.'
    pathId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  headers:
    BudgetRemaining:
      description: The key's remaining request budget. Where requests are not counted yet, this is the
        key's configured allowance, and `X-MFX-Budget-Source` says so.
      schema:
        type: integer
        minimum: 0
    BudgetSource:
      description: '`counted` when the number is a measurement, `configured` when it is the key''s allowance,
