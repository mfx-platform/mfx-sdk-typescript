          $ref: '#/components/responses/Error'
    patch:
      tags:
      - terminals
      operationId: updateTerminal
      summary: Change a running terminal - today its refresh rate
      description: 'Written at once and applied by the terminal''s cell within a minute, without a restart.
        A rate faster than the farm''s is 422 with `details.allowed`. A faster rate that the terminal''s
        cell no longer has room for is 409 `no_room` with `details.fastest_that_fits`: the terminal is
        never moved to make room. Another tenant''s terminal is 404.'
      x-scope: term:write
      parameters:
      - $ref: '#/components/parameters/idempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TerminalUpdate'
      responses:
        '200':
          description: the terminal as changed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantTerminal'
        '409':
          description: no_room - details.fastest_that_fits
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: validation_error - faster than the tenant allows; details.allowed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        default:
          $ref: '#/components/responses/Error'
    delete:
      tags:
      - terminals
      operationId: retireTerminal
      summary: Retire a terminal — it drains, then retires; answered with its state now
      description: 'A terminal that is ACTIVE, OFFLINE, PARKED or still PROVISIONING (waiting for its
        login, for example for a credential) drains: its cell stops it and deletes its folder, and it
        is RETIRED when the cell confirms, or by the platform''s deadline when the cell never held it.
        One that is REQUESTED, FAILED or DRAINED is RETIRED at once. One that is LOGGING_IN drains as
        PROVISIONING does: its cell stops the login and deletes its folder. A login ends by itself within
        15 minutes: FAILED when it has not completed, at once when the broker refuses it. A FAILED terminal
        is tried again after `terminals.login_cooloff_minutes` (30), at most `terminals.login_cycles_per_day`
        (3) times a day, never after a refusal; retire the FAILED terminals you no longer need. MFX retires
        none of yours by itself. One already DRAINING or RETIRED is answered as it is. A cell stops terminals
        a few at a time, so that the ones still running on it are not slowed: when its cell has no slot
        for the stop now, the answer is the terminal as it is (ACTIVE, OFFLINE, PARKED, PROVISIONING or
        LOGGING_IN), its retire waits in the cell''s line with no deadline, and it moves to DRAINING at
        its turn by itself. The same request again answers the same retire. A cell that cannot be heard
        does not hold a stop: its terminals drain at once.'
      x-scope: term:write
      parameters:
      - $ref: '#/components/parameters/idempotencyKey'
      responses:
        '202':
          description: accepted; the terminal is DRAINING (or already RETIRED), or as it was while its
            retire waits for its cell's slot
          content:
