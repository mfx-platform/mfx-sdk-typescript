  /terminals:
    post:
      tags:
      - terminals
      operationId: createTerminal
      summary: Provision a terminal — answered at once in state REQUESTED; the move to a cell is asynchronous
      description: 'A broker whose permission is `unknown` is accepted in the development environment
        with the response header `X-MFX-Warning: broker_permission_unknown`, and refused `broker_not_supported`
        in production. Refused at request time, never passed to a terminal: an unsupported broker or server
        (422), a farm that does not carry the usages (409), a redundancy the farm does not offer (409).
        The credential is submitted separately (`POST /terminals/{id}/credentials`), so a terminal can
        exist before its login does. Several terminals may use the same broker login, on every plan: the
        limits are checked when the credential is submitted. A tenant with its own farms (enterprise and
        system plans) names the farm of every terminal: omitted, it is 422 `farm_required` with `details.farms`
        listing its farms taking terminals. For a standard tenant `farm_id` is optional: omitted, the
        platform chooses a shared farm and says which on the answer; none fits is 409 `no_farm`, with
        `details.why` one of `no_usage` (no farm you can use offers what this terminal needs), `no_region`
        (none in the server''s region) or `no_room`. `refresh_ms` faster than the farm''s rate is 422
        with `details.allowed`; with no farm named, only farms that allow the rate are considered. A changed
        rate a cell cannot carry is the PATCH''s 409 `no_room`; create queues the terminal for placement.
        The tenant''s plan decides the farm: enterprise and system tenants'' terminals go to their own
        farms, standard tenants'' to the shared farms. A named farm outside the plan is 409 `farm_not_in_plan`;
        with no farm named a standard tenant is given a shared farm. A tenant already at its terminal
        quota is 409 `quota_exceeded` with `details {quota, in_use}`.'
      x-scope: term:write
      parameters:
      - $ref: '#/components/parameters/idempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TerminalCreate'
      responses:
        '202':
          description: accepted, state REQUESTED
          headers:
            X-MFX-Budget-Remaining:
              $ref: '#/components/headers/BudgetRemaining'
            X-MFX-Budget-Source:
              $ref: '#/components/headers/BudgetSource'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantTerminal'
        '422':
          description: 'validation_error — the request names no broker or server MFX lists (an unknown
            or retired broker, a server of another broker), or asks a farm for a usage it does not offer;
            farm_required — a tenant with its own farms named no farm (details `{farms: [{id, slug}]}`).
            Rejected at request time, never passed to a terminal. A listed broker or server that MFX cannot
            use now is the 409 below'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: '`broker_not_supported` — MFX does not support this broker or this server now,
            and says why in words (`message` is the sentence the operator recorded). details: `{refused_by:
            permission | server_disabled, reason, broker_id, server_id}`. The SDK raises it as UnsupportedBrokerError.
            Other 409s (state_error, conflict) keep their codes.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        default:
          $ref: '#/components/responses/Error'
    get:
      tags:
      - terminals
      operationId: listTerminals
      summary: List the tenant's terminals, newest first (cursor pagination), filtered by label and state
      description: Every terminal of yours, RETIRED ones included, newest first. `label` and `state` narrow
        the list in the query, before the page is cut, so a filtered page is never short for being filtered.
      x-scope: term:read
      parameters:
      - $ref: '#/components/parameters/cursor'
      - $ref: '#/components/parameters/limit'
      - name: label
        in: query
        required: false
        description: 'key:value, the label''s exact key and value, case-sensitive. Repeat it to need several:
          a terminal is listed only when it carries every one. A value without a colon is 400 validation_error'
        schema:
          type: array
          items:
            type: string
            maxLength: 200
          maxItems: 10
        style: form
        explode: true
      - name: state
        in: query
        required: false
        description: one state, or several comma-separated
        schema:
          type: array
          items:
            type: string
            enum:
            - REQUESTED
            - QUEUED
            - PROVISIONING
            - LOGGING_IN
            - ACTIVE
            - OFFLINE
            - PARKED
            - DRAINING
            - DRAINED
            - RETIRED
            - FAILED
        style: form
        explode: false
      responses:
        '200':
          description: a page of terminals
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantTerminalPage'
        default:
          $ref: '#/components/responses/Error'
  /terminals:restart:
    post:
      tags:
