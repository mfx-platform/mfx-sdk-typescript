      operationId: getTerminalJournal
      summary: The terminal's MetaTrader journal, newest first - read live while it runs, its last lines
        for 24 hours after it stops
      description: 'While the terminal runs, the lines are read from its cell on request (`from: live`,
        within 10 s, as a quote is). When it has stopped, failed or been retired, the answer is the last
        lines its cell kept at the stop (`from: last_words`), kept 24 hours. Account numbers are masked
