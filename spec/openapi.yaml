        `running` (attach again once it is done), or `failed` with `failure` in plain words (the version
        is not attachable on that build; the same bundle uploaded again tries once more); 409 `ea_attached`
        when the terminal already carries one (detach it first); 404 for another tenant''s version, or
        a symbol the terminal''s server does not list. Then the seven rules of a governed operation, as
        on restartTerminal. The operation succeeds when the terminal produces again with the build loaded
