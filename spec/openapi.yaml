          - drain
          - swap
          description: 'swap (orchestrator): the terminal moved to its farm''s newer image or MetaTrader
            build, a stop and a cold start on its own cell, at the lowest priority of its cell''s line'
        state:
          type: string
          enum:
          - QUEUED
          - ACCEPTED
          - CLOSING
          - FORCED_STOP
          - RELAUNCHING
          - SUCCEEDED
          - FAILED
          - NOT_STARTED
          - EXPIRED
          - CANCELLED
          - SUPERSEDED
          description: As `TerminalOperation.state`
        step:
          type: string
          description: 'As `TerminalOperation.step`: the last step the cell reached, or on FAILED and
            NOT_STARTED what failed or refused; empty when none'
        forced_stop:
          type: string
          enum:
          - 'true'
          - 'false'
          - ''
          description: As `TerminalOperation.forced_stop`; empty until the cell says
        cooldown_until:
          type: string
          description: UTC date-time when the next restart of the terminal is allowed; empty when none
        finished_at:
          type: string
          description: UTC date-time when it ended; empty while it runs
    TerminalHaSwitched:
      example:
        schema_version: '1'
        terminal_id: 0e6a51a8-65f1-4f4c-9c53-3d6a2f6a0101
        reason: broker_lost
        at: '2026-11-01T22:04:31.120Z'
        took_ms: '40'
      type: object
      description: '`data` of a `terminal.ha_switched` message on the `events` channel: MFX Hub HA moved
        the terminal to its second terminal, which now carries its orders, quotes and account. The terminal''s
        id is the same before and after; nothing about the second terminal is sent. On the stream every
        value is text, as on every event.'
      required:
      - schema_version
      - terminal_id
      - reason
      - at
      - took_ms
      properties:
        schema_version:
          type: string
          description: The payload's version; 1
        terminal_id:
          type: string
          format: uuid
          description: The terminal, as you address it
        reason:
          type: string
          enum:
          - order
          - broker_lost
          - unresponsive
          - terminal_failed
          - process_gone
          - operator
          description: 'Why it switched. order: an order arrived while the first terminal could not carry
            it, and it was placed through the second. broker_lost: the first terminal lost its broker
            connection. unresponsive: the first terminal stopped reporting. terminal_failed and process_gone:
            the first terminal failed or its MetaTrader 5 process ended. operator: MFX Hub support switched
            it.'
        at:
          type: string
          description: UTC date-time of the switch, to the millisecond
        took_ms:
          type: string
          pattern: ^[0-9]+$
          description: Milliseconds the switch took, an integer as text
    AccountProfileChanged:
      example:
        schema_version: '1'
        terminal_id: 0e6a51a8-65f1-4f4c-9c53-3d6a2f6a0101
        currency: USD
        leverage: '500'
        company: Example Broker Ltd
        account_type: demo
        margin_mode: hedging
        trade_allowed: 'true'
        expert_allowed: 'true'
        changed: '["leverage"]'
        observed_at: '2026-10-23T09:00:00Z'
      type: object
      description: '`data` of an `account.profile_changed` message on the `events` channel: the terminal
        reads its account''s slow facts (`AccountProfile`) every 60 seconds and sends this when any of
        them differs from what it last read, and when it has no earlier reading to compare with. Every
        fact is sent as it now stands; `changed` names the ones that moved. A fact the terminal could
        not read is left out. On the stream every value is text, as on every event.'
      required:
      - schema_version
      - terminal_id
      - trade_allowed
      - expert_allowed
      - changed
      - observed_at
      properties:
        schema_version:
          type: string
          description: The payload's version; 1
        terminal_id:
          type: string
          format: uuid
        currency:
          type: string
          description: The account currency; absent when not read
        leverage:
          type: string
          pattern: ^[0-9]+$
          description: The account leverage, an integer as text (500 is 1:500); absent when not read
        company:
          type: string
          description: The broker's company name as MT5 gives it; absent when not read
        account_type:
          type: string
          enum:
          - demo
          - live
          - contest
          description: Absent when not read
        margin_mode:
          type: string
          enum:
          - netting
          - exchange
          - hedging
          description: Absent when not read
        trade_allowed:
          type: string
          enum:
          - 'true'
          - 'false'
          description: Whether the broker allows trading on the account
        expert_allowed:
          type: string
          enum:
          - 'true'
          - 'false'
          description: Whether the broker allows expert advisors to trade on the account
        changed:
          type: string
          description: 'A JSON array as text of the facts that moved since the last read: currency, leverage,
            company, account_type, margin_mode, trade_allowed, expert_allowed. All of them when there
            was no earlier reading'
        observed_at:
          type: string
          format: date-time
          description: When the terminal read them, UTC
    PositionClosePartial:
      type: object
      additionalProperties: false
      required:
      - volume
      properties:
        volume:
          type: string
          pattern: ^(0|[1-9][0-9]*)(\.[0-9]+)?$
          description: Lots to close, as a decimal string above zero; less than the position and on the
            symbol's step. Snapped onto the step first, then compared against the position, so the volume
            judged is the volume sent
        deviation_points:
          type: integer
          minimum: 0
          default: 20
        comment:
          type: string
          maxLength: 31
          description: Written on the closing deal, as on PositionClose; absent, the deal takes the position's
            own comment. The position keeps its own comment. Longer than 31 characters is refused
    CommandState:
      type: string
      description: 'Final states are SUCCEEDED, FAILED, EXPIRED and REJECTED. UNKNOWN is visible and NOT
        final: the order may have reached the broker and its outcome could not be read (a timeout after
        send, a lost connection). The platform asks the terminal that ran it to read its deal and order
        history again, every minute, until `resolve_by` (15 minutes after it became UNKNOWN by default),
        and the answer resolves it to SUCCEEDED, FAILED or REJECTED. `command.unknown` is sent when it
        becomes UNKNOWN and `command.resolved` when it is resolved. One still UNKNOWN at `resolve_by`
        stays UNKNOWN, because it may have run, and is resolved by an operator with the tenant. A client
        must not re-send an order whose command is UNKNOWN, because that is how one fill becomes two.
        A NOT_EXECUTED answer from the terminal reads REJECTED with its reason. SUCCEEDED means the broker
        did what the command asked: for a market order, filled; for a pending order (limit, stop, stop_limit),
        accepted onto the broker''s book with its ticket in `tickets.order` - not filled (OrderPlace).'
      enum:
      - ACCEPTED
      - ENQUEUED
      - DELIVERED
      - EXECUTING
      - SUCCEEDED
      - FAILED
      - EXPIRED
      - REJECTED
      - UNKNOWN
    CommandTickets:
      type: object
      description: 'MT5 relates exactly one order, one deal and one position per fill; a field is null
        where MT5 has none yet. A SUCCEEDED market order_place carries all three; a SUCCEEDED pending
        order_place (limit, stop, stop_limit) carries `order` only, the pending order''s ticket, with
        `deal` and `position` null: the fill comes later and is seen in deals and positions, not here
        (OrderPlace)'
      required:
      - order
      - deal
      - position
      properties:
        order:
          type:
          - integer
          - 'null'
          format: int64
        deal:
          type:
          - integer
          - 'null'
          format: int64
        position:
          type:
          - integer
          - 'null'
          format: int64
    CommandResult:
      type: object
      description: 'What happened at the broker, once the command has an outcome. `retryable` is set on
        every reason, so an SDK decides from the result and not from a table that can drift. It is written
        once, from the broker''s answer to the command: for a pending order_place that is the placement
        (`mt5_retcode` 10008, `tickets.order` set, no deal, no `exec_price`), and the later fill never
        rewrites it (OrderPlace says where the fill is seen).'
      required:
      - ok
      - reason
      - retryable
      - tickets
      - attempts
      properties:
        ok:
          type: boolean
        reason:
          type:
          - string
          - 'null'
          description: Granular reason; null when ok. Every reason, with whether it is retryable, its
            typical cause and what to do, is in the error catalogue at the root of this document
        retryable:
          type: boolean
          description: Whether sending the same order again, under a NEW Idempotency-Key, can succeed.
            Always false while the state is UNKNOWN
        mt5_retcode:
          type:
          - integer
          - 'null'
          description: MT5 TRADE_RETCODE_*; null when the command never reached the terminal
        retcode_text:
          type:
          - string
          - 'null'
        comment_raw:
          type:
          - string
          - 'null'
          description: The broker's own comment, verbatim
        terminal_state:
          type:
          - string
          - 'null'
          description: 'The terminal''s lifecycle state when the outcome was recorded: when the cell''s
            result arrived, or when the platform expired the command; null only when the terminal no longer
            exists'
        tickets:
          $ref: '#/components/schemas/CommandTickets'
        exec_price:
          type:
          - string
          - 'null'
          description: 'Decimal as a string: the fill price of a market order or close; on an amended
            pending order, its new price; null for a pending order''s placement'
        exec_volume:
          type:
          - string
          - 'null'
          description: 'Lots, decimal as a string: the filled volume of a market order or close; on a
            pending order''s placement, the order''s volume as the broker echoed it, or null - never a
            fill'
        broker_latency_ms:
          type:
          - integer
          - 'null'
        agent_latency_ms:
          type:
          - integer
          - 'null'
        attempts:
          type: integer
          minimum: 0
        rerouted_from:
          type:
          - string
          - 'null'
          format: uuid
          description: The terminal the command was first sent to, when a failover moved it
        idempotency_key:
          type: string
          description: The Idempotency-Key the command was sent with, so an outcome is joined to its intent
            without a lookup. Always served
        magic:
          type:
          - integer
          - 'null'
          description: 'The magic number the command sent to the broker: the one asked for on OrderPlace,
            0 when none was. Null for a command that carries none (a close keeps the position''s own magic,
            which the platform does not hold), and for a command that is not an order. Always served'
        comment:
          type:
          - string
          - 'null'
          description: 'The comment the command sent to the broker: the one asked for on OrderPlace, PositionClose
            or PositionClosePartial, empty for an order placed without one. Null when the command carried
            none (a close without a comment, on which the closing deal takes the position''s own). Always
            served'
        venue:
          type: string
          enum:
          - mt5
          - ctrader
          description: 'The venue that answered: the runner''s. A result from an MT5 cell is mt5'
        venue_code:
          type:
          - string
          - 'null'
          description: 'The venue''s own code for a refusal, verbatim, beside the classified `reason`
            (cTrader: its error code, such as NOT_ENOUGH_MONEY). Null on MT5, whose code is `mt5_retcode`,
            and when the venue gave none'
        deals:
          type:
          - array
          - 'null'
          description: 'Every deal the command made, in the order they were made: two for an emulated
            close-by (`close_by_emulated`), one for an order filled at once. Null on MT5, where `tickets.deal`
            is the one deal of the fill'
          items:
            type: object
            required:
            - deal
            - order
            - position
            - volume_units
            - price
            properties:
              deal:
                type: integer
                format: int64
              order:
                type:
                - integer
                - 'null'
                format: int64
              position:
                type:
                - integer
                - 'null'
                format: int64
              volume_units:
                type: string
                description: 'Decimal as a string: the deal''s volume in units of the instrument (100,000
                  for one lot of EURUSD at a lot size of 100,000)'
              price:
                type: string
                description: 'Decimal as a string: the deal''s price'
        volume_units:
          type:
          - string
          - 'null'
          description: 'Decimal as a string: the volume the command filled, in units of the instrument
            (the sum of `deals`). `exec_volume` stays in lots. Null on MT5 and when nothing filled'
        close_by_emulated:
          type: boolean
          description: True for a close-by the venue has no equivalent for, done as two closes (cTrader);
            false otherwise
        protection_not_set:
          type: boolean
          description: 'True when a market order filled but its stop loss or take profit could not be
            set on the new position (cTrader sets them after the fill): the position is open without them.
            False otherwise'
    Command:
      type: object
      required:
      - command_id
      - terminal_id
      - kind
      - state
      - final
      - created_at
      - updated_at
      - result
      properties:
        command_id:
          type: string
          format: uuid
        terminal_id:
          type: string
          format: uuid
        kind:
          type: string
          enum:
          - order_place
          - order_cancel
          - order_modify
          - position_modify
          - position_close
          - position_close_partial
          - position_close_by
          - trailing_stop_set
          - trailing_stop_clear
          - risk_sync
          description: 'What the command does. `risk_sync` is the platform''s own: it hands the cell the
            version of the risk policy in force on the account. A tenant never sends one and may see one
            by its id'
        state:
          $ref: '#/components/schemas/CommandState'
        final:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        expires_at:
          type:
          - string
          - 'null'
          format: date-time
          description: 'After this the command is EXPIRED and never executes: a cell refuses an envelope
            past it, and a command still on the platform is swept EXPIRED. It is the command''s deadline
            to reach the broker, not a pending order''s own `expires_at`. Set from the moment the command
            is accepted, by kind: 10 s for every execution kind (order_place, order_cancel, order_modify,
            position_modify, position_close, position_close_partial, position_close_by, trailing_stop_set,
            trailing_stop_clear), 30 s for risk_sync; an order_place may ask for 1 s to 60 s instead with
            `expires_in_ms`'
        result:
          oneOf:
          - $ref: '#/components/schemas/CommandResult'
          - type: 'null'
          description: Null until the command has an outcome
        resolve_by:
          type:
          - string
          - 'null'
          format: date-time
          description: 'While the command is UNKNOWN: until when the platform asks the terminal that ran
            it to read the outcome again. After it, an operator resolves it with the tenant. Null in every
            other state'
    CommandOutcome:
      type: object
      description: '`data` of a `command.completed` or `command.failed` message on the `events` channel
        and on `results:{terminal_id}`: sent once when a command reaches an outcome, `command.completed`
        for SUCCEEDED and `command.failed` for every other end (FAILED, EXPIRED, REJECTED). It carries
        what `GET /commands/{id}` serves as `result`. On the stream every value is text, `tickets` and
        `latencies` are JSON objects as text, and a value that does not exist is empty.'
      required:
      - schema_version
      - command_id
      - idempotency_key
      - terminal_id
      - state
      - retcode
      - reason
      - tickets
      - exec_price
      - exec_volume
      - latencies
      - terminal_state
      properties:
        schema_version:
          type: string
        command_id:
          type: string
          format: uuid
        idempotency_key:
          type: string
        terminal_id:
          type: string
          format: uuid
          description: 'The join key: the terminal the command ran on'
        state:
          $ref: '#/components/schemas/CommandState'
        retcode:
          type: string
          description: MT5 TRADE_RETCODE_*; empty when the command never reached the terminal
        reason:
          type: string
          description: Granular reason, never a bucket
        tickets:
          type: string
          description: CommandTickets as JSON text
        exec_price:
          type: string
          description: Decimal as a string; empty when nothing filled
        exec_volume:
          type: string
          description: Lots, decimal as a string; empty when nothing filled
        latencies:
          type: string
          description: 'JSON text: {"broker_ms": integer or null, "agent_ms": integer or null}'
        terminal_state:
          type: string
          description: 'The terminal''s lifecycle state when the outcome was recorded: when the cell''s
            result arrived, or when the platform expired the command. Empty only when the terminal no
            longer exists'
        magic:
          type: string
          description: 'CommandResult.magic as text: the magic number the command sent, as an integer
            in text; empty where CommandResult.magic is null. Always sent'
        comment:
          type: string
          description: 'CommandResult.comment: the comment the command sent; empty where it is null or
            the order was placed without one. Always sent'
    CommandUnknown:
      type: object
      description: '`data` of a `command.unknown` message on the `events` channel: sent when a command
        becomes UNKNOWN, from any state. Its outcome could not be read and it may have reached the broker,
        so it must not be sent again. The platform asks the terminal that ran it to read the outcome again
        until `resolve_by`; `command.resolved` follows when it is resolved. Values are text as in CommandOutcome;
        `state` is UNKNOWN.'
      required:
      - schema_version
      - command_id
      - idempotency_key
      - terminal_id
      - state
      - retcode
      - reason
      - tickets
      - exec_price
      - exec_volume
      - latencies
      - terminal_state
      - resolve_by
      properties:
        schema_version:
          type: string
        command_id:
          type: string
          format: uuid
        idempotency_key:
          type: string
        terminal_id:
          type: string
          format: uuid
          description: 'The join key: the terminal the command ran on'
        state:
          $ref: '#/components/schemas/CommandState'
        retcode:
          type: string
          description: As CommandOutcome.retcode
        reason:
          type: string
          description: As CommandOutcome.reason
        tickets:
          type: string
          description: CommandTickets as JSON text
        exec_price:
          type: string
          description: Decimal as a string; empty when nothing filled
        exec_volume:
          type: string
          description: Lots, decimal as a string; empty when nothing filled
        latencies:
          type: string
          description: 'JSON text: {"broker_ms": integer or null, "agent_ms": integer or null}'
        terminal_state:
          type: string
          description: As CommandOutcome.terminal_state
        magic:
          type: string
          description: As CommandOutcome.magic
        comment:
          type: string
          description: As CommandOutcome.comment
        resolve_by:
          type: string
          format: date-time
          description: Until when the platform asks the terminal again (the moment it became UNKNOWN plus
            the resolve window, 15 minutes by default). Still UNKNOWN after it, an operator resolves it
            with the tenant, and a later answer still sends command.resolved
    CommandResolved:
      type: object
      description: '`data` of a `command.resolved` message on the `events` channel: sent when an UNKNOWN
        command reaches its outcome (SUCCEEDED, FAILED or REJECTED), beside the `command.completed` or
        `command.failed` that outcome sends as always. Values are text as in CommandOutcome and describe
        the outcome.'
      required:
      - schema_version
      - command_id
      - idempotency_key
      - terminal_id
      - state
      - retcode
      - reason
      - tickets
      - exec_price
      - exec_volume
      - latencies
      - terminal_state
      - unknown_since
      properties:
        schema_version:
          type: string
        command_id:
          type: string
          format: uuid
        idempotency_key:
          type: string
        terminal_id:
          type: string
          format: uuid
          description: 'The join key: the terminal the command ran on'
        state:
          $ref: '#/components/schemas/CommandState'
        retcode:
          type: string
          description: As CommandOutcome.retcode
        reason:
          type: string
          description: As CommandOutcome.reason
        tickets:
          type: string
          description: CommandTickets as JSON text
        exec_price:
          type: string
          description: Decimal as a string; empty when nothing filled
        exec_volume:
          type: string
          description: Lots, decimal as a string; empty when nothing filled
        latencies:
          type: string
          description: 'JSON text: {"broker_ms": integer or null, "agent_ms": integer or null}'
        terminal_state:
          type: string
          description: As CommandOutcome.terminal_state
        magic:
          type: string
          description: As CommandOutcome.magic
        comment:
          type: string
          description: As CommandOutcome.comment
        unknown_since:
          type: string
          format: date-time
          description: When the command became UNKNOWN
    Position:
      type: object
      required:
      - ticket
      - symbol
      - side
      - volume
      - open_price
      - sl
      - tp
      - profit
      - swap
      - open_time
      - magic
      - comment
      properties:
        ticket:
          type: integer
          format: int64
        symbol:
          type: string
        side:
          type: string
          enum:
          - buy
          - sell
        volume:
          type: string
          description: Lots
        open_price:
          type: string
        sl:
          type:
          - string
          - 'null'
          description: Null when none
        tp:
          type:
          - string
          - 'null'
        price_current:
          type:
          - string
          - 'null'
          description: The price the floating profit is computed at; null when only position events are
            known
        profit:
          type:
          - string
          - 'null'
          description: Floating, in the account currency; null when only position events are known
        swap:
          type:
          - string
          - 'null'
        commission:
          type:
          - string
          - 'null'
          description: 'In the account currency: the commission the broker charged on the deals of this
            position so far, entry and any partial close (MT5 keeps it on the deals, not the position).
            Null when the broker reports none or the cell has not read the deals yet'
        margin:
          type:
          - string
          - 'null'
          description: 'In the account currency: the margin this position holds, as the terminal computes
            it for its volume at its open price (order_calc_margin). Null when the terminal cannot compute
            it; the account''s `margin` is the total the broker applies, which hedging rules may make
            less than the sum'
        open_time:
          type: string
          format: date-time
        magic:
          type: integer
        comment:
          type: string
        trailing_stop:
          description: The position's trailing stop, or null when it has none. The moving stop itself
            is `sl`
          oneOf:
          - $ref: '#/components/schemas/TrailingStop'
          - type: 'null'
    PositionList:
      type: object
      required:
      - as_of
      - items
      - stale
      properties:
        as_of:
          type: string
          format: date-time
          description: When the snapshot was taken on the terminal
        stale:
          type: boolean
          description: As Account.stale
        items:
          type: array
          items:
            $ref: '#/components/schemas/Position'
    PendingOrder:
      type: object
      required:
      - ticket
      - symbol
      - side
      - order_type
      - volume
      - price
      - sl
      - tp
      - placed_time
      - expires_at
      - magic
      - comment
      properties:
        ticket:
          type: integer
          format: int64
        symbol:
          type: string
        side:
          type: string
          enum:
          - buy
          - sell
        order_type:
          type: string
          enum:
          - limit
          - stop
          - stop_limit
        volume:
          type: string
        price:
          type: string
          description: On a stop-limit order, the stop price
        stop_limit_price:
          type:
          - string
          - 'null'
          description: A stop-limit order's second price, the limit order placed when the market reaches
            `price`; null on every other order
        sl:
          type:
          - string
          - 'null'
        tp:
          type:
          - string
          - 'null'
        placed_time:
          type: string
          format: date-time
        expires_at:
          type:
          - string
          - 'null'
          format: date-time
          description: Null means good till cancelled
        magic:
          type: integer
        comment:
          type: string
    PendingOrderList:
      type: object
      required:
      - as_of
      - items
      - stale
      properties:
        as_of:
          type: string
          format: date-time
          description: 'When the cell last read the pending orders: on a position change, or every 5 s'
        stale:
          type: boolean
          description: As Account.stale
        items:
          type: array
          items:
            $ref: '#/components/schemas/PendingOrder'
    Deal:
      type: object
      required:
      - deal
      - order
      - position
      - symbol
      - side
      - entry
      - volume
      - price
      - profit
      - commission
      - swap
      - time
      - magic
      - comment
      - close_reason
      properties:
        deal:
          type: integer
          format: int64
        order:
          type:
          - integer
          - 'null'
          format: int64
        position:
          type:
          - integer
          - 'null'
          format: int64
        symbol:
          type: string
        side:
          type: string
          enum:
          - buy
          - sell
        entry:
          type: string
          enum:
          - in
          - out
          - inout
        volume:
          type: string
        price:
          type: string
        profit:
          type: string
        commission:
          type: string
        swap:
          type: string
        fee:
          type:
          - string
          - 'null'
          description: The broker's fee on this deal (MT5 DEAL_FEE), in the account currency; null from
            a cell that does not send it
        balance:
          type:
          - string
          - 'null'
          description: 'The account balance just after this deal, in the account currency: the balance
            when the history was read, less every deal after this one (profit, commission, swap and fee,
            balance deals included). Null when the cell could not read the later deals consistently'
        sl:
          type:
          - string
          - 'null'
          description: 'On a closing deal (`entry` out or inout), the stop loss the position had when
            it closed: the last one the platform recorded for it (position events and account snapshots).
            MT5 keeps no stop on a deal or on its closing order, so null on an entry deal, when the position
            had none, or when the platform never saw it open'
        tp:
          type:
          - string
          - 'null'
          description: As `sl`, for the take profit
        time:
          type: string
          format: date-time
          description: When the broker executed the deal, in UTC (converted from the broker server's own
            clock)
        magic:
          type: integer
        comment:
          type: string
        close_reason:
          type:
          - string
          - 'null'
          enum:
          - client
          - expert
          - sl
          - tp
          - stop_out
          - rollover
          - vmargin
          - split
          - mobile
          - web
          - null
          description: MT5 DEAL_REASON; null on an entry deal
    DealPage:
      type: object
      required:
      - items
      - next_cursor
      description: Newest first by (time, deal), inside the requested from/to
      properties:
        next_cursor:
          type:
          - string
          - 'null'
          description: Opaque (created_at, id) cursor for the following page; null on the last page
        returned:
          type: integer
          description: How many items are in THIS page; never a total
        items:
          type: array
          items:
            $ref: '#/components/schemas/Deal'
    Candle:
      type: object
      required:
      - ts
      - o
      - h
      - l
      - c
      - v
      properties:
        ts:
          type: string
          format: date-time
          description: Bar open time, UTC
        o:
          type: string
        h:
          type: string
        l:
          type: string
        c:
          type: string
        v:
          type: integer
          description: Tick volume
    CandleList:
      type: object
      required:
      - items
      properties:
        items:
          type: array
          maxItems: 1000
          items:
            $ref: '#/components/schemas/Candle'
          description: Oldest first by bar time; at most 1000 bars per call
        source:
          type: string
          enum:
          - store
          - terminal
          - store+terminal
          description: 'Where the bars came from: the platform''s store (no cell), one of your terminals,
            or closed bars from the store and the forming bar from a terminal'
        complete_from:
          type: string
          format: date-time
          nullable: true
          description: 'For an answer from the store: the oldest bar of the span the platform vouches
            holds every bar'
        complete_to:
          type: string
          format: date-time
          nullable: true
          description: 'For an answer from the store: the newest bar of that span. Holding bars up to
            it, you are missing none. Older than the last closed boundary while a gap is repaired, with
            Retry-After'
    MdCandleClosed:
      type: object
      description: 'md.candle_closed on candles:{server_id}:{symbol}:{tf}: a closed bar, once, read by
        one of your own terminals. Never replayed; prev_ts tells you whether you missed one'
      required:
      - schema_version
      - server_id
      - symbol
      - timeframe
      - ts
      - o
      - h
      - l
      - c
      - v
      - prev_ts
      properties:
        schema_version:
          type: string
          example: '1'
        server_id:
          type: string
          format: uuid
        symbol:
          type: string
          description: The broker's own name
        timeframe:
          type: string
          enum:
          - M1
          - M5
          - M15
          - M30
          - H1
          - H4
          - D1
          - W1
          - MN1
        ts:
          type: string
          format: date-time
          description: Bar open time, UTC; a D1 bar opens at the broker's midnight
        o:
          type: string
        h:
          type: string
        l:
          type: string
        c:
          type: string
        v:
          type: integer
          description: Tick volume
        prev_ts:
          type: string
          format: date-time
          description: 'Open time of the bar before this one in the terminal''s history. Not the ts of
            the last bar you hold: you missed bars; read GET /v1/md/candles from your last ts'
    Tick:
      type: object
      required:
      - ts
      - bid
      - ask
      - last
      - volume
      properties:
        ts:
          type: string
          format: date-time
          description: The tick's time, UTC, to the millisecond
        bid:
          type: string
        ask:
          type: string
        last:
          type:
          - string
          - 'null'
          description: The last deal's price where the broker sends one; null otherwise (most FX)
        volume:
          type:
          - string
          - 'null'
          description: The last deal's volume where the broker sends one
    TickList:
      type: object
      required:
      - items
      - more
      properties:
        items:
          type: array
          maxItems: 1000
          items:
            $ref: '#/components/schemas/Tick'
          description: Oldest first; the first ticks at or after `from`
        more:
          type: boolean
          description: True when the window holds ticks beyond these. Ask again with `from` set to the
            last tick's `ts` and drop the ticks of that millisecond you already hold
    BookMessage:
      type: object
      description: '`data` of an `md.book` message on `book:{server_id}:{symbol}`: the symbol''s whole
        order book as one of the tenant''s terminals read it, best price first on each side. Replace your
        book with every message. The terminal reads at its refresh rate and sends a book only when it
        differs from the last it sent, so two changes inside one read are one book. `seq` increases as
        on `md:`; a gap is a book that was superseded before it reached you. Not a reconstruction: MFX
        Hub builds no book from ticks or from several terminals.'
      required:
      - schema_version
      - bids
      - asks
      - broker_ts
      - levels
      properties:
        schema_version:
          type: string
          description: The payload's version; 1
        bids:
          type: array
          maxItems: 64
          description: 'Buy orders, highest price first, at most `levels`: `[price, volume]`, decimals
            as strings'
          items:
            type: array
            minItems: 2
            maxItems: 2
            items:
              type: string
        asks:
          type: array
          maxItems: 64
          description: 'Sell orders, lowest price first, at most `levels`: `[price, volume]`, decimals
            as strings'
          items:
            type: array
            minItems: 2
            maxItems: 2
            items:
              type: string
        broker_ts:
          type: string
          description: When the terminal read the book, on the broker's clock, to the millisecond (as
            a tick's `broker_ts`)
        levels:
          type: integer
          minimum: 1
          description: 'The most levels a side the platform reads: a side shorter than this is the whole
            of that side of the broker''s book'
    MdStatusMessage:
      type: object
      description: '`data` of an `md.status` message on an `md:`, `candles:` or `book:` channel: whether
        the tenant''s market data is held by a planned maintenance window. A window in progress that suspends
        `market_data` for the tenant sends `maintenance` on each of its open market data channels, and
        on each one subscribed or resumed while it holds (after the `ack`); no tick, candle or book is
        sent on them until it ends, and none of what arrived meanwhile is replayed. When the window ends,
        or the platform can no longer tell that it holds (maintenance fails open), `live` is sent and
        data flows again; a `book:` channel then sends the newest book first. A change of the window''s
        end while it holds sends `maintenance` again with the new `ends_at`. The channel stays subscribed
        throughout; nothing is sent while the data is not held, so a channel that never sees one is live.
        `events`, `results:`, `account:` and `ea:` are not held by `market_data`.'
      required:
      - schema_version
      - status
      - window_id
      - window
      - ends_at
      properties:
        schema_version:
          type: string
          description: The payload's version; 1
        status:
          type: string
          enum:
          - maintenance
          - live
          description: '`maintenance` while a window holds the channel''s data; `live` once it no longer
            does'
        window_id:
          type:
          - string
          - 'null'
          format: uuid
          description: The window that holds it (where two do, the one ending last); null when `live`
        window:
          type:
          - string
          - 'null'
          description: Its label, as the maintenance reads name it (`MW-0031`); null when `live`
        ends_at:
          type:
          - string
          - 'null'
          format: date-time
          description: 'The window''s current end: its ETA while it runs, else its announced end; null
            when `live`'
    ExpertAdvisorStateChanged:
      type: object
      description: '`data` of an `expert_advisor.state_changed` message on the `events` channel: sent
        once when a version of the tenant''s EA takes a new state the platform gave it: its verdict (`approved`,
        `held` or `rejected`), and `revoked` when an operator takes it off every terminal. The report
        is read with `GET /expert-advisors/{id}/report` and an operator''s reason on the version (`decision`);
        the event carries no finding and no source.'
      required:
      - schema_version
      - expert_advisor_id
      - name
      - version
      - state
      - changed_at
      properties:
        schema_version:
          type: string
        expert_advisor_id:
          type: string
          format: uuid
        name:
          type: string
        version:
          type: integer
          description: Counts the uploads under this name, from 1
        state:
          type: string
          enum:
          - uploaded
          - analysing
          - judged
          - held
          - approved
          - rejected
          - withdrawn
          - revoked
        verdict:
          $ref: '#/components/schemas/EaColour'
        changed_at:
          type: string
          format: date-time
        uploaded_by_operator:
          type: string
          enum:
          - 'true'
          description: Present, and true, on the uploaded message of a version the platform operator uploaded
            for you. Absent otherwise
    ExpertAdvisorAttachmentChanged:
      type: object
      description: '`data` of an `expert_advisor.attachment_changed` message on the `events` channel:
        sent once each time an EA on one of the tenant''s terminals takes a new state: its trial started
        (`trial`), ended green on a real-money account and waits for the representative (`awaiting_confirmation`),
        went live (`running`), or ended (`detached`). `reason` says why when the platform ended it; it
        is null for the tenant''s own detach. The trial''s figures and verdict are read on the version
        (`TenantExpertAdvisor.terminals[].trial`).'
      required:
      - schema_version
      - terminal_id
      - expert_advisor_id
      - attachment_id
      - state
      - was
      - changed_at
      properties:
        schema_version:
          type: string
        terminal_id:
          type: string
          format: uuid
        expert_advisor_id:
          type: string
          format: uuid
        attachment_id:
          type: string
          format: uuid
          description: One attach of a version to a terminal; a new attach is a new id
        state:
          type: string
          enum:
          - deploying
          - trial
          - awaiting_confirmation
          - running
          - detached
        was:
          type:
          - string
          - 'null'
          enum:
          - deploying
          - trial
          - awaiting_confirmation
          - running
          - null
          description: The state before; null when the attachment was made
        reason:
          type:
          - string
          - 'null'
          enum:
          - trial_failed
          - confirmation_expired
          - revoked
          - terminal_retired
          - attach_failed
          - null
          description: Why the platform ended it; null for the tenant's own detach and for every state
            but detached
        changed_at:
          type: string
          format: date-time
    EaTelemetryMessage:
      type: object
      description: '`data` of an `expert_advisor.telemetry` message on an `ea:` channel: a batch of records
        the tenant''s EA wrote, in the order written. Delivery is at least once: after the cell restarts
        a file is sent again from its start, and `segment` with `line` is what a client drops a repeat
        on. `skipped` and `dropped` are counts since the message before, so nothing is left out in silence.'
      required:
      - schema_version
      - records
      - skipped
      - dropped
      properties:
        schema_version:
          type: string
          description: The payload's version; 1
        records:
          type: array
          maxItems: 100
          items:
            type: object
            required:
            - segment
            - line
            - record
            properties:
              segment:
                type: integer
                minimum: 0
                description: The number of the EA's telemetry file the record is from
              line:
                type: integer
                minimum: 0
                description: The record's line in that file
              record:
                type: object
                additionalProperties: true
                description: The JSON object the EA wrote, as it wrote it. The platform does not read
                  it for meaning, log it or store it
        skipped:
          type: integer
          minimum: 0
          description: 'Lines the cell could not read: too long, too deep or not JSON'
        dropped:
          type: integer
          minimum: 0
          description: 'Records the platform left out: over the largest record, deeper than eight levels,
            or over the terminal''s pace for the minute'
    EaTelemetryLostMessage:
      type: object
      description: '`data` of an `expert_advisor.telemetry_lost` message on an `ea:` channel, in sequence
        where the records would have been: the EA wrote faster than its records could be delivered, the
        cell''s allowance for the backlog was full, and the oldest waiting files were discarded. Trading
        is never held for telemetry.'
      required:
      - schema_version
      - segment_from
      - segment_to
      - records
      properties:
        schema_version:
          type: string
          description: The payload's version; 1
        segment_from:
          type: integer
          minimum: 0
        segment_to:
          type: integer
          minimum: 0
        records:
          type: integer
          minimum: 0
          description: How many records the discarded files held
    AccountSnapshotMessage:
      type: object
      description: '`data` of an `account.snapshot` on `account:{terminal_id}`: the whole account. Replace
        your view with every snapshot, whatever its `seq`: the channel''s `seq` starts again from 1 when
        the terminal has been quiet for 180 s. Sent on every `subscribe` and `resume` (the platform''s
        current copy), when the position set changes (a ticket opens or closes, SL, TP or volume changes)
        and every 60 s while positions are open. Decimals are strings, as everywhere in this API.'
      required:
      - terminal_id
      - schema_version
      - as_of
      - balance
      - equity
      - margin
      - margin_free
      - margin_level
      - open_positions_count
      - positions
      - pending
      - pending_as_of
      properties:
        terminal_id:
          type: string
          format: uuid
        schema_version:
          type: string
          description: The payload's version; 1
        as_of:
          type: string
          format: date-time
          description: The cell's instant of the reading
        balance:
          type: string
          description: Decimal as a string, in the account currency
        equity:
          type: string
        margin:
          type: string
        margin_free:
          type: string
        margin_level:
          type:
          - string
          - 'null'
          description: Null with no open positions
        open_positions_count:
          type: integer
        positions:
          type: array
          items:
            $ref: '#/components/schemas/Position'
          description: Every open position, by ticket
        pending:
          type: array
          items:
            $ref: '#/components/schemas/PendingOrder'
          description: Every pending order as of `pending_as_of`; empty when none was ever read
        pending_as_of:
          type:
          - string
          - 'null'
          format: date-time
          description: When the cell last read the pending orders (on a position change, or every 5 s);
            null when it never has
    AccountMarksMessage:
      type: object
      description: '`data` of an `account.marks` on `account:{terminal_id}`: between snapshots, at the
        terminal''s refresh rate while positions are open and only when something moved, the figures and
        one mark per position whose values changed since the last message. Every 5 s with nothing moved,
        a keep-alive: the figures and an empty `marks`. Apply it only to the snapshot its `base` names
        (`StreamServerMessage.base`): set each ticket''s `price_current`, `profit` and `swap`, and the
        figures. A ticket you do not hold means your view is behind: ignore the message and resume, or
        wait for the next snapshot.'
      required:
      - terminal_id
      - schema_version
      - as_of
      - balance
      - equity
      - margin
      - margin_free
      - margin_level
      - open_positions_count
      - marks
      properties:
        terminal_id:
          type: string
          format: uuid
        schema_version:
          type: string
          description: The payload's version; 1
        as_of:
          type: string
          format: date-time
        balance:
          type: string
        equity:
          type: string
        margin:
          type: string
        margin_free:
          type: string
        margin_level:
          type:
          - string
          - 'null'
        open_positions_count:
          type: integer
          description: 'The snapshot''s: a change in the position set is sent as a snapshot, never as
            marks'
        marks:
          type: array
          description: One `[ticket, price_current, profit, swap]` per moved position; empty on a keep-alive
          items:
            type: array
            minItems: 4
            maxItems: 4
            items:
              type:
              - integer
              - string
              description: 'A generator that does not read prefixItems sees this: the ticket is the integer,
                the rest are decimal strings'
            prefixItems:
            - type: integer
              format: int64
              description: ticket
            - type: string
              description: price_current, decimal as a string
            - type: string
              description: profit, floating, in the account currency
            - type: string
              description: swap
    TenantBroker:
