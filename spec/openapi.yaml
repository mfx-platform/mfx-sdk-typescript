        type: string
        enum:
        - counted
        - configured
        - unconfigured
    RetryAfter:
      description: Seconds to wait before retrying (429, and 503 dependency_unavailable)
      schema:
        type: integer
        minimum: 0
  responses:
    Accepted:
      description: Accepted — asynchronous; progress via events
    CommandAccepted:
      description: 'The command is persisted before anything is queued. A repeated `Idempotency-Key` with
        the same body returns the original command with `duplicate: true` and the same status, never a
        second command; with a different body it is 409 (see the Idempotency-Key parameter).'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CommandAccepted'
    Error:
      description: MfxError envelope — ValidationError 400 · AuthError 401 · ForbiddenError 403 · NotFoundError
        404 · ConflictError/StateError 409 · PlacementError 409 · RateLimitError 429 (Retry-After) · UpstreamError
        503 (never 502 or 504) · DependencyUnavailableError 503 (Retry-After; the request was valid and
