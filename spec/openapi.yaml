            X-MFX-Budget-Source:
              $ref: '#/components/headers/BudgetSource'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantTerminal'
        '422':
          description: validation_error — the request names no broker or server MFX lists (an unknown
            or retired broker, a server of another broker), or asks a farm for a usage it does not offer.
            Rejected at request time, never passed to a terminal. A listed broker or server that MFX cannot
            use now is the 409 below
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: '`broker_not_supported` — MFX does not support this broker or this server now,
            and says why in words (`message` is the sentence the operator recorded). details: `{refused_by:
            permission | server_disabled, reason, broker_id, server_id}`. The SDK raises it as UnsupportedBrokerError.
            Other 409s (state_error, conflict) keep their codes.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        default:
          $ref: '#/components/responses/Error'
    get:
      tags:
