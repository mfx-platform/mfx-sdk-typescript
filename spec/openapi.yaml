        refused. grey: nothing could be judged yet. The verdict of a version is its worst finding under
        the policy version it was judged by.'
    EaRuleGroup:
      type: string
      enum:
      - security
      - threat
      - performance
      - trading
      - interface
      - contract_build
      - best_practice
    EaFinding:
      type: object
      description: One finding of a report. `evidence` is quoted from the source at the lines named; a
        finding of the AI review whose evidence is not there is dropped before the report is made. A found
        secret is masked wherever it appears.
      required:
      - rule_id
      - group
      - name
      - colour
      - found_by
      - file
      - line_from
      - line_to
      - evidence
      - why
      - change
      properties:
        rule_id:
          type: string
          description: e.g. SEC-06
        group:
          $ref: '#/components/schemas/EaRuleGroup'
        name:
          type: string
          description: The rule in an operator's words
        colour:
          type: string
          enum:
          - red
          - amber
          - note
          - grey
          description: 'Under the report''s policy version. grey: the check could not be made on this
            file'
        found_by:
          type: string
          enum:
          - rules
          - scan
          - build
          - review
          - trial
        file:
          type:
          - string
          - 'null'
          description: The file of the bundle; null for a finding of the scan or the trial
        line_from:
          type:
          - integer
          - 'null'
        line_to:
          type:
          - integer
          - 'null'
        evidence:
          type:
          - string
          - 'null'
          description: The lines quoted, or the figure measured
        why:
          type: string
          description: Why it matters, in plain words
        change:
          type:
          - string
          - 'null'
          description: What the tenant should change
    EaTrialFigure:
      type: object
      description: One thing a trial measured, with the platform's grade. Show `display` in the colour
        of `grade` and work nothing out yourself.
      required:
      - key
      - label
      - value
      - display
      - grade
      properties:
        key:
          type: string
          enum:
          - cpu_avg
          - cpu_peak
          - memory_added
          - objects_added
          - disk_written
          - orders_peak
          - heartbeat
        label:
          type: string
          description: e.g. Processor, worst minute
        value:
          type:
          - number
          - 'null'
          description: Null until the cell has reported it. While the trial runs, the figure so far
        display:
          type:
          - string
          - 'null'
          description: The value as the page shows it, e.g. "41 % of its cap" or "every time"
        grade:
          type:
          - string
          - 'null'
          enum:
          - green
          - amber
          - red
          - null
          description: Against the trial line in force when it was judged; null while there is no value,
            and while the trial runs
    EaTrialCount:
      type: object
      description: 'How this version''s trials went, shown beside its colour: a trial colours the terminal''s
        attachment, not the version, so the version says how many of its terminals'' trials failed out
        of those judged. Every attachment of the version counts, on a terminal now or ended. Absent from
        older answers'
      required:
      - failed
      - judged
      properties:
        failed:
          type: integer
          description: Trials judged amber, red or grey
        judged:
          type: integer
          description: Trials judged; one still running, or ended before it was judged, is not counted
    EaTrial:
      type: object
      description: A trial with trading off on one terminal
      required:
      - state
      - started_at
      - ended_at
      - minutes
      - verdict
      - figures
      properties:
        state:
          type: string
          enum:
          - running
          - ended
        started_at:
          type: string
          format: date-time
        ended_at:
          type:
          - string
          - 'null'
          format: date-time
        minutes:
          type: integer
          description: The trial length in force when it started
        verdict:
          oneOf:
          - $ref: '#/components/schemas/EaColour'
          - type: 'null'
          description: Null while it runs, and for a trial that ended before it was judged (you detached
            the expert during it)
        figures:
          type: array
          items:
            $ref: '#/components/schemas/EaTrialFigure'
          description: 'Always the seven, in the order of `key`''s values: the figures so far while it
            runs, the judged ones once it has ended'
    EaReport:
      type: object
      description: 'The report of one version: the same one the tenant reads through the API and receives
        by email.'
      required:
      - policy_version
      - verdict
      - categories
      - findings
      - summary
      properties:
        policy_version:
          type: integer
          description: The policy version it was judged by
        verdict:
          $ref: '#/components/schemas/EaColour'
        categories:
          type: array
          description: One entry for each rule group, in the register's order
          items:
            type: object
            required:
            - group
            - colour
            - findings
            properties:
              group:
                $ref: '#/components/schemas/EaRuleGroup'
              colour:
                $ref: '#/components/schemas/EaColour'
              findings:
                type: integer
        findings:
          type: array
          items:
            $ref: '#/components/schemas/EaFinding'
        summary:
          type:
          - string
          - 'null'
          description: The AI review's paragraph for the tenant; null where it did not run
        trial:
          oneOf:
          - $ref: '#/components/schemas/EaReportTrial'
          - type: 'null'
          description: 'The newest judged trial of this version: its verdict, what it found and its figures.
            The version''s own verdict, findings and categories stay those of its checks; a trial is judged
            on one terminal. Null until a trial has been judged, and absent from older answers'
    EaReportTrial:
      type: object
      description: One judged trial, as the report carries it
      required:
      - terminal_id
      - ended_at
      - verdict
      - findings
      - reason
      - figures
      properties:
        terminal_id:
          type: string
          format: uuid
        ended_at:
          type: string
          format: date-time
          description: When it was judged
        verdict:
          $ref: '#/components/schemas/EaColour'
        findings:
          type: array
          items:
            $ref: '#/components/schemas/EaFinding'
          description: 'One for each trial rule its figures crossed, `found_by` trial, with the figure
            measured and the line in `evidence`. Empty on a green trial, and on one that failed because
            nothing was measured or the wrong build was loaded: `reason` says which'
        reason:
          type:
          - string
          - 'null'
          description: Why it was not green, in one line; null on a green trial
        figures:
          type: array
          items:
            $ref: '#/components/schemas/EaTrialFigure'
          description: The seven, as judged
paths:
  /terminals:
    post:
      tags:
      - terminals
      operationId: createTerminal
      summary: Provision a terminal — answered at once in state REQUESTED; the move to a cell is asynchronous
      description: 'A broker whose permission is `unknown` is accepted in the development environment
        with the response header `X-MFX-Warning: broker_permission_unknown`, and refused `broker_not_supported`
        in production. Refused at request time, never passed to a terminal: an unsupported broker or server
        (422), a farm that does not carry the usages (409), a redundancy the farm does not offer (409).
        The credential is submitted separately (`POST /terminals/{id}/credentials`), so a terminal can
        exist before its login does. Several terminals may use the same broker login, on every plan: the
        limits are checked when the credential is submitted. `farm_id` is optional: omitted, the platform
        chooses a farm and says which on the answer; none fits is 409 `no_farm`, with `details.why` one
        of `no_usage` (no farm you can use offers what this terminal needs), `no_region` (none in the
        server''s region) or `no_room`. `refresh_ms` faster than the farm''s rate is 422 with `details.allowed`;
        with no farm named, only farms that allow the rate are considered. A changed rate a cell cannot
        carry is the PATCH''s 409 `no_room`; create queues the terminal for placement. The tenant''s plan
        decides the farm: enterprise and system tenants'' terminals go to their own farms, standard tenants''
        to the shared farms. A named farm outside the plan is 409 `farm_not_in_plan`; with no farm named
        the platform chooses within the plan. A tenant already at its terminal quota is 409 `quota_exceeded`
        with `details {quota, in_use}`.'
      x-scope: term:write
      parameters:
      - $ref: '#/components/parameters/idempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TerminalCreate'
      responses:
        '202':
          description: accepted, state REQUESTED
          headers:
