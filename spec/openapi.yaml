    post:
      tags:
      - terminals
      operationId: setTerminalHa
      summary: Turn MFX Hub HA on or off for a terminal, or change its mode
      description: 'On, MFX Hub creates a second terminal on the same broker login, on separate hardware
        in the terminal''s farm, and keeps it ready (`ha.fallback_state`); the terminal''s id answers
        as before. Off, the second terminal is retired. Sent again, the same ask changes nothing. Refused:
        a plan that does not include HA (403 `forbidden`, `details.reason` `ha_not_in_plan`); a terminal
        that is not REQUESTED, PROVISIONING, LOGGING_IN, ACTIVE or OFFLINE (409 `state_error`); a terminal
        carrying an expert advisor, or on a farm that runs customer code (409 `conflict`, `details.reason`
        `ea_attached` or `customer_code_farm`); a login whose broker is not known to allow one more session
        (409 `placement_error`, `details.reason` `login_session_limit`); warm mode, not offered yet (422
        `unprocessable`). While HA is on, attaching an expert advisor is 409 `conflict` with `details.reason`
        `ha_on`.'
      x-scope: term:write
      parameters:
      - $ref: '#/components/parameters/idempotencyKey'
      requestBody:
