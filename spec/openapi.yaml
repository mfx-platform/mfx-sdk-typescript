          type: boolean
          default: false
      - name: confirm_open_positions
        in: query
        required: false
        schema:
          type: boolean
          default: false
      responses:
        '202':
          description: accepted; follow it at operations/{operation_id} or on the event stream
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationAccepted'
        default:
          $ref: '#/components/responses/Error'
  /terminals/{id}/expert-advisor/confirm:
