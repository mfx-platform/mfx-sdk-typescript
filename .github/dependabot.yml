# Weekly update proposals for the npm dependencies (from package-lock.json) and the pinned actions.
# This repository is published from the one the SDK is developed in, so a proposal here is applied
# there and arrives with the next release; the pull request is then closed with a link to it.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      npm:
        patterns: ["*"]
    # @types/node stays on the oldest Node.js line the SDK supports (engines: 22), so code that
    # needs a newer Node.js fails the type check instead of failing for a user on Node.js 22.
    ignore:
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
    # A new major version of an action changes its inputs or its runtime: taken on purpose, with
    # the workflows checked, not merged as a routine update.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
