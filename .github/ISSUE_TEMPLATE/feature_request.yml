name: Feature request
description: Something the SDK should make easier.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What you are trying to do
      description: The task, not the solution. What is hard or impossible today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would help
      description: The method, parameter or behaviour you have in mind, if any.
  - type: textarea
    id: today
    attributes:
      label: How you do it today
      description: A workaround, or a direct API call, if you have one.
